  return `
    <div class="studio-grid ${state.sidebarHidden ? "sidebar-collapsed" : ""}">
      <aside class="outline-sidebar" aria-label="Lesson Outline">
        <div class="outline-head">
          <span>${sub.code} Syllabus Deck</span>
          <span class="tabular">${idx + 1}/${sub.slides.length}</span>
        </div>
        ${sub.slides.map((s, i) => `
          <button type="button" data-jump="${i}" class="outline-item jump-btn ${i === idx ? "active" : ""} ${state.checkedTopics[s.topicId] ? "mastered" : ""}">
            <span class="outline-num">${state.checkedTopics[s.topicId] ? "✓" : i + 1}</span>
            <span>${escHtml(s.title.replace(/^\d+\.\s*/, ""))}</span>
          </button>
        `).join("")}
      </aside>

      <div style="display:flex;flex-direction:column;gap:12px;min-width:0;">
        <div class="mobile-slide-strip">
          ${sub.slides.map((s, i) => `
            <button type="button" data-jump="${i}" class="ms-pill jump-btn ${i === idx ? "active" : state.checkedTopics[s.topicId] ? "mastered" : ""}">
              ${i + 1}. ${escHtml(s.title.replace(/^\d+\.\s*/, "").slice(0, 22))}${s.title.length > 25 ? "..." : ""}
            </button>
          `).join("")}
        </div>

        <article id="slide-card" class="stage-card">
          <div class="stage-accent-bar"></div>
          <div class="stage-header">
            <div style="min-width:0;">
              <div class="stage-eyebrow">${sub.code} &bull; ${escHtml(slide.tag)} &bull; Lesson ${idx + 1} of ${sub.slides.length}</div>
              <h1 class="stage-title">${escHtml(slide.title)}</h1>
            </div>
            <button id="toggle-slide-topic" type="button" class="master-btn ${mastered ? "active" : ""}">
              ${mastered ? "Topic Mastered ✓" : "Mark Topic Mastered"}
            </button>
          </div>

          <div class="stage-body">
            <div class="intuition-box">
              <div class="section-kicker" style="color:var(--sub-accent);">Plain-English Intuition</div>
              <p class="intuition-text">${formatRich(slide.intuition)}</p>
            </div>

            ${slide.svg ? `<div class="svg-stage">${slide.svg}</div>` : ""}

            ${slide.table ? `
              <div class="table-box">
                <table>
                  <thead><tr>${slide.table.headers.map(h => `<th>${escHtml(h)}</th>`).join("")}</tr></thead>
                  <tbody>${slide.table.rows.map(r => `<tr>${r.map(c => `<td>${formatRich(c)}</td>`).join("")}</tr>`).join("")}</tbody>
                </table>
              </div>` : ""}

            <ul class="concept-list">
              ${slide.bullets.map(b => `
                <li class="concept-item">
                  <span class="concept-dot"></span>
                  <div class="bullet-body">${formatRich(b)}</div>
                </li>`).join("")}
            </ul>

            ${wt ? `
              <div class="walk-card">
                <div class="walk-head">
                  <span style="font-size:0.8rem;font-weight:800;">Worked IIITDM Walkthrough</span>
                  <span class="walk-src">${escHtml(wt.source)}</span>
                </div>
                <div class="walk-body">
                  <div class="walk-prob">${formatRich(wt.problem)}</div>
                  ${wt.code ? highlightC(wt.code) : ""}
                  <div style="display:flex;flex-direction:column;gap:8px;">
                    ${wt.steps.map((st, si) => `
                      <div class="step-row">
                        <span class="step-num">${si + 1}</span>
                        <div class="step-body">${formatRich(st)}</div>
                      </div>`).join("")}
                  </div>
                  <div class="walk-ans">${formatRich(wt.answer)}</div>
                </div>
              </div>` : ""}

            <div class="callout-pair">
              <div class="formula-box">
                <div class="section-kicker" style="color:var(--primary);">Must-Know Formula Sheet</div>
                <div class="formula-body">${formatRich(slide.formula)}</div>
              </div>
              <div class="trap-box">
                <div class="section-kicker" style="color:var(--error);">Zero-Mark Examiner Trap</div>
                <div class="trap-body">${formatRich(slide.trap)}</div>
              </div>
            </div>

            <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:0.74rem;color:var(--text-soft);">
              <span>${linkedTopic ? `Linked Check: <strong style="color:var(--text-muted);">${escHtml(linkedTopic.name)}</strong>` : ""}</span>
              <span>Swipe left/right on phone &bull; <a href="${deck.guideHtml}">Full ${sub.code} Guide</a> &bull; <a href="${deck.pptx}" download>.pptx</a></span>
            </div>
          </div>

          <div class="stage-foot">
            <button id="prev-slide" type="button" ${idx === 0 ? "disabled" : ""} class="foot-btn prev">&larr; Previous</button>
            <span class="tabular" style="font-size:0.78rem;font-weight:700;color:var(--text-muted);">Lesson ${idx + 1} / ${sub.slides.length}</span>
            <button id="next-slide" type="button" ${idx === sub.slides.length - 1 ? "disabled" : ""} class="foot-btn next">Next Lesson &rarr;</button>
          </div>
        </article>
      </div>
    </div>`;
}

function renderChecklist(sub) {
  const doneCount = sub.topics.filter(t => state.checkedTopics[t.id]).length;
  const pct = Math.round((doneCount / sub.topics.length) * 100);
  return `
    <div class="panel">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding-bottom:12px;">
        <div>
          <h2 style="margin:0;font-size:1.12rem;font-weight:800;">${sub.code}: ${sub.name} &mdash; Topic Completion Tracker</h2>
          <p style="margin:4px 0 0;font-size:0.8rem;color:var(--text-muted);">Only tick a unit after deriving its formulas and solving two exam drills cold.</p>
        </div>
        <div class="tabular" style="font-size:0.96rem;font-weight:800;color:var(--sub-accent);">${doneCount} / ${sub.topics.length} (${pct}%)</div>
      </div>
      <div class="topic-list">
        ${sub.topics.map(t => {
          const checked = !!state.checkedTopics[t.id];
          return `
            <label class="topic-row ${checked ? "checked" : ""}">
              <div style="display:flex;align-items:center;gap:11px;min-width:0;">
                <input type="checkbox" data-tid="${t.id}" class="topic-chk" ${checked ? "checked" : ""} />
                <span class="topic-label">${escHtml(t.name)}</span>
              </div>
              <span class="tag-pill ${t.tag === "MUST KNOW" ? "must" : ""}">${escHtml(t.tag)}</span>
            </label>`;
        }).join("")}
      </div>
    </div>`;
}

function renderPractice(sub) {
  const query = (state.searchQ || "").trim().toLowerCase();
  const list = sub.practice.filter(q => {
    if (state.filterQ === "pending" && state.solvedQ[q.id]) return false;
    if (state.filterQ === "solved" && !state.solvedQ[q.id]) return false;
    if (state.filterQ === "exam" && q.src !== "Midsem / Endsem") return false;
    if (state.filterQ === "quiz" && q.src !== "Quiz / Lab") return false;
    if (state.filterQ === "assign" && q.src !== "Assignment / Tutorial") return false;
    if (query) {
      const hay = (q.level + " " + q.src + " " + q.q + " " + q.hint + " " + q.sol).toLowerCase();
      if (!hay.includes(query)) return false;
    }
    return true;
  });

  const filters = [["all", "All"], ["exam", "Mid/Endsem"], ["quiz", "Quiz/Lab"], ["assign", "Assign/Tut"], ["pending", "Unsolved"], ["solved", "Solved ✓"]];

  return `
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div class="panel practice-controls">
        <div class="practice-top-row">
          <div>
            <div style="font-size:0.94rem;font-weight:800;">${sub.code} Practice Arena (${sub.practice.length} Verified Past-Paper, Quiz &amp; Tutorial Drills)</div>
            <div style="font-size:0.76rem;color:var(--text-muted);margin-top:2px;">Work on blank paper first, peek Hint only if stuck, then verify Solution.</div>
          </div>
          <button id="cold-random-btn" type="button" class="cold-btn">Draw Random Cold Q</button>
        </div>
        <div class="search-row">
          <input id="q-search" type="search" class="search-input" value="${escHtml(state.searchQ || "")}" placeholder="Search formulas, Q numbers, Endsem 2023, supermesh, static..." />
          <div class="filter-pills">
            ${filters.map(([v, l]) => `
              <button type="button" data-f="${v}" class="f-pill f-btn ${state.filterQ === v ? "active" : ""}">${l}</button>
            `).join("")}
          </div>
        </div>
      </div>

      ${list.length === 0 ? `<div class="panel" style="text-align:center;color:var(--text-muted);font-size:0.88rem;padding:28px;">No questions match "${escHtml(state.searchQ)}" under this filter. Clear search or switch to "All".</div>` : ""}

      ${list.map((q, idx) => {
        const solved = !!state.solvedQ[q.id];
        return `
          <div id="card-${q.id}" class="q-item ${solved ? "solved" : ""}">
            <div class="q-top">
              <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap;">
                <span class="q-src">${escHtml(q.level)}</span>
                <span style="font-size:0.72rem;color:var(--text-soft);font-weight:700;">#${idx + 1} &bull; ${escHtml(q.src)}</span>
              </div>
              <label style="display:flex;align-items:center;gap:7px;font-size:0.78rem;font-weight:700;cursor:pointer;">
                <input type="checkbox" data-qid="${q.id}" class="q-chk" style="width:17px;height:17px;accent-color:var(--success);" ${solved ? "checked" : ""} />
                <span>${solved ? "Solved Cold ✓" : "Mark Solved"}</span>
              </label>
            </div>
            <div class="q-prompt">${formatRich(q.q)}</div>
            <div class="q-actions">
              <button type="button" data-tog="hint-${q.id}" class="tog-btn btn-sm btn-hint">Show Hint</button>
              <button type="button" data-tog="sol-${q.id}" class="tog-btn btn-sm btn-sol">Show Worked Solution</button>
            </div>
            <div id="hint-${q.id}" class="hidden hint-panel"><strong>Hint:</strong> ${formatRich(q.hint)}</div>
            <div id="sol-${q.id}" class="hidden sol-panel"><div style="font-weight:800;margin-bottom:4px;color:var(--success);">Step-by-Step Solution:</div>${formatRich(q.sol)}</div>
          </div>`;
      }).join("")}
    </div>`;
}

function openColdModal(sub, pick) {
  const modal = document.getElementById("cold-modal");
  const card = document.getElementById("cold-modal-card");
  if (!pick) {
    const unsolved = sub.practice.filter(q => !state.solvedQ[q.id]);
    const pool = unsolved.length ? unsolved : sub.practice;
    pick = pool[Math.floor(Math.random() * pool.length)];
  }
  const solved = !!state.solvedQ[pick.id];
  card.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--border);padding-bottom:10px;">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span class="q-src">${escHtml(pick.level)}</span>
        <span style="font-size:0.74rem;font-weight:700;color:var(--text-soft);">${sub.code} Cold-Call Drill</span>
      </div>
      <button id="close-modal-btn" type="button" class="icon-btn">Close &times;</button>
    </div>
    <div class="q-prompt" style="font-size:0.95rem;">${formatRich(pick.q)}</div>
    <div class="q-actions">
      <button type="button" data-mtog="m-hint" class="mtog-btn btn-sm btn-hint">Reveal Hint</button>
      <button type="button" data-mtog="m-sol" class="mtog-btn btn-sm btn-sol">Reveal Solution</button>
      <button id="m-solve-btn" type="button" class="btn-sm" style="background:${solved ? "var(--success)" : "var(--surface-2)"};color:${solved ? "#fff" : "var(--text)"};border:1px solid var(--border-strong);">
        ${solved ? "Solved Cold ✓" : "Mark Solved ✓"}
      </button>
      <button id="m-next-btn" type="button" class="cold-btn">Draw Another</button>
    </div>
    <div id="m-hint" class="hidden hint-panel"><strong>Hint:</strong> ${formatRich(pick.hint)}</div>
    <div id="m-sol" class="hidden sol-panel"><div style="font-weight:800;margin-bottom:4px;color:var(--success);">Worked Solution:</div>${formatRich(pick.sol)}</div>
  `;
  modal.classList.remove("hidden");
  document.getElementById("close-modal-btn").onclick = () => modal.classList.add("hidden");
  modal.onclick = e => { if (e.target === modal) modal.classList.add("hidden"); };
  card.querySelectorAll(".mtog-btn").forEach(b => {
    b.onclick = () => document.getElementById(b.dataset.mtog).classList.toggle("hidden");
  });
  card.querySelectorAll(".copy-code-btn").forEach(wireCopyBtn);
  document.getElementById("m-solve-btn").onclick = () => {
    state.solvedQ[pick.id] = !state.solvedQ[pick.id];
    saveState();
    openColdModal(sub, pick);
    renderAll();
  };
  document.getElementById("m-next-btn").onclick = () => openColdModal(sub, null);
}

function renderCgpa(sub) {
  return `
    <div class="callout-pair">
      <div class="panel" style="display:flex;flex-direction:column;gap:12px;">
        <div class="section-kicker" style="color:var(--primary);">IIITDM Scoring Edge &bull; ${sub.code}</div>
        <h2 style="margin:0;font-size:1.1rem;font-weight:800;">How Top Scorers Lock S / A Grades</h2>
        <p style="margin:0;font-size:0.87rem;line-height:1.58;color:var(--text-muted);">${formatRich(sub.strategy.gradeRule)}</p>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${sub.strategy.targets.map(t => `
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);font-size:0.82rem;">
              <span>${formatRich(t.item)}</span>
              <span style="font-weight:800;color:var(--success);flex-shrink:0;">${escHtml(t.weight)}</span>
            </div>`).join("")}
        </div>
      </div>

      <div class="panel" style="display:flex;flex-direction:column;gap:12px;">
        <div class="section-kicker" style="color:var(--warning);">3-Hour Focused Sprint Plan</div>
        <h2 style="margin:0;font-size:1.1rem;font-weight:800;">${sub.name} Execution Order</h2>
        <ol style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;">
          ${sub.strategy.schedule.map((s, i) => `
            <li class="step-row" style="padding:11px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);font-size:0.84rem;">
              <span class="step-num" style="background:var(--primary);">${i + 1}</span>
              <span>${formatRich(s)}</span>
            </li>`).join("")}
        </ol>
        <div style="padding:11px 13px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);font-size:0.8rem;line-height:1.5;color:var(--text-muted);">
          <strong style="color:var(--text);">9+ Partial-Credit Law:</strong> Never turn in a blank problem &mdash; state theorem hypotheses, KCL/supernode equations, Maxwell law, or a clean C loop skeleton to earn 50&ndash;70% step marks.
        </div>
      </div>
    </div>`;
}

function renderDownloads() {
  return `
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div class="panel">
        <h2 style="margin:0;font-size:1.08rem;font-weight:800;">Downloadable PowerPoint Decks (.pptx) &amp; Complete Study Guides</h2>
        <p style="margin:4px 0 0;font-size:0.82rem;color:var(--text-muted);">Open mobile-formatted HTML guides in any browser or download complete PowerPoint <code class="inline-code">.pptx</code> / <code class="inline-code">.md</code> packs for offline revision.</p>
      </div>
      <div class="dl-grid">
        ${DECK_FILES.map(d => `
          <div class="panel" style="display:flex;flex-direction:column;justify-content:space-between;gap:12px;">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span class="cp-code" style="--sub-accent:var(--primary);">${d.code}</span>
                <span class="tabular" style="font-size:0.73rem;font-weight:700;color:var(--text-muted);">${d.pptxSlides} PPTX Slides &bull; ${d.questions} Qs</span>
              </div>
              <h3 style="margin:8px 0 4px;font-size:1rem;font-weight:800;">${d.name}</h3>
              <p style="margin:0;font-size:0.8rem;color:var(--text-muted);line-height:1.45;">${d.desc}</p>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;">
              <a class="dl-btn prim" href="${d.pptx}" download>Download .pptx</a>
              <a class="dl-btn sec" href="${d.guideHtml}">Open Full Guide</a>
              <a class="dl-btn sec" href="${d.guideMd}" download>Raw .md</a>
            </div>
          </div>`).join("")}
      </div>
    </div>`;
}

function wireCopyBtn(b) {
  b.onclick = async () => {
    try {
      const code = decodeURIComponent(escape(atob(b.dataset.code64)));
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(code);
      }
      b.textContent = "Copied ✓";
      b.classList.add("copied");
      setTimeout(() => { b.textContent = "Copy"; b.classList.remove("copied"); }, 1400);
    } catch (_) {}
  };
}

function wireSwipe(sub) {
  const card = document.getElementById("slide-card");
  if (!card) return;
  let sx = 0, sy = 0;
  card.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  card.addEventListener("touchend", e => {
    if (!e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) < 48 || Math.abs(dy) > Math.abs(dx) * 0.85) return;
    const idx = Math.min(state.slideIdx[sub.code] || 0, sub.slides.length - 1);
    if (dx < 0 && idx < sub.slides.length - 1) { state.slideIdx[sub.code] = idx + 1; saveState(); renderAll(); }
    else if (dx > 0 && idx > 0) { state.slideIdx[sub.code] = idx - 1; saveState(); renderAll(); }
  }, { passive: true });
}

function wireEvents(sub) {
  const idx = Math.min(state.slideIdx[sub.code] || 0, sub.slides.length - 1);
  const prev = document.getElementById("prev-slide");
  const next = document.getElementById("next-slide");
  if (prev) prev.onclick = () => { if (idx > 0) { state.slideIdx[sub.code] = idx - 1; saveState(); renderAll(); window.scrollTo({ top: 0, behavior: "smooth" }); } };
  if (next) next.onclick = () => { if (idx < sub.slides.length - 1) { state.slideIdx[sub.code] = idx + 1; saveState(); renderAll(); window.scrollTo({ top: 0, behavior: "smooth" }); } };
  document.querySelectorAll(".jump-btn").forEach(b => {
    b.onclick = () => { state.slideIdx[sub.code] = Number(b.dataset.jump); saveState(); renderAll(); };
  });
  const togSlide = document.getElementById("toggle-slide-topic");
  if (togSlide) togSlide.onclick = () => {
    const tid = sub.slides[idx].topicId;
    state.checkedTopics[tid] = !state.checkedTopics[tid];
    saveState(); renderAll();
  };
  document.querySelectorAll(".topic-chk").forEach(c => {
    c.onchange = () => { state.checkedTopics[c.dataset.tid] = c.checked; saveState(); renderAll(); };
  });
  document.querySelectorAll(".f-btn").forEach(b => {
    b.onclick = () => { state.filterQ = b.dataset.f; saveState(); renderAll(); };
  });
  const searchEl = document.getElementById("q-search");
  if (searchEl) searchEl.oninput = e => {
    const pos = e.target.selectionStart;
    state.searchQ = e.target.value;
    saveState(); renderAll();
    const reEl = document.getElementById("q-search");
    if (reEl) { reEl.focus(); reEl.setSelectionRange(pos, pos); }
  };
  document.querySelectorAll(".q-chk").forEach(c => {
    c.onchange = () => { state.solvedQ[c.dataset.qid] = c.checked; saveState(); renderAll(); };
  });
  document.querySelectorAll(".tog-btn").forEach(b => {
    b.onclick = () => {
      const box = document.getElementById(b.dataset.tog);
      if (box) box.classList.toggle("hidden");
    };
  });
  const coldBtn = document.getElementById("cold-random-btn");
  if (coldBtn) coldBtn.onclick = () => openColdModal(sub, null);
  document.querySelectorAll(".copy-code-btn").forEach(wireCopyBtn);
  wireSwipe(sub);
}

function renderAll() {
  renderNav();
  const sub = DATA[state.subject];
  const ws = document.getElementById("workspace");
  if (state.mode === "slides") ws.innerHTML = renderSlides(sub);
  else if (state.mode === "checklist") ws.innerHTML = renderChecklist(sub);
  else if (state.mode === "practice") ws.innerHTML = renderPractice(sub);
  else if (state.mode === "cgpa") ws.innerHTML = renderCgpa(sub);
  else ws.innerHTML = renderDownloads();
  wireEvents(sub);
  updateHeader();
}

document.getElementById("toggle-outline-btn").onclick = () => {
  state.sidebarHidden = !state.sidebarHidden;
  saveState(); renderAll();
};

document.addEventListener("keydown", e => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if (e.key === "Escape") document.getElementById("cold-modal").classList.add("hidden");
  if (state.mode !== "slides") return;
  const sub = DATA[state.subject];
  const idx = Math.min(state.slideIdx[sub.code] || 0, sub.slides.length - 1);
  if (e.key === "ArrowRight" && idx < sub.slides.length - 1) { state.slideIdx[sub.code] = idx + 1; saveState(); renderAll(); }
  else if (e.key === "ArrowLeft" && idx > 0) { state.slideIdx[sub.code] = idx - 1; saveState(); renderAll(); }
});

document.getElementById("reset-btn").onclick = () => {
  if (!confirm("Reset checked topics and solved questions on this device?")) return;
  state.checkedTopics = {}; state.solvedQ = {}; state.highlightQ = null; state.searchQ = "";
  saveState(); renderAll();
};

window.__renderStudio = renderAll;
window.addEventListener("load", () => renderAll());
renderAll();
</script>
</body>
</html>
