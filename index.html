b) $\\nabla\\times(\\mathbf{B}_0\\times\\mathbf{r}) = 2\\mathbf{B}_0$, so dividing by $2$ gives $\\nabla\\times\\mathbf{A} = \\mathbf{B}_0$ and $\\nabla\\cdot\\mathbf{A} = 0$!"}, {"id": "ph_q21", "src": "Assignment / Tutorial", "level": "Assignment-2 Q4 (Magnetized Cyl)", "q": "An infinite solid cylinder of radius $R$ has frozen $\\mathbf{M} = b s\\,\\hat{z}$ and NO free current. Find $\\mathbf{J}_b,\\ \\mathbf{K}_b,\\ \\mathbf{H},\\ \\mathbf{B}_{\\text{in}},\\ \\mathbf{B}_{\\text{out}}$.", "hint": "Zero free current $\\implies \\mathbf{H}=0$! Only curl of $\\mathbf{M}$ contributes $-\\partial_s M_z\\,\\hat{\\phi}$.", "sol": "$\\mathbf{J}_b = -b\\hat{\\phi}$, $\\mathbf{K}_b = bR\\hat{\\phi}$, $\\mathbf{H}=\\mathbf{0}$, $\\mathbf{B}_{\\text{in}} = \\mu_0 b s\\,\\hat{z}$, $\\mathbf{B}_{\\text{out}} = \\mathbf{0}$."}, {"id": "ph_q22", "src": "Quiz / Lab", "level": "lect_31 Prob 1 Coax with chi_m", "q": "A long coaxial cable ($a<s<b$ outer radius $c$, current $+I$ center, $-I$ outer shell) has space $a<s<b$ filled with linear magnetic material of susceptibility $\\chi_m$. Find $\\mathbf{H},\\ \\mathbf{B},\\ \\mathbf{M},\\ \\mathbf{J}_b,\\ \\mathbf{K}_b$ for $a<s<b$.", "hint": "Apply $\\oint\\mathbf{H}\\cdot d\\mathbf{l} = I$ first, then $\\mathbf{B}=\\mu_0(1+\\chi_m)\\mathbf{H}$ and $\\mathbf{M}=\\chi_m\\mathbf{H}$!", "sol": "$\\mathbf{H} = \\frac{I}{2\\pi s}\\hat{\\phi}$; $\\mathbf{B} = \\frac{\\mu_0(1+\\chi_m)I}{2\\pi s}\\hat{\\phi}$; $\\mathbf{M} = \\frac{\\chi_m I}{2\\pi s}\\hat{\\phi}$.\n$\\mathbf{J}_b = \\nabla\\times\\mathbf{M} = \\mathbf{0}$ (inside material!), while $\\mathbf{K}_b(s=a) = +\\frac{\\chi_m I}{2\\pi a}\\hat{z}$ and $\\mathbf{K}_b(s=b) = -\\frac{\\chi_m I}{2\\pi b}\\hat{z}$!"}, {"id": "ph_q23", "src": "Quiz / Lab", "level": "lect_31 Magnetic Boundaries", "q": "Interface $z=0$ separates $\\mu_{r1}=1$ ($z>0$) from $\\mu_{r2}=1000$ ($z<0$, no free surface current $\\mathbf{K}_f$). If $\\mathbf{B}_1 = 2\\hat{x} + 4\\hat{z}\\text{ mT}$, find $\\mathbf{B}_2$ and show how $\\mathbf{B}$ bends at iron.", "hint": "Match $B_{1\\perp}=B_{2\\perp}$ and $H_{1\\parallel}=H_{2\\parallel}$!", "sol": "$B_{2z} = B_{1z} = 4\\text{ mT}$. Since $\\frac{B_{1x}}{\\mu_1}=\\frac{B_{2x}}{\\mu_2}$, $B_{2x} = 1000\\times 2 = \\mathbf{2000\\text{ mT}} = 2\\text{ T}$! High-$\\mu$ iron funnels field lines parallel inside the core."}, {"id": "ph_q24", "src": "Quiz / Lab", "level": "lect_32-33 Faraday & Motional EMF", "q": "(a) Circular loop radius $R$ spins at angular speed $\\omega$ in uniform $B_0$: find $\\mathcal{E}(t)$. (b) Metal bar length $L=0.4\\text{ m}$ slides at $v=10\\text{ m/s}$ across rails in $B=0.5\\text{ T}$ connected to $2\\,\\Omega$: find $|\\mathcal{E}|$ and braking force $F$.", "hint": "$\\Phi(t) = B_0(\\pi R^2)\\cos(\\omega t)$ in (a); $P_{\\text{mech}} = Fv = \\mathcal{E}^2/R$ in (b)!", "sol": "(a) $\\mathcal{E}(t) = -\\frac{d\\Phi}{dt} = \\pi R^2 B_0 \\omega \\sin(\\omega t)$.\n(b) $|\\mathcal{E}| = BLv = 0.5(0.4)(10) = 2\\text{ V}$; $I=1\\text{ A} \\implies F = I L B = \\mathbf{0.2\\text{ N}}$."}, {"id": "ph_q25", "src": "Midsem / Endsem", "level": "lect_35-36 Inductance & Energy", "q": "(a) Calculate self-inductance per unit length $L/l$ of a coaxial cable (inner $a$, outer $b$, carrying $I$ inside and returning $-I$ outside). (b) Two inductors $L_1, L_2$ with mutual inductance $M$ carry $i_1, i_2$: write total stored energy $W_m$.", "hint": "Integrate $\\Phi = \\int_a^b B\\,l\\,ds$ with $B=\\mu_0 I/(2\\pi s)$, or integrate $w_m = B^2/(2\\mu_0)$!", "sol": "(a) $\\Phi/l = \\frac{\\mu_0 I}{2\\pi}\\ln(b/a) \\implies \\frac{L}{l} = \\frac{\\mu_0}{2\\pi}\\ln\\left(\\frac{b}{a}\\right)$.\n(b) $W_m = \\frac{1}{2}L_1 i_1^2 + \\frac{1}{2}L_2 i_2^2 \\pm M i_1 i_2$."}, {"id": "ph_q26", "src": "Assignment / Tutorial", "level": "Assignment-2 Q5 (Displacement Gap)", "q": "A wire of radius $R = 2\\text{ cm}$ carrying steady $I = 10\\text{ A}$ has a narrow parallel-plate capacitor gap. Find magnetic field $B$ inside the gap at radial distance $r = 1\\text{ cm}$ from the axis.", "hint": "$I_c = 0$ in air gap; uniform $\\mathbf{J}_d$ across $\\pi R^2$ satisfies $I_{d,\\text{enc}} = I(r^2/R^2)$.", "sol": "$\\oint \\mathbf{B}\\cdot d\\mathbf{l} = B(2\\pi r) = \\mu_0 I \\frac{r^2}{R^2} \\implies B = \\frac{\\mu_0 I r}{2\\pi R^2} = \\mathbf{50\\,\\mu\\text{T}}$."}, {"id": "ph_q27", "src": "Quiz / Lab", "level": "lect_34 & lect_36 Prob 1, 3", "q": "(a) Medium has $\\sigma=0.11\\text{ S/m},\\ \\epsilon_r=1.2$ under $E=\\cos(0.1t)\\text{ V/m}$: find $J_c$ &amp; $J_d$ at $t=5\\text{ s}$. (b) In lossless medium ($\\epsilon, \\mu$), $\\mathbf{E}=E_0\\cos(\\omega t - kz)\\hat{a}_x$: find $\\mathbf{H}$, Poynting $\\mathbf{S}$, and average $\\langle S_z\\rangle$.", "hint": "Compute $t=5\\text{ s}$ in radians ($0.5\\text{ rad}$)! Use Faraday $\\nabla\\times\\mathbf{E}=-\\partial\\mathbf{B}/\\partial t$ for $\\mathbf{H}$.", "sol": "(a) $J_c = 0.11\\cos(0.5) = \\mathbf{0.0965\\text{ A/m}^2}$; $J_d = (8.854\\times 10^{-12})(1.2)(-0.1\\sin 0.5) = \\mathbf{-5.09\\times 10^{-13}\\text{ A/m}^2}$.\n(b) $\\mathbf{H} = \\frac{k E_0}{\\omega\\mu}\\cos(\\omega t-kz)\\hat{a}_y$; $\\mathbf{S} = \\frac{k E_0^2}{\\omega\\mu}\\cos^2(\\omega t-kz)\\hat{a}_z$; $\\langle S_z\\rangle = \\mathbf{\\frac{k E_0^2}{2\\omega\\mu}}$."}, {"id": "ph_q28", "src": "Midsem / Endsem", "level": "lect_37 Solar EM Wave", "q": "Sunlight arrives at a planet with intensity $10\\text{ cal}/(\\text{m}^2\\cdot\\text{s})$ ($1\\text{ cal}=4.184\\text{ J}$). Find peak electric amplitude $E_0$ and magnetic amplitude $B_0$.", "hint": "Convert $\\langle S\\rangle$ to $\\text{W/m}^2$ first, then equate to $\\frac{1}{2}\\epsilon_0 c E_0^2$.", "sol": "$\\langle S\\rangle = 41.84\\text{ W/m}^2 = \\frac{1}{2}(8.854\\times 10^{-12})(3\\times 10^8)E_0^2 \\implies E_0 = \\mathbf{177.5\\text{ V/m}}$, $B_0 = E_0/c = \\mathbf{5.92\\times 10^{-7}\\text{ T}}$."}]}, "CS1000": {"code": "CS1000", "name": "C Programming", "short": "Number Systems, Operators, Control Flow, Recursion, Pointers, Structs & Files", "accent": "var(--chart-4)", "strategy": {"gradeRule": "In IIITDM CS1000 (Endsem 60m, Midsem 30m), HALF of marks are rapid trace/trap MCQs (compile errors, `;` on `if`, duplicate `switch`, `sizeof` side-effects, `static` recursion, `*z++`, missing `'\\0'`) and HALF are Section C code writing (frequently banning `<string.h>`!). Always trace RAM addresses step-by-step on scrap paper instead of guessing.", "targets": [{"item": "Spot ALL compile errors immediately (Main(), duplicate case, case var:, p/2, 10++, int x=1,2)", "weight": "+12 marks"}, {"item": "Trace LIFO recursion (print before vs after call), static locals & *z++ / (*z)++ without guessing", "weight": "+14 marks"}, {"item": "Write clean NO-<string.h> manual char loops + out[k]='\\0' & Armstrong/Prime/Find programs", "weight": "+18 marks"}, {"item": "Master struct pass-by-value vs ptr->member, union sizeof & file modes (r/w/a, fseek)", "weight": "+16 marks"}], "schedule": ["Core Mechanics & Operators (Slides 1-4): Radix equations, 2's complement, 4 compile stages, 15-level precedence & short-circuit.", "Control Flow & Functions (Slides 5-8): if/switch traps, while(c--)/for order, LIFO call stack, static/extern/register.", "Pointers, Structs & Files (Slides 9-13): *z++, parameter arr2++, 2D char overruns, BinCalc struct & fopen/fseek."]}, "topics": [{"id": "cs_t1", "name": "Number Systems, Radix Puzzles, 2's Complement & Bit Shifts", "tag": "MUST KNOW"}, {"id": "cs_t2", "name": "C Compilation Pipeline, Identifiers, Keywords & Escape Sizes", "tag": "HIGH YIELD"}, {"id": "cs_t3", "name": "Complete 15-Level Operator Precedence & Bitwise (~, ^, <<, >>)", "tag": "MUST KNOW"}, {"id": "cs_t4", "name": "Evaluation Traps: ++i/i++, Short-Circuit, sizeof, printf/scanf Returns", "tag": "MUST KNOW"}, {"id": "cs_t5", "name": "Conditionals & switch Rules: Dangling ;, = vs == & Duplicate Cases", "tag": "MUST KNOW"}, {"id": "cs_t6", "name": "Loops (for/while/do-while), continue, Armstrong & Factor Algorithms", "tag": "HIGH YIELD"}, {"id": "cs_t7", "name": "Functions, Prototypes, Call-by-Reference & LIFO Recursion Stack", "tag": "MUST KNOW"}, {"id": "cs_t8", "name": "Variable Scope & All 4 Storage Classes (auto, extern, static, register)", "tag": "MUST KNOW"}, {"id": "cs_t9", "name": "1D/2D Arrays, Pointer Arithmetic, *z++ vs (*z)++ & Parameter Decay", "tag": "MUST KNOW"}, {"id": "cs_t10", "name": "Strings, ASCII Map, 2D Row Overruns & Manual No-<string.h> Partition", "tag": "MUST KNOW"}, {"id": "cs_t11", "name": "Array Coding Drills: Binary/Bubble Sort & Pointer Find() Traversal", "tag": "HIGH YIELD"}, {"id": "cs_t12", "name": "Structures, Nested/Ptr (->), Member Copy & Unions (sizeof Max)", "tag": "MUST KNOW"}, {"id": "cs_t13", "name": "File Handling (FILE*, Modes, fseek/ftell) & #define Macro Pitfalls", "tag": "HIGH YIELD"}], "slides": [{"title": "1. Number Systems, Radix Equations, 2's Complement & Bit Shifts", "topicId": "cs_t1", "tag": "BASICS-1, C questions on NS & COM105T", "intuition": "Computers store ONLY fixed-width boxes of $0$s and $1$s. Negative integers use **2's complement** so addition works identically for positive and negative numbers without separate subtraction hardware — at the cost of sudden wraparound (`125 + 3` in signed 8-bit `char` wraps past `+127` right to `-128`!).", "bullets": ["<b>Radix Conversion Rule (`COM105T`, `Assignment 1`):</b> Convert any base $b$ to Base-10 via $\\sum d_i b^i$; ALWAYS enforce <b>every digit $< b$</b>! Convert Hex $\\leftrightarrow$ Octal fast through binary: <b>1 Hex digit = 4 bits</b>, <b>1 Octal digit = 3 bits</b> (grouped outward from the decimal point!).", "<b>$n$-Bit 2's Complement Bounds:</b> Range is $\\mathbf{-2^{n-1}}$ to $\\mathbf{+(2^{n-1}-1)}$ (8-bit: $-128..+127$; 16-bit: $-32768..+32767$). Shortcut for $-N$: copy bits from right up to first `1`, then flip EVERY bit to its left!", "<b>Signed Wraparound &amp; Shift Multiplication (`COM105T`):</b> `~0` has all 1s $= \\mathbf{-1}$. Shifting left by $k$ (`x << k`) multiplies by $2^k$ inside the fixed register width (dropping MSB bits!)."], "walkthrough": {"source": "COM105T Quiz 1 & C questions on NS", "problem": "(a) Solve $(123)_5 = (X8)_Y$ for all valid base pairs $(X,Y)$. (b) Convert $(2\\text{B}5.\\text{EF})_{16}$ to Octal. (c) Given 16-bit 2's complement $P = (\\text{F87B})_{16}$, compute $8 \\times P$ in Hex and Decimal.", "steps": ["<b>Part (a):</b> Convert $(123)_5 = 1(25)+2(5)+3 = 38_{10}$. Since digit `8` appears in base $Y$, $Y \\ge 9$. Also $XY + 8 = 38 \\implies XY = 30$ with $1 \\le X < Y \\implies$ valid pairs $(X,Y)$: **$(3,10),\\ (2,15),\\ (1,30)$**!", "<b>Part (b):</b> Expand 4-bit Hex: `2=0010, B=1011, 5=0101 . E=1110, F=1111`. Regroup 3-bit Octal from `.`: `001 010 110 101 . 111 011 110` $= \\mathbf{(1265.736)_8}$!", "<b>Part (c) ($8\\times P \\equiv P \\ll 3$):</b> $0\\text{xF87B}$ has MSB `1`, so it is negative: $-(0\\text{x10000}-0\\text{xF87B}) = -0\\text{x0785} = -1925_{10}$. Multiplying by $8$: $-15400_{10}$ (fits in $[-32768, 32767]$!). Left-shifting `1111 1000 0111 1011` by 3 bits: `1100 0011 1101 1000` $= \\mathbf{(\\text{C3D8})_{16}}$!"], "answer": "(a) $(3,10), (2,15), (1,30)$; (b) $(1265.736)_8$; (c) $(\\text{C3D8})_{16}$ ($-15400_{10}$)."}, "formula": "$$n\\text{-bit 2's comp range: } [-2^{n-1},\\ 2^{n-1}-1] \\qquad\\Big|\\qquad 1\\text{ Hex digit} = 4\\text{ bits},\\quad 1\\text{ Octal digit} = 3\\text{ bits}$$", "trap": "Never forget **Sign-Magnitude vs 2's Complement**: in 8-bit Sign-Magnitude, `-9` is `1000 1001` ($-0 = 10000000$ exists!), whereas in 2's Complement, `-9` is `1111 0111` ($-0$ does NOT exist, freeing `-128`!)."}, {"title": "2. C Compilation Pipeline, Identifiers, Keywords & Sizes", "topicId": "cs_t2", "tag": "BASICS-1.pptx • Foundations", "intuition": "Your `.c` file does NOT run straight on CPU silicon! It climbs an exact 4-step factory line (Preprocess $\\to$ Compile $\\to$ Assemble $\\to$ Link), and IIITDM exams love asking **WHICH stage** catches a missing semicolon versus a misspelled `Main()`!", "table": {"headers": ["Stage", "Input -> Output", "What Happens & Which Error Appears Here"], "rows": [["1. Preprocessing", "`.c` -> `.i`", "Strips comments; expands `#include` and `#define` text macros BEFORE syntax checks!"], ["2. Compilation", "`.i` -> `.s/.obj`", "Checks syntax & types -> catches missing `;`, undeclared vars, duplicate `case`, `10++`, `p/2`."], ["3. Linking", "`.obj` + libs -> `.exe`", "Resolves functions -> catches missing `main()` (`Main()` typo is a LINKER error!) & undefined fns."], ["4. Execution", "OS loads `.exe`", "Runtime failures: divide by zero, segfault/out-of-bounds, infinite loops, logic bugs."]]}, "bullets": ["<b>Identifiers &amp; 32 Keywords (`BASICS-1`):</b> Must start with letter or underscore (`_count` valid; `2var`, `my-var`, `int` keyword INVALID!). C is 100% case-sensitive (`Main != main`).", "<b>Standard Type Sizes (Typical 32/64-bit Lab GCC/Exam):</b> `char` = $1$ B ($-128..127$), `int` = $4$ B, `float` = $4$ B, `double` = $8$ B.", "<b>Weird C Constant Type Rule (`operators.ppt`):</b> In C, a character literal `'a'` has type `int` (so `sizeof('a') == 4`, whereas `sizeof(char) == 1`!). Un-suffixed decimals like `2.5` are `double` (`sizeof(2.5) == 8`, `sizeof(2.5f) == 4`)!"], "walkthrough": {"source": "BASICS-1 & Practice-1 Exam Traps", "problem": "Predict the exact behavior of:\n```c\n#include <stdio.h>\nint Main() { printf(\"Hi\\tThere\\n\"); return 0; }\n```\nand compare `sizeof('A')`, `sizeof(\"A\")`, and `sizeof(2.5)`.", "steps": ["<b>Stage Check on `Main()`:</b> Preprocessor and Compiler accept `Main()` as a completely valid user function! At **Stage 3 (Linking)**, startup crt0 looks specifically for lowercase `main` and throws **Linker Error: undefined reference to `main`**!", "<b>Literal Sizes (`operators` Quiz):</b> `'A'` promotes to `int` in C $\\implies \\mathbf{4}$; string `\"A\"` contains `'A'` + `'\\0'` $\\implies \\mathbf{2}$; `2.5` is a `double` $\\implies \\mathbf{8}$."], "answer": "Linker error (`Main` != `main`); sizes on 32/64-bit: `sizeof('A')=4`, `sizeof('A' str)=2`, `sizeof(2.5)=8`."}, "formula": "$$\\text{Preprocess (.i)} \\longrightarrow \\text{Compile (.obj)} \\longrightarrow \\text{Link (.exe)} \\longrightarrow \\text{Load \\& Execute}$$", "trap": "Never mix up `sizeof(\"A\")` ($2$ bytes because of hidden `'\\0'`) vs `strlen(\"A\")` ($1$ character), or `sizeof('A')` ($4$ bytes in C!). And preprocessor directives (`#define`, `#include`) NEVER end with `;`!"}, {"title": "3. Complete 15-Level Operator Precedence & Bitwise Operations", "topicId": "cs_t3", "tag": "operators.ppt & COM105T", "intuition": "C does NOT evaluate math blindly left-to-right! Addition `+` binds **TIGHTER** than bit-shift `<<`, which binds tighter than comparisons `<`, which bind tighter than bitwise `& ^ |`, which bind tighter than logical `&& ||`. Knowing that single hierarchy solves 90% of trick output expressions in 5 seconds!", "table": {"headers": ["Tier", "Operators", "Assoc.", "IIITDM Classic Exam Trap"], "rows": [["1-2", "Postfix `() [] -> . ++ --` > Unary `! ~ ++ -- (type) * & sizeof`", "L->R / R->L", "`*z++` means `*(z++)`, NEVER `(*z)++`!"], ["3-4", "Multiplicative `* / %` > Additive `+ -`", "L -> R", "`5/2` is integer `2`; `%` illegal on `float`!"], ["5", "Bit Shift `<< >>` (Lower than `+ -`!)", "L -> R", "`1 << 2 + 3 << 4` = `(1 << 5) << 4` = `512`!"], ["6-7", "Relational `< <= > >=` > Equality `== !=`", "L -> R", "`10 > 5 > 1` is `(1 > 1)` = **`0`**!"], ["8-10", "Bitwise `&` > XOR `^` > OR `|` (LOWER than `==`!)", "L -> R", "`if (~(10 ^ 11))` = `~1` = `-2` (TRUE!)"], ["11-12", "Logical `&&` (higher) > Logical `||`", "L -> R", "`0 && x++` or `1 || x++` short-circuits!"], ["13-15", "Ternary `?:` > Assign `= +=` (R->L) > Comma `,`", "R->L / L->R", "`int i = (1, 2, 3);` sets `i = 3`!"]]}, "bullets": ["<b>Bitwise Truth (`COM105T`, `operators`):</b> `&` (mask/clear bit), `|` (set bit), `^` (toggle bit; `ch ^ 32` flips ASCII case!), `~x = -(x+1)` (2's comp shortcut: `~1 = -2`, `~0 = -1`).", "<b>Ternary &amp; Associativity:</b> Assignment `=` and unary `++` associate **right-to-left**: `a = b = 5` is `a = (b = 5)`. Relational operators associate **left-to-right**, so `a < b < c` tests `(a < b) < c` (comparing `0`/`1` against `c` — NOT mathematical chained inequality!)."], "walkthrough": {"source": "COM105T & operators.ppt Exam Snippets", "problem": "Evaluate:\n```c\nint a = 1 << 2 + 3 << 4;\nint x = 10, y = 11;\nif (~(x ^ y)) printf(\"EQ \");\nprintf(\"%d %d\", 5 > 3 > 1, a);\n```", "steps": ["<b>Line 1 (`+` before `<<`):</b> `2 + 3 = 5` first $\\to$ `(1 << 5) << 4 = 32 << 4` = **512**!", "<b>Line 3 (`~` vs `!`):</b> `10 ^ 11` in binary `1010 ^ 1011 = 1`. Bitwise NOT `~1 = -2` (all non-zero ints are TRUE in C!), so it prints **`EQ `**!", "<b>Line 4 (`>` left-to-right):</b> `(5 > 3) > 1` evaluates `1 > 1` = **0**! Full output: **`EQ 0 512`**."], "answer": "Output: `EQ 0 512`."}, "formula": "$$\\text{Unary} > {* / \\%} > {+ -} > {\\ll \\gg} > {< \\le > \\ge} > {== !=} > {\\&} > {\\wedge} > {|} > {\\&\\&} > {||} > {?:} > {=} > {,}$$", "trap": "NEVER confuse **Bitwise `~`** (flips all 32 bits, so `~0 == -1` and `~1 == -2` are BOTH truthy!) with **Logical `!`** (`!0 == 1`, `!5 == 0`)! Also `+` binds tighter than `<<` — `1 << 2+3` is `32`, NOT `7`!"}, {"title": "4. Evaluation Traps: ++i vs i++, Short-Circuit, sizeof & I/O Returns", "topicId": "cs_t4", "tag": "Midsem '22, Quiz 2 & Assignment 1", "intuition": "C protects speed by refusing to evaluate expressions it already knows the answer to (`&&`, `||`, and compile-time `sizeof()`!). If you put a `++i` or `printf()` inside the skipped right-hand side or inside `sizeof()`, it NEVER executes at runtime!", "bullets": ["<b>Pre vs Post Increment + R-Value Rule:</b> `++i` increments FIRST then yields new value; `i++` yields OLD value then increments. Writing `10++`, `(++i)++`, or `++(a+b)` is a **Compile Error: lvalue required**!", "<b>Short-Circuiting (`&&`, `||`):</b> In `A || B`, if `A != 0`, `B` is **SKIPPED**. In `A && B`, if `A == 0`, `B` is **SKIPPED**. Watch operator precedence: `&&` beats `||` (`A || B && C` parses `A || (B && C)`!).", "<b>Compile-Time `sizeof()`:</b> `sizeof(printf(\"hello\"))` prints NOTHING and returns **`4`** (size of `printf`'s `int` return type). `sizeof(i++)` leaves `i` UNCHANGED!", "<b>`printf` / `scanf` Return Values &amp; Comma:</b> `printf(\"AA\")` returns **`2`** (chars printed); `scanf(\"%d %d\", &a, &b)` returns number of matched inputs (**`2`**). `int k = (1, 2, 3);` sets `k = 3`, while `int k = 1, 2, 3;` is a **Compile Error**!"], "walkthrough": {"source": "Assignment 1 Image Set & Midsem Dec 2022", "problem": "Trace:\n```c\nint a = 0, b = 1, c = 2, i = 5, n;\nn = sizeof(i++) + (a && ++b) + printf(\"AA\") || printf(\"BB\");\nprintf(\" i=%d b=%d n=%d\", i, b, n);\n```", "steps": ["<b>Evaluate `n` (operator precedence):</b> `sizeof(i++)` = `4` (`i` stays **5**!); `(a && ++b)` sees `a=0`, short-circuits `++b` (`b` stays **1**!) and yields `0`; `printf(\"AA\")` prints **`AA`** and returns `2`.", "<b>Combine before `||`:</b> Left of `||` is `4 + 0 + 2 = 6` (TRUE!). Because `6 != 0`, `|| printf(\"BB\")` short-circuits (never prints `BB`!) and sets `n` = **1**!", "<b>Final Print:</b> Prints **`AA i=5 b=1 n=1`**!"], "answer": "Output: `AA i=5 b=1 n=1`."}, "formula": "$$\\text{sizeof(expr) skips runtime side-effects} \\qquad\\Big|\\qquad \\text{0 \\&\\& X skips X} \\qquad\\Big|\\qquad \\text{Non-zero || X skips X}$$", "trap": "Undefined Sequence-Point Warning: Expressions mutating the same scalar twice between sequence points like `x = x++ + ++x;` violate ISO C (`-Wsequence-point` UB). Rely only on guaranteed sequence points (`&&`, `||`, `?:`, comma `,`, `;`) — always flag indeterminate order explicitly!"}, {"title": "5. Conditionals & switch Lawbook: Dangling ';', '=' & Duplicate Cases", "topicId": "cs_t5", "tag": "Switch&If_else, Midsem '22 & Endsem '23 A-Q2", "intuition": "One stray semicolon turns an entire `if(cond)` into an empty no-op, detaching its `else` into a compile error! And `switch(expr)` is a strict compile-time jump table: it only accepts constant integer/character case labels and crashes compilation if any two labels fold to the exact same integer!", "bullets": ["<b>Dangling Semicolon (`Midsem 2022` Q4):</b> `if(x == 5); printf(\"Hi\");` ALWAYS prints `Hi`! And `if(x == 5); else printf(\"No\");` causes **Compile Error: `'else'` without a previous `'if'`**!", "<b>Assignment `=` Trap &amp; Dangling `else`:</b> `if(a = 0)` assigns `0` and is ALWAYS false (`a = 5` is always true!). With unbraced nested `if(A) if(B) X; else Y;`, `else Y` ALWAYS attaches to the **innermost `if(B)`**, ignoring visual indentation!", "<b>4 Ironclad `switch(expr)` Rules (`Endsem '23`, `Quiz 2`):</b><br>1. `expr` MUST be integral (`int`, `char`, `enum`) — NEVER `float`, `double`, or string.<br>2. Every `case` MUST be a compile-time constant expression (`case x:` or `case a=1:` = Compile Error).<br>3. Duplicate case values (even disguised as expressions!) cause Compile Error.<br>4. No `break;` causes **fallthrough** through every line below — even if `default:` appears at the TOP!"], "walkthrough": {"source": "CS1000 Endsem Feb 2023 Sec A Q2 & Quiz 2 Q2", "problem": "Does this compile and what happens?\n```c\nint a = 3, b = 4, c = b - a;\nswitch(c) {\n    case 1 || 2 && 15%5:    printf(\"Grade S\\n\"); break;\n    case !(10%3*5%5) && -10: printf(\"Grade A\\n\"); break;\n}\n```", "steps": ["<b>Case 1 Evaluation (`&&` beats `||`):</b> `15 % 5 = 0`, so `2 && 0 = 0`, then `1 || 0` = **1**!", "<b>Case 2 Evaluation (left-to-right `*` &amp; `%`):</b> `10 % 3 = 1`, `1 * 5 = 5`, `5 % 5 = 0`, `!0 = 1`, and `1 && -10` = **1**!", "<b>Verdict:</b> Both cases simplify at compile time to `case 1:`! Same as `Quiz 2` (`case 3:` vs `case (7-4):`), C throws **Compilation Error: duplicate case value**!"], "answer": "Compilation Error — Duplicate case value (`1`)."}, "formula": "$$\\text{switch rules: integral type + compile-time constant cases + unique integers + explicit break}$$", "trap": "Don't get fooled into tracing printf outputs before checking ALL `case` expressions! In IIITDM MCQs (`Endsem '23`, `Quiz 2`, `Switch&If_else`), a disguised duplicate case or float case makes **Compile Error** the true answer!"}, {"title": "6. Loops, break/continue, Bitwise Loops & Armstrong / Factor Code", "topicId": "cs_t6", "tag": "Midsem '22 Part C, Endsem '23 C-Q4 & Quiz 2", "intuition": "Every `for(init; cond; update)` loop is a 4-beat drum: **init once $\\to$ check cond $\\to$ run body $\\to$ update**. Two deadly exam tricks live here: `while(c--)` checks `c` BEFORE decrementing, and `continue;` jumps to `update` inside a `for` loop (never skipping it!) yet skips the bottom increment inside a `while` loop!", "bullets": ["<b>Exact `for` vs `while` Step Order:</b> In `for(x = 0; 0;)`, `x = 0` STILL runs once before condition `0` exits immediately (`Quiz 2`: loop body runs 0 times, `x` stays `0`). A trailing `;` (`for(i=0; i<5; i++);`) runs an empty body 5 times leaving `i = 5`!", "<b>`while(c--)` Post-Decrement (`Quiz 2`):</b> If `c = 6`, loop tests `6, 5, 4, 3, 2, 1` (all true!), decrementing right away so `printf(\"%d\", c)` inside prints **`5 4 3 2 1 0`**, exiting with `c = -1`!", "<b>`do { ... } while(cond);` &amp; `i >>= 1`:</b> `do-while` ALWAYS executes body at least once even if `cond` is false (and needs trailing `;`!). Loop `for(i=1024; i; i>>=1)` halves $1024 \\to 1$ in **$11$ iterations** (`COM105T`, $2^{10}$ down to $2^0$)."], "walkthrough": {"source": "CS1000 Midsem Dec 2022 Part C (Armstrong) & Endsem '23 C-Q4 (Factors)", "problem": "Write a complete C program to test whether a 3-digit integer is an Armstrong number ($153 = 1^3+5^3+3^3$), and trace `while(c--)` for `c=6`.", "code": "#include <stdio.h>\nint main() {\n    int n, orig, d, sum = 0;\n    scanf(\"%d\", &n);\n    orig = n;\n    while (n > 0) {\n        d = n % 10;\n        sum += d * d * d;\n        n /= 10;\n    }\n    if (sum == orig) printf(\"%d is Armstrong\\n\", orig);\n    else printf(\"%d is not Armstrong\\n\", orig);\n    return 0;\n}", "steps": ["<b>Why `orig = n;` is Mandatory:</b> Because `n /= 10` destroys `n` down to `0`, omitting `orig = n` compares `sum == 0` at the end — losing half marks!", "<b>Factors Variant (`Endsem '23 C-Q4`):</b> Loop `for(int i=1; i<=n; i++) if(n % i == 0) printf(\"%d \", i);` prints all positive divisors in clean ascending order."], "answer": "Armstrong sum $153 \\to 1^3+5^3+3^3=153$; `while(c--)` from `6` prints `5 4 3 2 1 0`."}, "formula": "$$\\text{Extract last digit: } n\\% 10, \\quad \\text{Drop last digit: } n /= 10 \\qquad\\Big|\\qquad \\text{Iterations of } i = 2^k \\text{ with } i \\gg= 1:\\ k+1$$", "trap": "Never write `continue;` before the manual increment `i++;` inside a `while` loop — that causes an **infinite loop**! Also remember `n /= 10` destroys `n`, so ALWAYS save `orig = n` BEFORE the `while` loop!"}, {"title": "7. Functions, Prototypes, Pass-by-Reference & LIFO Recursion", "topicId": "cs_t7", "tag": "functions.ppt & Endsem '23 B-Q3, B-Q4, B-Q7", "intuition": "Every function call pushes a fresh notepad (stack frame) onto a vertical stack and pauses the caller cleanly until `return` tears that top notepad off (**LIFO**). So if `printf()` runs **BEFORE** calling yourself again, numbers print top-down; if `printf()` sits **AFTER** the recursive call, EVERY print waits until the base case hits and prints bottom-up in reverse!", "svg": "<svg viewBox=\"0 0 600 190\" style=\"max-width:560px;width:100%;height:auto;display:block;margin:0 auto;\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect width=\"600\" height=\"190\" rx=\"12\" fill=\"var(--surface)\" stroke=\"var(--border)\"/>\n  <text x=\"150\" y=\"20\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" fill=\"var(--chart-4)\">Push Winding (Down to n==0)</text>\n  <rect x=\"28\" y=\"34\" width=\"235\" height=\"28\" rx=\"6\" fill=\"var(--surface-2)\" stroke=\"var(--border)\"/><text x=\"145\" y=\"52\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--text)\">1. func(2048, 0): k=8 -> waits!</text>\n  <rect x=\"28\" y=\"68\" width=\"235\" height=\"28\" rx=\"6\" fill=\"var(--surface-2)\" stroke=\"var(--border)\"/><text x=\"145\" y=\"86\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--text)\">2. func(204, 8):  k=4 -> waits!</text>\n  <rect x=\"28\" y=\"102\" width=\"235\" height=\"28\" rx=\"6\" fill=\"var(--surface-2)\" stroke=\"var(--border)\"/><text x=\"145\" y=\"120\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--text)\">3. func(20, 12):  k=0 -> waits!</text>\n  <rect x=\"28\" y=\"136\" width=\"235\" height=\"28\" rx=\"6\" fill=\"rgba(234,88,12,0.16)\" stroke=\"var(--chart-4)\"/><text x=\"145\" y=\"154\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"800\" fill=\"var(--chart-4)\">4. func(2, 12): k=2 -> Base n==0</text>\n  <line x1=\"295\" y1=\"20\" x2=\"295\" y2=\"172\" stroke=\"var(--border)\" stroke-dasharray=\"4 3\"/>\n  <text x=\"445\" y=\"20\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" fill=\"var(--success)\">Pop Unwinding (printf AFTER call)</text>\n  <text x=\"445\" y=\"56\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--text)\">Pops 4 -> prints \"2,\"</text>\n  <text x=\"445\" y=\"80\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--text)\">Pops 3 -> prints \"0,\"</text>\n  <text x=\"445\" y=\"104\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--text)\">Pops 2 -> prints \"4,\"</text>\n  <text x=\"445\" y=\"128\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"var(--text)\">Pops 1 -> prints \"8,\"</text>\n  <rect x=\"330\" y=\"142\" width=\"230\" height=\"30\" rx=\"8\" fill=\"var(--success-soft)\" stroke=\"var(--success)\"/><text x=\"445\" y=\"161\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"800\" fill=\"var(--success)\">main's sum STILL 0 -> 2,0,4,8,0</text>\n</svg>", "bullets": ["<b>Call-by-Value vs Reference (`Endsem '23 B-Q4, B-Q7`):</b> Passing `x` copies its number (caller's `x` NEVER changes!). Passing `&x` lets `*px = ...` edit the caller's original memory. Arrays ALWAYS pass `&a[0]` automatically!", "<b>Prototypes (`functions.ppt`):</b> Defining a non-`int` function AFTER `main()` without a top prototype triggers type conflicts (`float`/`void` mismatch!). Returning an expression from `void` is a Compile Error.", "<b>Recursion Design Checklist:</b> (1) Base case stopping infinite descent (missing base $\\implies$ stack overflow!); (2) Progress toward base (`n/10` or `n-1`); (3) Pre-recursion work vs Post-recursion unwinding work!"], "walkthrough": {"source": "CS1000 Endsem Feb 2023 Sec B Q3", "problem": "Trace the exact output:\n```c\nvoid func(int n, int sum) {\n    int k = 0, j = 0;\n    if (n == 0) return;\n    k = n % 10; j = n / 10;\n    sum = sum + k;\n    func(j, sum);\n    printf(\"%d,\", k);\n}\nint main() {\n    int a = 2048, sum = 0;\n    func(a, sum);\n    printf(\"%d\", sum);\n}\n```", "steps": ["<b>Push Stack Frames:</b> `func(2048,0)` keeps `k=8`; `func(204,8)` keeps `k=4`; `func(20,12)` keeps `k=0`; `func(2,12)` keeps `k=2`; `func(0,14)` returns immediately!", "<b>Unwind &amp; Print After Return:</b> Pops in reverse LIFO order: **`2,0,4,8,`**. Finally back in `main()`, local `sum` was passed by value so `sum` is STILL **`0`** $\\implies$ **`2,0,4,8,0`**!"], "answer": "Exact output: `2,0,4,8,0`."}, "formula": "$$\\text{Call by value: caller safe} \\qquad\\Big|\\qquad \\text{Call by pointer } (\\&x,\\ *p)\\text{: caller mutated} \\qquad\\Big|\\qquad \\text{LIFO unwind}$$", "trap": "Two classic traps on `Endsem '23`: (1) Writing `8,4,0,2,` backwards when `printf` sits AFTER the recursive call! (2) Thinking recursive `sum = sum + k` changes `main`'s `sum` — it ONLY modifies the inner parameter copy!"}, {"title": "8. Variable Scope & All 4 Storage Classes (auto, extern, static, register)", "topicId": "cs_t8", "tag": "scope.pptx & Endsem '23 A-Q4, A-Q8", "intuition": "Where does a variable live and how long does it remember? Normal local (`auto`) variables get wiped out when their `{ }` block finishes; **`static`** local variables stay hidden inside the function yet survive in permanent RAM across every call like a secret private counter!", "table": {"headers": ["Class", "Storage", "Default Init", "Scope", "Lifetime & Exam Rule"], "rows": [["`auto` (default)", "RAM (Stack)", "Garbage", "Local `{ }`", "Destroyed when block exits"], ["`extern`", "RAM (Data)", "`0`", "Global / Multi-file", "Entire program; shares global vars"], ["`static`", "RAM (Data)", "**`0`**", "Local (or file)", "**Entire program**! Initialized ONLY ONCE!"], ["`register`", "CPU Register", "Garbage", "Local `{ }`", "Block ends; **cannot take address `&x`!**"]]}, "bullets": ["<b>Static Initialization Rule (`Endsem '23 A-Q4`):</b> `static int i = 1;` executes ONLY ONCE on the very first entry into the function — subsequent recursive calls or re-entries IGNORE `= 1` and read the latest mutated value!", "<b>Local vs Global Shadowing (`Endsem '23 A-Q8`):</b> If global `i = 10` exists and `main()` declares local `int i = 20`, `main` sees `20`, whereas any helper function `check()` sees ONLY global `10`!", "<b>Register Address Constraint:</b> Because a `register` variable may sit inside a CPU hardware register (no RAM byte address), writing `scanf(\"%d\", &r)` or `int *p = &r;` is a **Compile Error**!"], "walkthrough": {"source": "CS1000 Endsem Feb 2023 Sec A Q4 & Q8", "problem": "Trace BOTH snippets:\n```c\n// Snippet 1 (A-Q4):\nint f(int n) {\n    static int i = 1;\n    if (n >= 5) return n;\n    n = n + i; i++;\n    return f(n);\n} // Call f(1)\n\n// Snippet 2 (A-Q8):\nint i = 10;\nvoid check() { printf(\"%d \", i++); }\nint main() {\n    int i = 20; printf(\"%d \", i);\n    check(); printf(\"%d\", ++i);\n}\n```", "steps": ["<b>Snippet 1 (`f(1)`):</b> `i` is shared statically across all recursive calls! Call 1: `n=1, i=1` $\\to$ `n=2, i=2`; Call 2: `n=2, i=2` $\\to$ `n=4, i=3`; Call 3: `n=4, i=3` $\\to$ `n=7, i=4`; Call 4: `n=7 >= 5` returns **`7`**!", "<b>Snippet 2 (Scope Shadowing):</b> `main` prints its local **`20`**, calls `check()` which accesses ONLY global `i=10` (prints **`10`**, sets global `i=11`), then `main` prints `++i` using local `20` $\\to$ **`21`**. Output: **`20 10 21`**!"], "answer": "Q4 returns `7`; Q8 prints `20 10 21`."}, "formula": "$$\\text{static local} \\implies \\text{init = 0 once, keeps value across calls} \\qquad\\Big|\\qquad \\text{register} \\implies \\text{no `\\&` allowed}$$", "trap": "Never reset `static int i = 1;` back to `1` during recursive trace! Remember `static` remembers both across loops AND across nested recursion!"}, {"title": "9. Arrays, Row-Major 2D, Pointer Arithmetic & *z++ vs (*z)++", "topicId": "cs_t9", "tag": "arrays.ppt & Endsem '23 A-Q10, B-Q9", "intuition": "A pointer holds a street address (`5000`); dereferencing `*p` walks inside the house to read its resident (`20`). Because suffix `++` has **higher precedence** than unary `*`, **`*z++` walks `z` next door to house `5004`** instead of adding 1 to resident `20`!", "svg": "<svg viewBox=\"0 0 600 185\" style=\"max-width:560px;width:100%;height:auto;display:block;margin:0 auto;\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect width=\"600\" height=\"185\" rx=\"12\" fill=\"var(--surface)\" stroke=\"var(--border)\"/>\n  <text x=\"148\" y=\"20\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" fill=\"var(--text)\">BEFORE: z = &amp;x (5000)</text>\n  <rect x=\"28\" y=\"34\" width=\"76\" height=\"58\" rx=\"8\" fill=\"var(--surface-2)\" stroke=\"var(--border)\"/><text x=\"66\" y=\"54\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"800\" fill=\"var(--primary)\">x (5000)</text><text x=\"66\" y=\"76\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"var(--text)\">20</text>\n  <rect x=\"112\" y=\"34\" width=\"76\" height=\"58\" rx=\"8\" fill=\"var(--surface-2)\" stroke=\"var(--border)\"/><text x=\"150\" y=\"54\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"800\" fill=\"var(--chart-2)\">y (5004)</text><text x=\"150\" y=\"76\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"var(--text)\">21</text>\n  <rect x=\"196\" y=\"34\" width=\"84\" height=\"58\" rx=\"8\" fill=\"var(--surface-2)\" stroke=\"var(--border)\"/><text x=\"238\" y=\"54\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"800\" fill=\"var(--text-muted)\">z (5008)</text><text x=\"238\" y=\"76\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"var(--primary)\">5000</text>\n  <path d=\"M 238 98 Q 150 132 72 98\" fill=\"none\" stroke=\"var(--primary)\" stroke-width=\"2\" marker-end=\"url(#arCs)\"/>\n\n  <line x1=\"300\" y1=\"18\" x2=\"300\" y2=\"170\" stroke=\"var(--border)\" stroke-dasharray=\"4 3\"/>\n\n  <text x=\"450\" y=\"20\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" fill=\"var(--chart-4)\">AFTER: *z++; x++;</text>\n  <rect x=\"320\" y=\"34\" width=\"76\" height=\"58\" rx=\"8\" fill=\"var(--surface-2)\" stroke=\"var(--border)\"/><text x=\"358\" y=\"54\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"800\" fill=\"var(--primary)\">x (5000)</text><text x=\"358\" y=\"76\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"var(--text)\">21</text>\n  <rect x=\"404\" y=\"34\" width=\"76\" height=\"58\" rx=\"8\" fill=\"rgba(234,88,12,0.14)\" stroke=\"var(--chart-4)\" stroke-width=\"2\"/><text x=\"442\" y=\"54\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"800\" fill=\"var(--chart-4)\">y (5004)</text><text x=\"442\" y=\"76\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" fill=\"var(--text)\">21</text>\n  <rect x=\"488\" y=\"34\" width=\"84\" height=\"58\" rx=\"8\" fill=\"var(--surface-2)\" stroke=\"var(--border)\"/><text x=\"530\" y=\"54\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"800\" fill=\"var(--text-muted)\">z (5008)</text><text x=\"530\" y=\"76\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" fill=\"var(--chart-4)\">5004</text>\n  <path d=\"M 530 98 Q 485 122 448 98\" fill=\"none\" stroke=\"var(--chart-4)\" stroke-width=\"2\" marker-end=\"url(#arCs2)\"/>\n  <text x=\"450\" y=\"156\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"800\" fill=\"var(--success)\">*z++ = *(z++) advances z to 5004 (&amp;y), NOT x!</text>\n  <defs>\n    <marker id=\"arCs\" markerWidth=\"6\" markerHeight=\"6\" refX=\"5\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"var(--primary)\"/></marker>\n    <marker id=\"arCs2\" markerWidth=\"6\" markerHeight=\"6\" refX=\"5\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"var(--chart-4)\"/></marker>\n  </defs>\n</svg>", "bullets": ["<b>Array-Pointer Identity:</b> `a[i] == *(a+i) == *(i+a) == i[a]`! Byte shift of `p + k` is `k * sizeof(*p)`. 2D row-major address of `A[i][j]` (`R` rows, `C` cols): `Base + (i * C + j) * sizeof(T)`.", "<b>Legal vs Illegal Pointer Ops (`arrays.ppt`):</b> Legal: `p + k`, `p - k`, `q - p` (count of elements, e.g. `q - p` for `int`), comparisons `p < q`. <b>ILLEGAL (Compile Error):</b> `p + q`, `p * 2`, `p / 2`!", "<b>Pointer Parameter Decay (`Endsem '23 B-Q9`):</b> Writing `arr2++` on a fixed array `int arr2[10]` in `main()` is INVALID, **HOWEVER** inside `void func(int *arr1, int *arr2, int size)`, `arr2` is a pointer variable — so `*arr2++ = ++(*(arr1 + i));` IS 100% VALID C!"], "walkthrough": {"source": "CS1000 Endsem Feb 2023 Sec A Q10 & Sec B Q9", "problem": "Trace BOTH pointer programs (assume `sizeof(int)=4`, `x,y,z` at `5000, 5004, 5008`):\n```c\n// A-Q10:\nint x = 20, y = 21, *z = &x;\n*z++; x++;\nprintf(\"%u %u %u -> %d %d %d\", &x, &y, z, x, y, *z);\n\n// B-Q9:\nvoid fn(int *a1, int *a2, int n) {\n    for (int i=0; i<n; i++) *a2++ = ++(*(a1 + i));\n} // a1={2,2,3,3,3,4,4,4,4,5}, n=10 -> print a2!\n```", "steps": ["<b>A-Q10 Step:</b> `*z++` parses as `*(z++)` — reads `*z` (`20`, discarded) and increments pointer `z` by $1\\times 4 = 4$ bytes (`5000 -> 5004`, which is `&y`!). Then `x++` sets `x = 21`. Output: **`5000 5004 5004 -> 21 21 21`**!", "<b>B-Q9 Step:</b> Each loop increments `*(a1+i)` in place (`2->3, 3->4, 4->5, 5->6`), assigns it to `*a2`, then advances `a2`! `a2` becomes **`3 3 4 4 4 5 5 5 5 6`**!"], "answer": "A-Q10 prints `5000 5004 5004 -> 21 21 21`; B-Q9 fills `3 3 4 4 4 5 5 5 5 6`."}, "formula": "$$a[i] \\equiv *(a+i) \\qquad\\Big|\\qquad *z++ \\equiv *(z++) \\neq (*z)++ \\qquad\\Big|\\qquad q - p = \\frac{\\text{addr}(q)-\\text{addr}(p)}{\\text{sizeof}(*p)}$$", "trap": "Never confuse `*z++` (moves the pointer address!) with `(*z)++` (adds $1$ to the pointed integer!). And in `Quiz 2` (`r = x[p++];` after `p = --x[1]`), remember `x[p++]` reads `x[p]` FIRST before incrementing `p`!"}, {"title": "10. Strings, ASCII Table, 2D Row Overruns & No-<string.h> Partition", "topicId": "cs_t10", "tag": "strings.ppt, Quiz 2 Q3/C1 & Endsem '23 C-Q1", "intuition": "C has NO native string type — just a `char` array stamped with a sentinel `'\\0'` byte (ASCII `0`) at the end! If you hand-pack `\"how\"` (3 chars) into a 3-column 2D row `char arr[4][3]`, `'\\0'` gets truncated off, forcing `printf(\"%s\")` to keep reading right into the next row!", "bullets": ["<b>Essential ASCII Benchmarks:</b> `'\\0'` = `0`, `' '` = `32`, `'0'..'9'` = `48..57`, `'A'..'Z'` = `65..90`, `'a'..'z'` = `97..122`. Case offset is `'a' - 'A' = 32` (`ch ^ 32` toggles case!).", "<b>`<string.h>` Essentials &amp; `scanf`:</b> `scanf(\"%s\", s)` stops at whitespace and must NOT take `&s`. `strlen(s)` excludes `'\\0'`; `strcmp(a,b)` compares ASCII left-to-right (case-sensitive: `'G'(71) < 'g'(103)`) returning `<0, 0, >0`.", "<b>2D Char Matrix Null-Truncation Trap (`Quiz 2`):</b> `char arr[4][3] = {\"hi\", \"how\", \"are\", \"u\"};` allocates 3 bytes per row. `\"are\"` fills `[0],[1],[2]` with ZERO space for `'\\0'`, so `printf(\"%s\", arr[2])` bleeds seamlessly into `arr[3]` (`\"u\\0\"`) and prints **`areu`**!"], "walkthrough": {"source": "Endsem '23 Sec C Q1 & Quiz 2 Part C Q1 (No <string.h>)", "problem": "Without using `<string.h>`, rearrange a string so all **odd-ASCII** characters appear first (in original order) followed by **even-ASCII** characters (in original order), using at most one extra 1D array.", "code": "#include <stdio.h>\nint main() {\n    char s[200], out[200];\n    int i, k = 0;\n    scanf(\"%s\", s);\n    for (i = 0; s[i] != '\\0'; i++)\n        if (s[i] % 2 != 0) out[k++] = s[i]; // odd ASCII pass\n    for (i = 0; s[i] != '\\0'; i++)\n        if (s[i] % 2 == 0) out[k++] = s[i]; // even ASCII pass\n    out[k] = '\\0'; // CRITICAL sentinel!\n    printf(\"%s\\n\", out);\n    return 0;\n}", "steps": ["<b>Two-Pass Preserve-Order Logic:</b> Writing into `out[k++]` over two `'\\0'`-terminated passes keeps relative order intact cleanly without calling `strlen()` or `strcpy()`!", "<b>Variants (`Quiz 2` vs `Assignment 1`):</b> Swap `!= 0` and `== 0` for even-first (`Quiz 2`); use 3 passes (`> ch`, `== ch`, `< ch`) for partition around character `ch`!"], "answer": "Always terminate with `out[k] = '\\0';` after character loops!"}, "formula": "$$'0'=48,\\ 'A'=65,\\ 'a'=97,\\ '\\backslash 0'=0 \\qquad\\Big|\\qquad \\text{Always finish manual strings with } \\texttt{out[k]='\\backslash 0'}$$", "trap": "NEVER compare two C strings with `if (s1 == s2)` — that checks memory addresses! Always write a `while (s1[i] == s2[i] && s1[i] != '\\0') i++;` loop (or `strcmp` when permitted), and NEVER forget `out[k] = '\\0';`!"}, {"title": "11. Array Coding Drills: Sorting, Binary Search & Pointer Find()", "topicId": "cs_t11", "tag": "arrays.ppt, Lab Questions & Endsem '23 Sec C Q2", "intuition": "Any `arr[i]` lookup is simply sugar for pointer arithmetic `*(arr + i)`. Whether implementing Bubble Sort, Binary Search, or IIITDM's single-pointer array transform (`Find()`), pass the base address and element count `n` cleanly and guard boundary indices (`i >= 1` or `i < n-1`)!", "bullets": ["<b>Bubble / Selection Sort Essentials:</b> Outer pass `i = 0..n-2`, inner loop swaps adjacent inverted pairs `j = 0..n-i-2`. Add a `swapped` flag for $O(n)$ best-case early exit.", "<b>Binary Search (Sorted Arrays Only!):</b> `low=0, high=n-1`, while `low <= high`, check `mid = low + (high-low)/2`. Cuts search space in half every step ($O(\\log n)$).", "<b>Matrix Transpose &amp; Multiplication (`Lab`):</b> Transpose swaps upper triangle `b[j][i] = a[i][j]`; multiplication $C_{m\\times p} = A_{m\\times n} \\times B_{n\\times p}$ checks inner match $n$ and initializes `c[i][j] = 0` before `k` accumulation!"], "walkthrough": {"source": "CS1000 Endsem Feb 2023 Sec C Q2", "problem": "Write `void Find(int *p, int n)` using single-pointer traversal (`*(p+i)`) to subtract `1` from even elements whose preceding element is even (or note neighbor convention) and print the updated array.", "code": "#include <stdio.h>\nvoid Find(int *p, int n) {\n    // Update using pointer indexing *(p + i) (check neighbor parity)\n    for (int i = 1; i < n; i++) {\n        if (*(p + i) % 2 == 0 && *(p + i - 1) % 2 == 0)\n            *(p + i) = *(p + i) - 1;\n    }\n    for (int i = 0; i < n; i++)\n        printf(\"%d \", *(p + i));\n}\nint main() {\n    int n, a[100];\n    scanf(\"%d\", &n);\n    for (int i = 0; i < n; i++) scanf(\"%d\", &a[i]);\n    Find(a, n);\n    return 0;\n}", "steps": ["<b>Pointer Style Constraint:</b> Strictly avoid square brackets `p[i]` inside `Find()` when the prompt asks for pointer arithmetic — use `*(p + i)` throughout BOTH loops!", "<b>Paper Example Clarification:</b> Note Endsem's printed example `1 2 6 4 -> 1 1 5 4` checks *next* element (`*(p+i+1)%2 == 0`) while text says preceding (`*(p+i-1)%2 == 0 -> 1 2 5 4`). Adding a 1-line comment documents your assumption cleanly for full credit!"], "answer": "Single-pointer `*(p + i)` traversal in both passes earns full Section C marks."}, "formula": "$$\\text{mid} = \\text{low} + \\frac{\\text{high}-\\text{low}}{2} \\qquad\\Big|\\qquad \\text{C}[i][j] = \\sum_{k=0}^{n-1} \\text{A}[i][k]\\cdot\\text{B}[k][j]$$", "trap": "In matrix multiplication, forgetting to initialize `c[i][j] = 0` before `for(k=...) c[i][j] += a[i][k]*b[k][j];` adds garbage stack bytes! And never index `*(p + i - 1)` starting at `i = 0` — always start loop at `i = 1`!"}, {"title": "12. Structures, Nested/Pointer (->), Copy & Unions (sizeof Max)", "topicId": "cs_t12", "tag": "STRUCTURES.ppt & Endsem '23 B-Q6, B-Q10, C-Q3", "intuition": "A **`struct`** packs related fields side-by-side in separate lockers (`sizeof = sum` + alignment), whereas a **`union`** forces EVERY field to share ONE single locker (`sizeof = largest member`). Assigning `p3 = p2;` performs a deep byte copy of struct members — even fixed char arrays inside — so mutating `p3.name` does NOT corrupt `p2.name`!", "bullets": ["<b>Struct Rules (`STRUCTURES.ppt`):</b> `struct S { int id; char name[20]; };` ONLY declares a template — **NEVER write `int id = 1;` inside struct braces!** Always end with `;`.", "<b>Dot vs Arrow &amp; Member Copy (`Endsem '23 B-Q6, B-Q10`):</b> Variable `s.id` uses dot; pointer `ptr->id` (identical to `(*ptr).id`) uses arrow. `p3 = p2;` copies every byte (including arrays inside the struct!).", "<b>Union Shared Memory Rule:</b> In `union Data { int i; float f; char str[20]; };`, `sizeof(union Data) == 20` bytes (largest member!). Writing one member overwrites the others!"], "walkthrough": {"source": "CS1000 Endsem Feb 2023 Sec C Q3 (BinCalc Struct Program)", "problem": "Using `struct BinCalc { char str1[65], str2[65], str3[65]; int dec; char hexd[20]; };`, add two binary strings via pass-by-value `struct BinCalc add(struct BinCalc)` and convert to decimal/hex via `void convert(struct BinCalc *)`.", "code": "#include <stdio.h>\n#include <string.h>\nstruct BinCalc { char str1[65], str2[65], str3[65]; int dec; char hexd[20]; };\nstruct BinCalc add(struct BinCalc b) {\n    int i = strlen(b.str1) - 1, j = strlen(b.str2) - 1;\n    int maxl = (i > j ? i : j) + 1, carry = 0, k = maxl - 1;\n    char tmp[66]; tmp[maxl] = '\\0';\n    while (k >= 0) {\n        int s = carry + (i >= 0 ? b.str1[i--] - '0' : 0) + (j >= 0 ? b.str2[j--] - '0' : 0);\n        tmp[k--] = (s % 2) + '0';\n        carry = s / 2;\n    }\n    if (carry) { b.str3[0] = '1'; strcpy(b.str3 + 1, tmp); }\n    else strcpy(b.str3, tmp);\n    return b;\n}\nvoid convert(struct BinCalc *b) {\n    int d = 0;\n    for (int i = 0; b->str3[i] != '\\0'; i++) d = d * 2 + (b->str3[i] - '0');\n    b->dec = d;\n    sprintf(b->hexd, \"%X\", d);\n}", "steps": ["<b>Why `add` Returns `struct BinCalc`:</b> `add(x)` receives a copy by value, computes binary sum right-to-left using `carry`, and returns updated struct to `x = add(x);`.", "<b>Why `convert` Uses `->`:</b> `convert(&x)` passes address `&x`, so `b->dec` and `b->str3` mutate `x` directly in `main()`!"], "answer": "Sample `\"1001\" + \"100\"` $\\to$ `str3=\"1101\"`, `dec=13`, `hexd=\"D\"`."}, "formula": "$$p.\\text{field} \\ \\ (\\text{struct var}) \\qquad\\Big|\\qquad \\text{ptr}\\to\\text{field} \\equiv (*\\text{ptr}).\\text{field} \\qquad\\Big|\\qquad \\text{sizeof(union)} = \\max(\\text{members})$$", "trap": "Watch two struct compile errors: (1) initializing values inside `struct Box { int w = 5; };`; (2) writing `*ptr.val` instead of `(*ptr).val` or `ptr->val` (dot `.` binds tighter than `*`!)."}, {"title": "13. File Handling (FILE*, Modes, fseek/ftell) & #define Macros", "topicId": "cs_t13", "tag": "FILES.ppt & BASICS-1 Preprocessor", "intuition": "RAM evaporates when power shuts off; **`FILE *fp`** opens a highway to permanent disk files! Pick your open mode carefully: **`\"w\"` ruthlessly erases any existing file on contact**, **`\"r\"` returns `NULL` if missing**, and `fgetc()` MUST sit in an **`int`** so negative `EOF (-1)` stays cleanly separated from character byte `255`!", "table": {"headers": ["Mode", "Action & Missing File Behavior", "Existing File Impact (Write Cursor)"], "rows": [["`\"r\"` / `\"rb\"`", "Read only; returns **`NULL`** if missing", "Unchanged; cursor at byte 0"], ["`\"w\"` / `\"wb\"`", "Write only; creates file if missing", "**DESTROYS / truncates to 0 bytes!**"], ["`\"a\"` / `\"ab\"`", "Append; creates file if missing", "Preserves content; all writes go to **EOF**"], ["`\"r+\"`, `\"w+\"`, `\"a+\"`", "Read + Write modes (binary add `b`)", "`r+` fails if missing; `w+` wipes existing; `a+` appends"]]}, "bullets": ["<b>Text vs Binary I/O &amp; Random Access (`FILES.ppt`):</b><br>&bull; Char/Line: `int ch = fgetc(fp);` (`!= EOF`), `fputc(ch, fp)`, `fgets(buf, n, fp)`, `fputs(s, fp)`.<br>&bull; Formatted: `fscanf(fp, ...)`, `fprintf(fp, ...)`. Binary: `fread`/`fwrite(&rec, sizeof(rec), 1, fp)`.<br>&bull; Cursor Control: `fseek(fp, offset, origin)` where origin is `SEEK_SET` (`0`, start), `SEEK_CUR` (`1`), `SEEK_END` (`2`, end — use negative offset to step backward!); `ftell(fp)` gives byte offset; `rewind(fp)` resets to `0`.", "<b>Preprocessor `#define` Macro Traps (`BASICS-1`):</b> Pure textual replacement without type-checking or parentheses! `#define SQ(x) x*x` turns `SQ(1+2)` into `1+2*1+2` = **5** (fix with `#define SQ(x) ((x)*(x))`!)."], "walkthrough": {"source": "FILES.ppt Complete Copy + Count & fseek Size Pattern", "problem": "Write a C file utility that copies `in.txt` to `out.txt`, counts characters, and finds file size in bytes using `fseek` + `ftell` (or traces `#define SQ(x) x*x`).", "code": "#include <stdio.h>\n#include <stdlib.h>\nint main() {\n    FILE *fp1 = fopen(\"in.txt\", \"r\"), *fp2 = fopen(\"out.txt\", \"w\");\n    if (fp1 == NULL || fp2 == NULL) { printf(\"Open failed\\n\"); exit(1); }\n    int ch, cnt = 0;\n    while ((ch = fgetc(fp1)) != EOF) {\n        fputc(ch, fp2);\n        cnt++;\n    }\n    fseek(fp1, 0L, SEEK_END);\n    long bytes = ftell(fp1);\n    printf(\"Copied %d chars (%ld bytes)\\n\", cnt, bytes);\n    fclose(fp1); fclose(fp2);\n    return 0;\n}", "steps": ["<b>Check `NULL` Always:</b> Opening a non-existent file with `\"r\"` returns `NULL`; dereferencing a `NULL` pointer crashes cleanly prevented by `if (fp1 == NULL) exit(1);`.", "<b>Random Access Trick:</b> `fseek(fp1, 0L, SEEK_END)` parks the cursor at EOF so `ftell(fp1)` returns exact file size in bytes!"], "answer": "Stores `fgetc` into `int ch`, checks `!= EOF` and `!= NULL`, uses `SEEK_END` + `ftell`."}, "formula": "$$\\texttt{\"w\"} \\text{ wipes} \\quad|\\quad \\texttt{\"r\"} \\text{ needs existing} \\quad|\\quad \\texttt{SEEK\\_SET(0), SEEK\\_CUR(1), SEEK\\_END(2)}$$", "trap": "Never write `char ch; while((ch = fgetc(fp)) != EOF)` — `EOF` is `-1` (int), and unsigned-char systems never equal `-1` causing an infinite loop! Also remember **no `\"w\"`** when you meant `\"r+\"` or `\"a\"` — `\"w\"` erases the file on open!"}], "practice": [{"id": "cs_q1", "src": "Quiz / Lab", "level": "COM105T & C questions on NS", "q": "(a) Find all valid $(X,Y)$ such that $(123)_5 = (X8)_Y$. (b) Convert $(2\\text{B}5.\\text{EF})_{16}$ to Octal. (c) Convert $-9$ to 8-bit Sign-Magnitude &amp; 2's Complement.", "hint": "Enforce digit `8 < Y` ($Y \\ge 9$) and `1 <= X < Y` in (a); group 4-bit hex -> 3-bit octal in (b).", "sol": "(a) $(123)_5 = 38_{10} = XY + 8 \\implies XY = 30,\\ Y\\ge 9,\\ X<Y \\implies \\mathbf{(3,10), (2,15), (1,30)}$.\n(b) `0010 1011 0101 . 1110 1111` $\\to$ `(001 010 110 101 . 111 011 110)` $= \\mathbf{(1265.736)_8}$.\n(c) $+9 = 00001001$: Sign-Mag $= \\mathbf{10001001}$, 2's Comp $= \\mathbf{11110111}$."}, {"id": "cs_q2", "src": "Quiz / Lab", "level": "COM105T Shift & Signed Wrap", "q": "(a) Given 16-bit 2's comp $P = (\\text{F87B})_{16}$, evaluate $8 \\times P$ in Hex &amp; Dec. (b) Trace `char c = 125; c = c + 3; printf(\"%d %d\", c, ~0);`.", "hint": "$8\\times P$ is $P \\ll 3$ keeping 16 bits! Signed `char` max is $+127$.", "sol": "(a) $P = -1925_{10}$, $8\\times P = -15400_{10}$ (no overflow in $[-32768,32767]$); shifting left 3 bits gives $\\mathbf{(\\text{C3D8})_{16}}$.\n(b) `125 + 3 = 128` wraps to **`-128`**; `~0` flips all 0s to 1s $= \\mathbf{-1}$."}, {"id": "cs_q3", "src": "Midsem / Endsem", "level": "BASICS-1 Pipeline & Literals", "q": "(a) Which of the 4 build phases catches: `Main()` instead of `main()`, missing `;`, and `#define PI 3.14;`? (b) Find `sizeof('a')`, `sizeof(\"a\")`, `sizeof(2.5)`, and `sizeof(2.5f)` on 32/64-bit GCC.", "hint": "`Main()` compiles cleanly until Linking! Character constants in C have type `int`!", "sol": "(a) `Main()` = **Linker Error**; missing `;` = **Compiler Error**; `;` on `#define` causes syntax error after **Preprocessor** expansion during **Compilation**.\n(b) `sizeof('a') = 4`, `sizeof(\"a\") = 2`, `sizeof(2.5) = 8`, `sizeof(2.5f) = 4`."}, {"id": "cs_q4", "src": "Quiz / Lab", "level": "operators.ppt & COM105T", "q": "Evaluate: (a) `1 << 2 + 3 << 4`; (b) `5 > 3 > 1`; (c) `int x=10, y=11; if (~(x ^ y)) printf(\"EQ\");`; (d) `int k = (1, 2, 3);` vs `int k = 1, 2, 3;`.", "hint": "`+` beats `<<`; `>` associates L-to-R; `~` is bitwise NOT!", "sol": "(a) `(1 << 5) << 4 = 512`.\n(b) `(5 > 3) > 1 = 1 > 1 = 0`.\n(c) `10^11 = 1`, `~1 = -2` (non-zero = TRUE!) $\\implies$ prints **`EQ`**.\n(d) `(1,2,3)` sets `k = 3`; unparenthesized `int k=1,2,3;` is a **Compile Error**."}, {"id": "cs_q5", "src": "Quiz / Lab", "level": "Assignment 1 Code Images", "q": "Trace: (a) `int i = 5; printf(\"%d \", sizeof(i++)); printf(\"%d\", i);`; (b) `printf(\"%d\", printf(\"AA\") || printf(\"BB\"));`; (c) `10++` and `#define C 7; ++C`.", "hint": "`sizeof` skips side-effects; `||` short-circuits when LHS is non-zero!", "sol": "(a) Prints **`4 5`** (`i` NOT incremented!).\n(b) Prints `AA`, returns `2` (truthy!), skips `BB`, `||` yields `1` $\\implies$ **`AA1`**.\n(c) Both fail to compile (**Compile Error: lvalue required**)."}, {"id": "cs_q6", "src": "Midsem / Endsem", "level": "Endsem 2023 Sec A Q2", "q": "Find the output or error:\n```c\nint a = 3, b = 4, c = b - a;\nswitch(c) {\n    case 1 || 2 && 15%5:    printf(\"Grade S\\n\"); break;\n    case !(10%3*5%5) && -10: printf(\"Grade A\\n\"); break;\n}\n```", "hint": "Compute BOTH `case` constant values using exact precedence (`%`, `*`, `!`, `&&`, `||`)!", "sol": "Case 1: `15%5=0 -> 2&&0=0 -> 1||0 = 1`. Case 2: `10%3=1 -> 1*5=5 -> 5%5=0 -> !0=1 -> 1&&-10 = 1`.\n**Compile Error: duplicate case value `1`**!"}, {"id": "cs_q7", "src": "Midsem / Endsem", "level": "Midsem 2022 Q4 & Quiz 2", "q": "Contrast: (a) `if(a == 5); else printf(\"No\");` vs `if(a == 5); printf(\"Yes\");` (`Midsem '22`); (b) `float f=1.0; switch(f){}` and `int x=3; switch(x){ case 3: ... case 7-4: ... }` (`Quiz 2`).", "hint": "Empty `;` ends an `if`! Duplicate case or `float` inside `switch` fails compilation.", "sol": "(a) First is **Compile Error (`else` without previous `if`)**; second prints `Yes` unconditionally!\n(b) `switch(f)` = Compile Error (`float` invalid); `case 3:` &amp; `case 7-4:` = Compile Error (duplicate `3`)."}, {"id": "cs_q8", "src": "Quiz / Lab", "level": "Switch&If_else Fallthrough", "q": "Trace:\n```c\nint x = 2;\nswitch (x) {\n    default: x += 10;\n    case 1:  x += 1;\n    case 2:  x *= 3;\n    case 3:  x += 4; break;\n}\n```", "hint": "`x=2` jumps directly to `case 2:`, skips `default:`, and falls into `case 3:`!", "sol": "Jumps straight to `case 2:` ($x = 2\\times 3 = 6$), falls into `case 3:` ($x = 6+4 = 10$), then hits `break` $\\implies$ `x = 10`."}, {"id": "cs_q9", "src": "Quiz / Lab", "level": "Quiz 2 Loops Q1, Q5 & COM105T", "q": "Trace exact output of all 3 loops: (a) `int c=6; while(c--) printf(\"%d \", c);`; (b) `int x=5; for(x=0; 0;) printf(\"hi\"); printf(\"%d\", x);`; (c) `int i=1024, cnt=0; for(; i; i>>=1) cnt++;`.", "hint": "Watch post-decrement `c--` and `x=0` running once in `for` init!", "sol": "(a) Prints **`5 4 3 2 1 0`** (`c` ends at `-1`).\n(b) Loop doesn't run, init ran once $\\implies$ prints **`0`**.\n(c) $2^{10}$ down to $2^0 \\implies \\texttt{cnt} = \\mathbf{11}$."}, {"id": "cs_q10", "src": "Midsem / Endsem", "level": "BASICS-1 Macro Trap", "q": "Trace `#define SQ(x) x*x` when evaluating `int a = 36 / SQ(6);` and `int b = SQ(1 + 2);`.", "hint": "Preprocessor does blind text substitution BEFORE arithmetic!", "sol": "`36 / 6 * 6 = 6 * 6` = **36** (NOT `1`!); `1 + 2 * 1 + 2` = **5** (NOT `9`!). Always write `#define SQ(x) ((x)*(x))`!"}, {"id": "cs_q11", "src": "Midsem / Endsem", "level": "Endsem 2023 Sec A Q4", "q": "What does `f(1)` return?\n```c\nint f(int n) {\n    static int i = 1;\n    if (n >= 5) return n;\n    n = n + i; i++;\n    return f(n);\n}\n```", "hint": "`static int i` initializes ONLY ONCE and grows `1->2->3->4` across recursive calls!", "sol": "`f(1)`: `n=2,i=2` $\\to$ `f(2)`: `n=4,i=3` $\\to$ `f(4)`: `n=7,i=4` $\\to$ `f(7)` hits `n>=5` and returns **`7`**."}, {"id": "cs_q12", "src": "Midsem / Endsem", "level": "Endsem 2023 Sec A Q8", "q": "Trace output:\n```c\nint i = 10;\nvoid check() { printf(\"%d \", i++); }\nint main() {\n    int i = 20; printf(\"%d \", i);\n    check(); printf(\"%d\", ++i);\n    return 0;\n}\n```", "hint": "`main` uses its local `i=20`; `check()` sees ONLY global `i=10`!", "sol": "1) `main` prints **`20`**.\n2) `check()` prints global **`10`** (`global i -> 11`).\n3) `main` prints `++i` of local `20` $\\to$ **`21`**. Output: **`20 10 21`**."}, {"id": "cs_q13", "src": "Midsem / Endsem", "level": "Endsem 2023 Sec B Q3", "q": "Trace output for `func(2048, 0)` in `main` (local `int sum=0;` passed by value):\n```c\nvoid func(int n, int sum) {\n    int k = 0, j = 0; if (n == 0) return;\n    k = n % 10; j = n / 10; sum += k;\n    func(j, sum); printf(\"%d,\", k);\n}\n// main prints sum after func(2048, sum);\n```", "hint": "`printf` runs AFTER recursive call (unwinds forward!) AND `sum` was pass-by-value!", "sol": "Frames store `k=8,4,0,2`; unwinding prints **`2,0,4,8,`**. `main`'s `sum` stayed `0` $\\implies$ **`2,0,4,8,0`**."}, {"id": "cs_q14", "src": "Midsem / Endsem", "level": "Endsem 2023 Sec B Q4 & B-Q7", "q": "(a) `B-Q4`: `int cal(int *i, int j){ *i *= *i; j *= j; return 2*j; }` called with `i=5, j=2, t=cal(&i,j); j+=t*3; i=i-t+7;`. Find `i,j`. (b) `B-Q7`: `a=4,b=5,c=6; f1(a,b); f2(&b,&c);` (`f1` value-swaps, `f2` pointer-swaps). Find `c-a-b`.", "hint": "Watch which variables were passed by pointer vs by value!", "sol": "(a) `*i` becomes `25` (`main`'s `i=25`); local `j` becomes `4`, returns `t=8`. In `main`: `j=2+24=26`, `i=25-8+7=24` $\\implies$ **`24,26`**.\n(b) `b=6, c=5, a=4` $\\implies c-a-b = 5-4-6 = \\mathbf{-5}$."}, {"id": "cs_q15", "src": "Quiz / Lab", "level": "scope.pptx Storage Classes", "q": "Compare `auto`, `extern`, `static`, and `register` across Default Init, Storage, Scope, and Lifetime. What happens if you take `&r` on `register int r = 5;`?", "hint": "CPU registers lack byte RAM addresses; `static`/`extern` zero-initialize automatically.", "sol": "`auto`/`register`: Stack/CPU Reg, Garbage, Local, Block. `static`: Data, `0`, Local/File, Whole Program. `extern`: Data, `0`, Global, Whole Program. `&r` on `register` triggers **Compile Error**!"}, {"id": "cs_q16", "src": "Midsem / Endsem", "level": "Endsem 2023 Sec A Q10", "q": "Contiguous ints `x=20 (5000), y=21 (5004), *z=&x (5008)`. After `*z++; x++;`, print addresses `&x, &y, z` and values `x, y, *z`.", "hint": "Suffix `++` binds BEFORE dereference `*` (`*(z++)`)!", "sol": "`*z++` advances pointer `z` from `5000` to `5004` (`&y`), leaving `x=20`! Then `x++` sets `x=21`.\nOutput: **`5000 5004 5004` and `21 21 21`**."}, {"id": "cs_q17", "src": "Midsem / Endsem", "level": "Endsem 2023 Sec B Q9", "q": "Trace output of `a1 = {2,2,3,3,3,4,4,4,4,5}` (`n=10`):\n```c\nvoid func(int *arr1, int *arr2, int size) {\n    for (int i = 0; i < size; i++)\n        *arr2++ = ++(*(arr1 + i));\n}\n```", "hint": "`arr2` is a pointer PARAMETER inside `func`, so `arr2++` is 100% legal and leaves `main`'s array pointer intact!", "sol": "Each element of `a1` increments by 1 and stores into consecutive `a2` slots: prints **`3 3 4 4 4 5 5 5 5 6`**."}, {"id": "cs_q18", "src": "Quiz / Lab", "level": "Quiz 2 Q4 & arrays.ppt", "q": "(a) `int x[5] = {6,2,12,18,20}; p = --x[1]; r = x[p++]; printf(\"%d,%d\", p, r);` (`Quiz 2`). (b) For `int a[4][5]` at base `1000` (`sizeof(int)=4`), find address of `a[2][3]`; state why `p/2` is illegal.", "hint": "`--x[1]` drops `x[1]` from `2` to `1` BEFORE reading `x[p++]`! Row-major uses `(i*cols + j)*4`.", "sol": "(a) `p=1, x[1]=1`; `r = x[1] = 1`, then `p` increments to `2` $\\implies$ prints **`2,1`**.\n(b) `1000 + (2*5 + 3)*4 = 1052`; multiplying/dividing pointers (`p/2`, `p+q`) has no address meaning $\\implies$ Compile Error."}, {"id": "cs_q19", "src": "Quiz / Lab", "level": "Quiz 2 Q3 & strings.ppt", "q": "(a) `char arr[4][3] = {\"hi\", \"how\", \"are\", \"u\"}; printf(\"%s\", arr[2]);` (`Quiz 2`). (b) Compare `strcmp(\"Gate\", \"gate\")` and `strlen` vs `sizeof` on `char s[20]=\"ABC\"`.", "hint": "`\"are\"` fills all 3 columns with zero room for `'\\0'`!", "sol": "(a) `arr[2]` lacks `'\\0'` so `%s` continues into `arr[3]` (`\"u\\0\"`) printing **`areu`**!\n(b) `'G'(71) - 'g'(103) < 0` (`< 0`); `strlen(s) = 3` vs `sizeof(s) = 20`."}, {"id": "cs_q20", "src": "Midsem / Endsem", "level": "Endsem 2023 Sec B Q6", "q": "Trace the printed lines:\n```c\nstruct Product { char name[20]; float price; };\nstruct Product p1={\"Pen\",30}, p2={\"paper\",120}, p3;\np3 = p2; p3.name[0] = 'P'; p2.price /= 4;\n// print p1, p2, p3 if p3.price > p2.price\n```", "hint": "`p3 = p2;` makes an independent copy of `char name[20]` inside `p3`!", "sol": "`p3.name` becomes `\"Paper\"` while `p2.name` stays `\"paper\"`; `p2.price = 30.0 < 120.0 = p3.price` is true.\nPrints `Pen, 30.000000`, `paper, 30.000000`, `Paper, 120.000000`."}, {"id": "cs_q21", "src": "Midsem / Endsem", "level": "Endsem 2023 Sec B Q10", "q": "Trace:\n```c\nstruct Elem { int id, val; } List[5] = {{1,37},{2,16},{3,84},{4,71},{5,48}};\nfor (int i = 0; i < 5; i++)\n    printf(\"%d %d\\n\", List[i].id, List[i].val % 2 ? List[i].val * 2 : List[i].val);\n```", "hint": "Odd `val` (`val%2 != 0`) prints `val * 2`; even `val` prints unchanged!", "sol": "1 -> `1 74`\n2 -> `2 16`\n3 -> `3 84`\n4 -> `4 142`\n5 -> `5 48`."}, {"id": "cs_q22", "src": "Quiz / Lab", "level": "STRUCTURES.ppt Unions", "q": "(a) Why does `struct S { int a = 10; float b; };` fail to compile? (b) Find `sizeof` and corruption effect for `union U { int i; double d; char s[12]; };` (double=8 B, char=1 B).", "hint": "Struct template declares layout without allocating RAM; union allocates ONLY the single largest member!", "sol": "(a) Cannot initialize struct members inside template definition (no memory exists yet!).\n(b) `sizeof(union U)` = max(4, 8, 12) + alignment = `16` (or `12` unpacked, usually `max` = largest type in slides: `12`/`20` for `char str[20]`); writing `u.d` overwrites `u.i` and `u.s`."}, {"id": "cs_q23", "src": "Quiz / Lab", "level": "FILES.ppt File Modes & fseek", "q": "(a) Contrast `fopen(\"data.txt\", \"w\")` vs `\"a\"` vs `\"r+\"` if `data.txt` already holds `Hello`. What if missing? (b) Explain `fseek(fp, -5L, SEEK_CUR)` and why `fgetc(fp)` goes in an `int`.", "hint": "`w` wipes! `EOF = -1` fails unsigned `char` checks!", "sol": "(a) `\"w\"` WIPES `Hello` (creates if missing); `\"a\"` appends after `Hello` (creates if missing); `\"r+\"` reads/overwrites from byte 0 (returns `NULL` if missing).\n(b) Rewinds cursor 5 bytes backward from current position; `int` holds full `0..255` bytes PLUS `-1` (`EOF`)."}, {"id": "cs_q24", "src": "Midsem / Endsem", "level": "Midsem 2022 Part C Q1", "q": "Write a complete C program to check if an entered 3-digit integer is an Armstrong number ($n = d_1^3 + d_2^3 + d_3^3$), e.g. $153$ or $371$.", "hint": "Save `orig = n;` BEFORE extracting digits with `n % 10` and `n /= 10`!", "sol": "```c\nint n, orig, d, sum = 0; scanf(\"%d\", &n); orig = n;\nwhile (n > 0) { d = n % 10; sum += d * d * d; n /= 10; }\nprintf(sum == orig ? \"Armstrong\" : \"Not\");\n```"}, {"id": "cs_q25", "src": "Midsem / Endsem", "level": "Endsem 2023 C-Q1 & Quiz 2 C-Q1", "q": "Write a complete C program WITHOUT using `<string.h>` to partition an input word so **odd-ASCII** chars come first, followed by **even-ASCII** chars (preserving order within each group).", "hint": "Two clean `'\\0'` loops filling `out[k++]`, terminated by `out[k] = '\\0';`!", "sol": "Pass 1: `for(i=0; s[i]!='\\0'; i++) if(s[i]%2!=0) out[k++]=s[i];`\nPass 2: `for(i=0; s[i]!='\\0'; i++) if(s[i]%2==0) out[k++]=s[i];`\nFinalize: `out[k] = '\\0';`!"}, {"id": "cs_q26", "src": "Midsem / Endsem", "level": "Endsem 2023 C-Q2 (Pointer Array)", "q": "Write `void Find(int *p, int n)` using single-pointer traversal (`*(p+i)`) to subtract `1` from even elements whose preceding element is even and print the updated array.", "hint": "Loop `i=1..n-1` checking `*(p+i)%2==0 && *(p+i-1)%2==0`, then print via `*(p+i)`!", "sol": "```c\nvoid Find(int *p, int n) {\n    for (int i = 1; i < n; i++)\n        if (*(p + i) % 2 == 0 && *(p + i - 1) % 2 == 0) *(p + i) -= 1;\n    for (int i = 0; i < n; i++) printf(\"%d \", *(p + i));\n}\n```"}, {"id": "cs_q27", "src": "Midsem / Endsem", "level": "Endsem 2023 C-Q3 (BinCalc Struct)", "q": "Design `struct BinCalc` (`str1,str2,str3,dec,hexd`), `struct BinCalc add(struct BinCalc)` to sum two binary strings, and `void convert(struct BinCalc *)` to compute decimal + uppercase hex.", "hint": "Right-to-left loop adding `(char - '0') + carry`; accumulate `d = d*2 + (bit - '0')` in `convert` using `->`!", "sol": "`add` indexes from `strlen-1` backwards computing `(sum%2)+'0'` &amp; `carry=sum/2`, prepending `'1'` if final carry exists. `convert(struct BinCalc *b)` loops `b->str3` to build `b->dec` and formats `b->hexd` via `sprintf(b->hexd, \"%X\", d)` (or `%16` hex digit table)."}, {"id": "cs_q28", "src": "Midsem / Endsem", "level": "Endsem 2023 C-Q4 & Lab Primes", "q": "Write C functions for: (a) printing all positive factors of `n` (`Endsem '23 C-Q4`); (b) testing prime (`isPrime(int n)`) efficiently.", "hint": "Edge-case `n <= 1` is NOT prime; test divisors `d` from `2` up to `d*d <= n`!", "sol": "(a) `for(int i=1; i<=n; i++) if(n%i==0) printf(\"%d \", i);`.\n(b) `if(n<=1) return 0; for(int d=2; d*d<=n; d++) if(n%d==0) return 0; return 1;`."}, {"id": "cs_q29", "src": "Quiz / Lab", "level": "Practice-3 Recursive Power & Palindrome", "q": "Write: (a) a recursive function to compute sum of digits `sumDig(int n)`; (b) a manual string palindrome check WITHOUT `<string.h>`.", "hint": "Base case `n == 0` in (a); count length manually in (b) and walk two indices `l++, r--` toward middle!", "sol": "(a) `int sumDig(int n){ return n==0 ? 0 : (n%10) + sumDig(n/10); }`.\n(b) `int len=0; while(s[len]!='\\0') len++; for(int l=0,r=len-1; l<r; l++,r--) if(s[l]!=s[r]) return 0; return 1;`."}, {"id": "cs_q30", "src": "Quiz / Lab", "level": "FILES.ppt File Copy & Line Count", "q": "Write a C program to open `in.txt` for reading and `out.txt` for writing, check `NULL` failure cleanly, copy all bytes, count newline characters `'\\n'`, and close both streams.", "hint": "Store `fgetc(fp1)` in an `int ch` variable so `EOF` detection never fails!", "sol": "```c\nint ch, lines = 0;\nFILE *f1 = fopen(\"in.txt\", \"r\"), *f2 = fopen(\"out.txt\", \"w\");\nif (!f1 || !f2) return 1;\nwhile ((ch = fgetc(f1)) != EOF) {\n    fputc(ch, f2);\n    if (ch == '\\n') lines++;\n}\nfclose(f1); fclose(f2);\n```"}]}};

function escHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function highlightC(code) {
  const lines = code.split(/\r?\n/);
  const rendered = lines.map((line, i) => {
    const tokens = [];
    const stash = (cls, txt) => {
      tokens.push(`<span class="${cls}">${escHtml(txt)}</span>`);
      return `@@TOK${tokens.length - 1}@@`;
    };
    let out = line
      .replace(/\/\*[\s\S]*?\*\//g, m => stash("tok-com", m))
      .replace(/\/\/.*/g, m => stash("tok-com", m))
      .replace(/^\s*#\s*\w+(?:\s*<[^>\n]+>)?/g, m => stash("tok-pp", m))
      .replace(/"(?:\\.|[^"\\])*"/g, m => stash("tok-str", m))
      .replace(/'(?:\\.|[^'\\])*'/g, m => stash("tok-str", m));
    out = escHtml(out)
      .replace(/\b(int|void|char|float|double|struct|union|FILE|unsigned|long|short|const|static|extern|register|auto|size_t)\b/g, '<span class="tok-ty">$1</span>')
      .replace(/\b(return|if|else|switch|case|default|for|while|do|break|continue|sizeof|exit|NULL|EOF)\b/g, '<span class="tok-kw">$1</span>')
      .replace(/\b([a-zA-Z_]\w*)(?=\()/g, '<span class="tok-fn">$1</span>')
      .replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-num">$1</span>');
    for (let t = 0; t < tokens.length; t++) out = out.replace(`@@TOK${t}@@`, tokens[t]);
    return `<span class="code-ln">${i + 1}</span>${out}`;
  }).join("\n");

  const encoded = btoa(unescape(encodeURIComponent(code)));
  return `<div class="code-frame"><div class="code-head"><span>C Source</span><button type="button" class="copy-code-btn" data-code64="${encoded}">Copy</button></div><pre class="code-hl"><code>${rendered}</code></pre></div>`;
}

function renderMathString(latex, displayMode) {
  if (window.katex && window.katex.renderToString) {
    try {
      return window.katex.renderToString(latex, { displayMode, throwOnError: false, strict: false });
    } catch (_) {}
  }
  return `<span style="font-family:Georgia,serif;">${escHtml(latex)}</span>`;
}

function renderSegmentWithInline(seg) {
  const stashed = [];
  const put = val => {
    stashed.push(val);
    return `@@SEG${stashed.length - 1}@@`;
  };
  let s = seg
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => put(`<div style="text-align:center;">${renderMathString(m.trim(), true)}</div>`))
    .replace(/\$([^$\n]+?)\$/g, (_, m) => put(renderMathString(m.trim(), false)))
    .replace(/`([^`\n]+?)`/g, (_, m) => put(`<code class="inline-code">${escHtml(m)}</code>`));
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");
  for (let i = 0; i < stashed.length; i++) s = s.replace(`@@SEG${i}@@`, stashed[i]);
  return s;
}

function formatRich(raw) {
  if (!raw) return "";
  const blocks = raw.split(/(```[a-zA-Z]*\n[\s\S]*?```)/g);
  return blocks.map(b => {
    const m = b.match(/^```([a-zA-Z]*)\n([\s\S]*?)```$/);
    if (m) return highlightC(m[2].replace(/\n$/, ""));
    return renderSegmentWithInline(b);
  }).join("");
}

function getCounts() {
  let totalT = 0, doneT = 0, totalQ = 0, doneQ = 0;
  Object.keys(DATA).forEach(k => {
    totalT += DATA[k].topics.length;
    doneT += DATA[k].topics.filter(t => state.checkedTopics[t.id]).length;
    totalQ += DATA[k].practice.length;
    doneQ += DATA[k].practice.filter(q => state.solvedQ[q.id]).length;
  });
  return { totalT, doneT, totalQ, doneQ };
}

function updateHeader() {
  const { totalT, doneT, totalQ, doneQ } = getCounts();
  const score = Math.round(((doneT * 1.4 + doneQ) / (totalT * 1.4 + totalQ)) * 100);
  document.getElementById("global-pct").textContent = `${score}%`;
  document.getElementById("global-sub-stat").textContent = `${doneT}/${totalT} • ${doneQ}/${totalQ}`;

  const sub = DATA[state.subject];
  const st = sub.topics.filter(t => state.checkedTopics[t.id]).length;
  const sq = sub.practice.filter(q => state.solvedQ[q.id]).length;
  document.getElementById("stat-topics").textContent = `${st}/${sub.topics.length}`;
  document.getElementById("stat-drills").textContent = `${sq}/${sub.practice.length}`;
  document.getElementById("tab-practice").textContent = `Practice Arena (${sub.practice.length} Qs)`;

  const outBtn = document.getElementById("toggle-outline-btn");
  if (state.mode === "slides") {
    outBtn.classList.remove("hidden");
    outBtn.textContent = state.sidebarHidden ? "Show Outline" : "Hide Outline";
  } else {
    outBtn.classList.add("hidden");
  }
  document.documentElement.style.setProperty("--sub-accent", sub.accent);
}

function renderNav() {
  const strip = document.getElementById("course-strip");
  strip.innerHTML = Object.keys(DATA).map(k => {
    const s = DATA[k];
    const active = state.subject === k;
    const tDone = s.topics.filter(t => state.checkedTopics[t.id]).length;
    const qDone = s.practice.filter(q => state.solvedQ[q.id]).length;
    const pct = Math.round(((tDone + qDone) / (s.topics.length + s.practice.length)) * 100);
    return `
      <button type="button" data-sub="${k}" class="course-pill ${active ? "active" : ""}" style="--sub-accent:${s.accent}">
        <div class="cp-top">
          <span class="cp-code">${s.code}</span>
          <span class="cp-pct tabular">${pct}%</span>
        </div>
        <div class="cp-name">${s.name}</div>
        <div class="cp-meta">${s.slides.length} Lessons &bull; ${s.practice.length} Qs</div>
        <div class="cp-bar"><div class="cp-fill" style="width:${pct}%"></div></div>
      </button>`;
  }).join("");

  document.querySelectorAll(".course-pill").forEach(b => {
    b.onclick = () => { state.subject = b.dataset.sub; state.highlightQ = null; saveState(); renderAll(); };
  });
  document.querySelectorAll(".mode-tab").forEach(b => {
    const active = state.mode === b.dataset.mode;
    b.className = `mode-tab ${active ? "active" : ""}`;
    b.onclick = () => { state.mode = b.dataset.mode; state.highlightQ = null; saveState(); renderAll(); };
  });
}

function renderSlides(sub) {
