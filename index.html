xt{in}}$ in (a) and $S = |V|^2/Z^*$ in (b).", "sol": "(a) $Z = 10 + 1.8824 + j4.4706 = 11.882 + j4.471\\,\\Omega \\implies \\text{pf} = 0.9359\\text{ lag},\\ P = 2007.1\\text{ W}$.\n(b) $S = 120^2/60\\angle 30^\\circ + 120^2/40\\angle -45^\\circ = 462.40 + j134.56\\text{ VA} \\implies |S|=481.58\\text{ VA},\\ \\text{pf} = 0.960\\text{ lag}$."}, {"id": "ec_q22", "src": "Assignment / Tutorial", "level": "A2-2 Q11 & Assignment 3 Q8", "q": "(a) `A2-2 Q11`: $60\\,\\Omega$ in $(60+j20\\,\\Omega) \\parallel (30-j10\\,\\Omega)$ fed via $20\\,\\Omega$ absorbs $240\\text{ W}$. Find $\\mathbf{V}_s$ and $S_{\\text{tot}}$. (b) `A3 Q8`: $120\\angle 0^\\circ\\text{ V}_{\\text{rms}}$ load feeds $15\\text{ W} @ 0.8\\text{ lead}$ after $(0.3+j0.15\\,\\Omega)$ line and $10\\text{ W} @ 0.9\\text{ lag}$ after $(0.2+j0.04\\,\\Omega)$ feeder: find $V_s$.", "hint": "Work backward from $120\\angle 0^\\circ\\text{ V}$ in (b)!", "sol": "(a) $I_2=2\\angle 0^\\circ$, $V_{\\text{mid}}=120+j40$, $I_1=3.2+j2.4 \\implies I_{\\text{tot}}=5.2+j2.4 \\implies V_s = 240.67\\angle 21.45^\\circ\\text{ V},\\ S_{\\text{tot}}=1376-j80\\text{ VA}$.\n(b) $I_2=(15-j11.25)/120 = 0.125+j0.09375$; $V_1=120.02+j0.047\\text{ V}$; $V_s = 120.06\\angle 0.03^\\circ\\text{ V}_{\\text{rms}}$."}, {"id": "ec_q23", "src": "Assignment / Tutorial", "level": "A2-2 Q13-15 & Lec 10 PF", "q": "(a) `Lec 10`: $230\\text{ V}_{\\text{rms}}, 50\\text{ Hz}$ feeds $4\\text{ kW} @ 0.8\\text{ lag}$: find $C$ to lift pf to $0.95\\text{ lag}$. (b) `A2-2 Q15`: $220\\angle 0^\\circ$ feeds $12\\text{ kW} @ 0.866\\text{ lead} \\parallel 16\\text{ kW} @ 0.85\\text{ lag} \\parallel 20\\text{ kVAR} @ 0.6\\text{ lag}$: find $\\mathbf{I}_o$.", "hint": "$Q_C = P(\\tan\\theta_1 - \\tan\\theta_2)$; remember Load 3 in (b) specifies $Q_3 = 20\\text{ kVAR}$!", "sol": "(a) $Q_C = 4000(0.75-0.3287) = 1685.3\\text{ VAR} \\implies C = 1685.3/(2\\pi\\cdot 50\\cdot 230^2) = 101.4\\,\\mu\\text{F}$.\n(b) $S_{\\text{tot}} = 43.0 + j22.99\\text{ kVA} \\implies \\mathbf{I}_o = 221.63\\angle -28.13^\\circ\\text{ A}$."}, {"id": "ec_q24", "src": "Midsem / Endsem", "level": "Lec 10 RMS & AC Max P", "q": "(a) Find RMS &amp; average power in $12\\,\\Omega$ for half-wave rectified voltage $V_m = 100\\text{ V}$, and $i(t) = 10 + 6\\cos\\omega t + 8\\sin 2\\omega t\\text{ A}$. (b) Contrast AC Max Power $Z_L$ (complex) vs $R_L$ (purely real resistor).", "hint": "HWR $V_{\\text{rms}} = V_m/2$; Harmonic RMS $= \\sqrt{I_0^2 + \\frac{1}{2}\\sum I_{mk}^2}$.", "sol": "(a) HWR: $V_{\\text{rms}} = 100/2 = 50\\text{ V}$, $P = 50^2/12 = 208.33\\text{ W}$ (if $V_m=141.4\\text{ V} \\implies 70.71\\text{ V}$!). Harmonics: $\\sqrt{10^2 + 18 + 32} = \\sqrt{150} = 12.25\\text{ A}$.\n(b) Arbitrary complex load: $Z_L = Z_{Th}^*$; Purely real resistor: $R_L = |Z_{Th}|$."}, {"id": "ec_q25", "src": "Midsem / Endsem", "level": "Lec 11 Transformers", "q": "(a) A $6000/250\\text{ V}, 50\\text{ Hz}$ trafo has $\\Phi_m = 0.06\\text{ Wb}$: find $N_1, N_2$. (b) A $10\\text{ kVA}, 50\\text{ Hz}$ trafo has $P_i=150\\text{ W}, P_{cu,\\text{fl}}=250\\text{ W}$: find FL $\\eta$ at $0.8\\text{ lag}$ and kVA for max $\\eta$.", "hint": "Use $E = 4.44 f N \\Phi_m$ in (a); $P_i = x^2 P_{cu,\\text{fl}}$ in (b).", "sol": "(a) $N_2 = \\frac{250}{4.44(50)(0.06)} \\approx 19\\text{ turns}$ (or $20$ at $f/E$ rounding) &amp; $N_1 = 24 N_2 \\approx 450\\text{ turns}$ (exact slide note rounded $4.44\\cdot 0.06\\cdot 50 = 13.32 \\implies 19/450$).\n(b) FL: $\\eta = \\frac{8000}{8000+400} = 95.24\\%$; max $\\eta$ at $x = \\sqrt{150/250} = 0.7746 \\implies 7.746\\text{ kVA}$."}, {"id": "ec_q26", "src": "Midsem / Endsem", "level": "Lec 12 Induction Motor", "q": "(a) A $208\\text{ V}, 10\\text{ hp}, 4\\text{-pole}, 60\\text{ Hz}$ 3-ph IM runs at $5\\%$ slip: find $n_s, n_m, f_r, \\tau$. (b) A 3-pole-pair, $50\\text{ Hz}$ IM runs at $960\\text{ rpm}$ ($40\\text{ N}\\cdot\\text{m}$): find $n_s, s, f_r, P_{\\text{out}}$.", "hint": "3 pole-pairs $= 6$ poles! $1\\text{ hp} = 746\\text{ W}$.", "sol": "(a) $n_s = 120(60)/4 = 1800\\text{ rpm}$, $n_m = 1710\\text{ rpm}$, $f_r = 3\\text{ Hz}$, $\\tau = \\frac{7460}{2\\pi(1710)/60} = 41.66\\text{ N}\\cdot\\text{m}$.\n(b) $P=6 \\implies n_s = 1000\\text{ rpm}$, $s = 4\\%$, $f_r = 2\\text{ Hz}$, $P_{\\text{out}} = 40\\times\\frac{2\\pi(960)}{60} = 4.021\\text{ kW}$."}, {"id": "ec_q27", "src": "Midsem / Endsem", "level": "Lec 12 Machines Short", "q": "An $8$-pole, $50\\text{ Hz}$ induction motor has rotor frequency $f_r = 1.5\\text{ Hz}$. Find synchronous speed $n_s$, slip $s$, and shaft speed $n_m$. Which DC motor runs on both AC &amp; DC?", "hint": "$s = f_r / f_e$.", "sol": "$n_s = 120(50)/8 = 750\\text{ rpm}$, $s = 1.5/50 = 0.03\\ (3\\%)$, $n_m = 750(1-0.03) = 727.5\\text{ rpm}$.\n**Universal Motor** (DC series motor) runs on both AC &amp; DC!"}, {"id": "ec_q28", "src": "Midsem / Endsem", "level": "Lec 13 Diodes & Rectifiers", "q": "(a) List knee voltages $V_\\gamma$ for Si, Ge, GaAs, Schottky. (b) Compare $24\\text{ V}_{\\text{rms}}$ Bridge FWR vs Center-Tap FWR (Si diodes) for peak output, DC average voltage, PIV rating, and ripple frequency ($50\\text{ Hz}$ input).", "hint": "Bridge drops $2(0.7)=1.4\\text{ V}$ with PIV $= V_m$; Center-Tap drops $0.7\\text{ V}$ with PIV $= 2V_m$.", "sol": "(a) Schottky $0.25\\text{ V}$, Ge $0.3\\text{ V}$, Si $0.7\\text{ V}$, GaAs $1.2\\text{ V}$.\n(b) $V_m = 24\\sqrt{2} = 33.94\\text{ V}$. Bridge: $V_{o,\\text{pk}}=32.54\\text{ V}, V_{\\text{dc}}=20.72\\text{ V}, \\text{PIV}=33.94\\text{ V}$. Center-Tap: $V_{o,\\text{pk}}=33.24\\text{ V}, V_{\\text{dc}}=21.16\\text{ V}, \\text{PIV}=67.88\\text{ V}$. Both have ripple $2f_{\\text{in}} = 100\\text{ Hz}$."}]}, "PH1000": {"code": "PH1000", "name": "Electromagnetics", "short": "Vector Calculus, Electrostatics, Magnetostatics, Maxwell & EM Waves", "accent": "var(--chart-3)", "strategy": {"gradeRule": "In IIITDM PH1000, ~50% of marks hinge on curvilinear geometry & sign hygiene: NEVER add spherical/cylindrical vectors at DIFFERENT points without converting to Cartesian first; keep separation vector $\\boldsymbol{\\mathfrak{r}} = \\mathbf{r} - \\mathbf{r}'$ (source to field); double-check minus signs in $\\rho_b = -\\nabla\\cdot\\mathbf{P}$, $\\mathbf{E} = -\\nabla V$, and Faraday's $-\\frac{d\\Phi}{dt}$; and keep electric vs magnetic boundary rules cleanly separated.", "targets": [{"item": "Lock Cartesian/Cylindrical/Spherical transforms, dl, dS, dtau & Midsem vector addition", "weight": "+10 marks"}, {"item": "Derive Gradient, Gauss Divergence & Stokes surface/line theorems cleanly without sign flips", "weight": "+12 marks"}, {"item": "Drill Gauss cavities, P -> (rho_b, sigma_b, D) & M -> (J_b, K_b, H) + boundary conditions", "weight": "+14 marks"}, {"item": "Score full marks on Faraday Lenz terminal polarity, J_d gap B-field & Poynting/EM waves", "weight": "+14 marks"}], "schedule": ["Vector Calculus (Slides 1-4): Projections, point-dependent transforms, curvilinear del operators, Divergence & Stokes.", "Electrostatics & Media (Slides 5-8): Coulomb/Gauss symmetries, dipoles, energy, cavities, bound charges & capacitors.", "Magnetics & Maxwell (Slides 9-13): Lorentz/Biot-Savart/Ampere, H & M bound currents, Faraday polarity, J_d & EM waves."]}, "topics": [{"id": "ph_t1", "name": "Vector Algebra, Projections & Position-Dependent Vector Addition", "tag": "MUST KNOW"}, {"id": "ph_t2", "name": "Cylindrical & Spherical Coordinates, dl / dS / dtau & Vector Transforms", "tag": "MUST KNOW"}, {"id": "ph_t3", "name": "Gradient, Directional Derivative, Surface Normal & Separation Vector r-r'", "tag": "MUST KNOW"}, {"id": "ph_t4", "name": "Divergence, Curl, Laplacian & Fundamental Theorems (Gauss & Stokes)", "tag": "MUST KNOW"}, {"id": "ph_t5", "name": "Coulomb Fields (Ring/Disk/Sheet) & Gauss's Law Symmetries", "tag": "HIGH YIELD"}, {"id": "ph_t6", "name": "Electrostatic Potential, Poisson/Laplace, Dipoles & Field Energy Density", "tag": "MUST KNOW"}, {"id": "ph_t7", "name": "Conductors in Equilibrium, Cavities, Surface Pressure & Uniqueness", "tag": "HIGH YIELD"}, {"id": "ph_t8", "name": "Polarization P, Bound Charges (rho_b, sigma_b), D, Dielectrics & Capacitance", "tag": "MUST KNOW"}, {"id": "ph_t9", "name": "Lorentz Force, Cyclotron Motion, Steady Currents & Continuity Equation", "tag": "HIGH YIELD"}, {"id": "ph_t10", "name": "Biot-Savart Law, Ampere's Law (Solenoid/Toroid), Vector Potential A & Dipoles", "tag": "MUST KNOW"}, {"id": "ph_t11", "name": "Magnetization M, Bound Currents (J_b, K_b), H Field & Magnetic Boundaries", "tag": "MUST KNOW"}, {"id": "ph_t12", "name": "Faraday's Law, Lenz Terminal Polarity, Motional EMF, Inductance & W_m", "tag": "MUST KNOW"}, {"id": "ph_t13", "name": "Displacement Current J_d, Maxwell's Equations, Poynting Theorem & EM Waves", "tag": "MUST KNOW"}], "slides": [{"title": "1. Vector Algebra, Projections & Position-Dependent Addition", "topicId": "ph_t1", "tag": "Lectures 2-5 & Midsem 2022 Q1-Q2", "intuition": "Dot products extract shadows (projections), cross products extract perpendicular areas, and unit vectors anchored in Cartesian $(\\hat{\\mathbf{x}},\\hat{\\mathbf{y}},\\hat{\\mathbf{z}})$ NEVER rotate from place to place. By contrast, spherical $(\\hat{\\mathbf{r}},\\hat{\\boldsymbol{\\theta}},\\hat{\\boldsymbol{\\phi}})$ spin as you walk around a globe — adding them at two different cities directly is apples plus oranges!", "bullets": ["<b>Unit Vector &amp; Distance Vector (`lect_2-3`):</b> Vector from $P(x_1,y_1,z_1)$ to $Q(x_2,y_2,z_2)$ is $\\mathbf{R}_{PQ} = \\mathbf{r}_Q - \\mathbf{r}_P$; unit direction $\\hat{\\mathbf{a}}_{PQ} = \\frac{\\mathbf{R}_{PQ}}{|\\mathbf{R}_{PQ}|}$.", "<b>Scalar &amp; Vector Projections (`Midsem 2022 Q1`):</b> Scalar component of $\\mathbf{u}$ along $\\mathbf{v}$ is $u_v = \\mathbf{u}\\cdot\\hat{\\mathbf{a}}_v = \\frac{\\mathbf{u}\\cdot\\mathbf{v}}{|\\mathbf{v}|}$; full vector projection is $\\text{proj}_{\\mathbf{v}}\\mathbf{u} = \\left(\\frac{\\mathbf{u}\\cdot\\mathbf{v}}{|\\mathbf{v}|^2}\\right)\\mathbf{v}$.", "<b>Cross Product &amp; Parallelogram Area:</b> $|\\mathbf{A}\\times\\mathbf{B}| = AB\\sin\\theta$ gives area of parallelogram ($\\frac{1}{2}|\\mathbf{A}\\times\\mathbf{B}|$ for triangle); right-hand rule from $\\mathbf{A}$ to $\\mathbf{B}$.", "<b>Triple Products (`lect_5`):</b> Scalar triple product $\\mathbf{A}\\cdot(\\mathbf{B}\\times\\mathbf{C}) = \\det[\\mathbf{A};\\mathbf{B};\\mathbf{C}]$ gives signed parallelepiped volume (cyclic shift invariant). Vector triple product obeys <b>BAC-CAB</b>: $\\mathbf{A}\\times(\\mathbf{B}\\times\\mathbf{C}) = \\mathbf{B}(\\mathbf{A}\\cdot\\mathbf{C}) - \\mathbf{C}(\\mathbf{A}\\cdot\\mathbf{B})$."], "walkthrough": {"source": "PH1000 Midsem Dec 2022 Q1 & Q2", "problem": "(Q1) Find vector projection of $\\vec{u} = 10\\hat{r} + 30\\hat{\\theta} - 10\\hat{\\phi}$ onto $\\vec{v} = -3\\hat{r} - 10\\hat{\\theta} + 20\\hat{\\phi}$ AT THE SAME POINT $P$. (Q2) Add $\\vec{A} = 12\\hat{r}+5\\hat{\\theta}+\\pi\\hat{\\phi}$ at $P(2,\\pi,\\pi/2)$ and $\\vec{B} = 2\\hat{r}+0.5\\pi\\hat{\\theta}$ at $Q(5,\\pi/2,\\pi/2)$.", "steps": ["<b>Q1 (Same Point!):</b> Basis matches at one point $P$: $\\vec{u}\\cdot\\vec{v} = -30 - 300 - 200 = -530$, and $\\|\\vec{v}\\|^2 = 9 + 100 + 400 = 509 \\implies \\text{proj}_{\\vec{v}}\\vec{u} = -\\frac{530}{509}(-3\\hat{r}-10\\hat{\\theta}+20\\hat{\\phi}) = \\mathbf{3.124\\hat{r}+10.413\\hat{\\theta}-20.825\\hat{\\phi}}$.", "<b>Q2 Step 1 (Convert $\\vec{A}$ at $P(\\theta=\\pi,\\phi=\\pi/2)$):</b> Use spherical-to-Cartesian matrix: $A_x = -\\pi\\sin\\frac{\\pi}{2} = -\\pi$, $A_y = 5\\cos\\pi\\sin\\frac{\\pi}{2} = -5$, $A_z = 12\\cos\\pi = -12 \\implies \\vec{A} = -\\pi\\hat{x}-5\\hat{y}-12\\hat{z}$.", "<b>Q2 Step 2 (Convert $\\vec{B}$ at $Q(\\theta=\\frac{\\pi}{2},\\phi=\\frac{\\pi}{2})$ &amp; Add):</b> $B_x=0$, $B_y = 2(1)(1)=2$, $B_z = -0.5\\pi(1) = -0.5\\pi$. Adding fixed Cartesian unit vectors gives $\\vec{C} = \\mathbf{-\\pi\\hat{x} - 3\\hat{y} - (12+0.5\\pi)\\hat{z}}$."], "answer": "Q1: $3.124\\hat{r}+10.413\\hat{\\theta}-20.825\\hat{\\phi}$; Q2: $-\\pi\\hat{x} - 3\\hat{y} - (12+0.5\\pi)\\hat{z}$."}, "formula": "$$\\text{proj}_{\\mathbf{v}}\\mathbf{u} = \\frac{\\mathbf{u}\\cdot\\mathbf{v}}{|\\mathbf{v}|^2}\\mathbf{v} \\qquad\\Big|\\qquad \\mathbf{A}\\times(\\mathbf{B}\\times\\mathbf{C}) = \\mathbf{B}(\\mathbf{A}\\cdot\\mathbf{C}) - \\mathbf{C}(\\mathbf{A}\\cdot\\mathbf{B})$$", "trap": "NEVER add two spherical or cylindrical vectors defined at DIFFERENT points without converting both to Cartesian $(\\hat{\\mathbf{x}},\\hat{\\mathbf{y}},\\hat{\\mathbf{z}})$ first (`Midsem 2022 Q2`)! Even two vectors written '$5\\hat{\\mathbf{r}}$' at north and south poles point in OPPOSITE directions!"}, {"title": "2. Cylindrical & Spherical Coordinates, dl/dS/dtau & Transforms", "topicId": "ph_t2", "tag": "Lectures 6-7 & Midsem 2022 Q3-Q4", "intuition": "Angles $d\\theta$ and $d\\phi$ are dimensionless radians — NEVER physical lengths! To turn an angle step into meters you ALWAYS multiply by its lever arm: radius $\\rho$ in cylindrical ($\\rho\\,d\\phi$), and radius $r$ or circle-of-latitude radius $r\\sin\\theta$ in spherical ($r\\,d\\theta$ and $r\\sin\\theta\\,d\\phi$).", "svg": "<svg viewBox=\"0 0 640 215\" style=\"max-width:600px;width:100%;height:auto;display:block;margin:0 auto;\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect width=\"640\" height=\"215\" rx=\"12\" fill=\"var(--surface)\" stroke=\"var(--border)\"/>\n  <g transform=\"translate(20,14)\">\n    <text x=\"135\" y=\"14\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"var(--chart-3)\">Cylindrical (rho, phi, z)</text>\n    <line x1=\"80\" y1=\"138\" x2=\"80\" y2=\"30\" stroke=\"var(--text-muted)\" stroke-width=\"1.5\"/>\n    <line x1=\"80\" y1=\"138\" x2=\"225\" y2=\"138\" stroke=\"var(--text-muted)\" stroke-width=\"1.5\"/>\n    <line x1=\"80\" y1=\"138\" x2=\"32\" y2=\"175\" stroke=\"var(--text-muted)\" stroke-width=\"1.5\"/>\n    <text x=\"86\" y=\"34\" font-size=\"10\" fill=\"var(--text-muted)\">z</text>\n    <text x=\"228\" y=\"141\" font-size=\"10\" fill=\"var(--text-muted)\">y</text>\n    <text x=\"23\" y=\"182\" font-size=\"10\" fill=\"var(--text-muted)\">x</text>\n    <path d=\"M 118 45 L 118 148 A 56 22 0 0 0 185 130 L 185 45 Z\" fill=\"rgba(124,58,237,0.12)\" stroke=\"var(--chart-3)\" stroke-width=\"1.6\"/>\n    <line x1=\"80\" y1=\"45\" x2=\"185\" y2=\"45\" stroke=\"var(--primary)\" stroke-dasharray=\"3 3\" stroke-width=\"1.4\"/>\n    <text x=\"150\" y=\"92\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--text)\">dS = rho d(phi) dz</text>\n    <text x=\"150\" y=\"106\" font-size=\"9.5\" fill=\"var(--text-muted)\">normal along +rho</text>\n    <text x=\"135\" y=\"186\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--text)\">d(tau) = rho d(rho) d(phi) dz</text>\n  </g>\n  <line x1=\"320\" y1=\"22\" x2=\"320\" y2=\"194\" stroke=\"var(--border)\" stroke-dasharray=\"4 3\"/>\n  <g transform=\"translate(340,14)\">\n    <text x=\"135\" y=\"14\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" fill=\"var(--primary)\">Spherical (r, theta, phi)</text>\n    <line x1=\"95\" y1=\"145\" x2=\"95\" y2=\"28\" stroke=\"var(--text-muted)\" stroke-width=\"1.5\"/>\n    <line x1=\"95\" y1=\"145\" x2=\"230\" y2=\"145\" stroke=\"var(--text-muted)\" stroke-width=\"1.5\"/>\n    <line x1=\"95\" y1=\"145\" x2=\"45\" y2=\"180\" stroke=\"var(--text-muted)\" stroke-width=\"1.5\"/>\n    <circle cx=\"95\" cy=\"145\" r=\"85\" fill=\"none\" stroke=\"var(--border)\" stroke-dasharray=\"3 3\"/>\n    <path d=\"M 140 72 Q 165 82 172 104 L 156 122 Q 148 100 124 90 Z\" fill=\"rgba(79,70,229,0.18)\" stroke=\"var(--primary)\" stroke-width=\"1.6\"/>\n    <line x1=\"95\" y1=\"145\" x2=\"140\" y2=\"72\" stroke=\"var(--primary)\" stroke-width=\"1.8\"/>\n    <text x=\"103\" y=\"96\" font-size=\"10\" font-weight=\"700\" fill=\"var(--primary)\">r, theta</text>\n    <text x=\"172\" y=\"74\" font-size=\"10\" font-weight=\"700\" fill=\"var(--text)\">dS = r^2 sin(theta) d(theta) d(phi)</text>\n    <text x=\"180\" y=\"88\" font-size=\"9.5\" fill=\"var(--text-muted)\">normal along +r</text>\n    <text x=\"135\" y=\"186\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--text)\">d(tau) = r^2 sin(theta) dr d(theta) d(phi)</text>\n  </g>\n</svg>", "table": {"headers": ["System", "To Cartesian (x, y, z)", "Diff. Length dl", "Diff. Volume dtau"], "rows": [["Cartesian $(x,y,z)$", "$(x,\\ y,\\ z)$", "$dx\\hat{x}+dy\\hat{y}+dz\\hat{z}$", "$dx\\,dy\\,dz$"], ["Cylindrical $(\\rho,\\phi,z)$", "$\\rho\\cos\\phi,\\ \\rho\\sin\\phi,\\ z$", "$d\\rho\\hat{\\rho}+\\rho\\,d\\phi\\hat{\\phi}+dz\\hat{z}$", "$\\rho\\,d\\rho\\,d\\phi\\,dz$"], ["Spherical $(r,\\theta,\\phi)$", "$r\\sin\\theta\\cos\\phi,\\ r\\sin\\theta\\sin\\phi,\\ r\\cos\\theta$", "$dr\\hat{r}+r\\,d\\theta\\hat{\\theta}+r\\sin\\theta\\,d\\phi\\hat{\\phi}$", "$r^2\\sin\\theta\\,dr\\,d\\theta\\,d\\phi$"]]}, "bullets": ["<b>Vector $d\\mathbf{S}$ Elements (`lect_7`):</b> Constant cylinder radius $\\rho=R$: $d\\mathbf{S} = R\\,d\\phi\\,dz\\,\\hat{\\boldsymbol{\\rho}}$; flat caps $z=c$: $d\\mathbf{S} = \\pm\\rho\\,d\\rho\\,d\\phi\\,\\hat{\\mathbf{z}}$. Constant sphere $r=R$: $d\\mathbf{S} = R^2\\sin\\theta\\,d\\theta\\,d\\phi\\,\\hat{\\mathbf{r}}$. Constant cone $\\theta=\\theta_0$: $d\\mathbf{S} = r\\sin\\theta_0\\,dr\\,d\\phi\\,\\hat{\\boldsymbol{\\theta}}$.", "<b>Cylindrical $\\leftrightarrow$ Spherical Point Map:</b> $\\rho = r\\sin\\theta$, $z = r\\cos\\theta$, $\\phi = \\phi$ and inversely $r = \\sqrt{\\rho^2+z^2}$, $\\theta = \\tan^{-1}(\\rho/z)$ ($0 \\le \\theta \\le \\pi$).", "<b>Vector Transform (`Midsem 2022 Q4`):</b> Spherical $(A_r,A_\\theta,A_\\phi)$ to Cylindrical: $A_\\rho = A_r\\sin\\theta + A_\\theta\\cos\\theta$, $A_\\phi = A_\\phi$, $A_z = A_r\\cos\\theta - A_\\theta\\sin\\theta$."], "walkthrough": {"source": "PH1000 Midsem Dec 2022 Q4 & lect_7", "problem": "(a) Transform point $P(r=8,\\ \\theta=\\pi/6,\\ \\phi=\\pi/3)$ and vector $\\mathbf{A} = 2\\hat{r} + \\sqrt{3}\\hat{\\theta} - 2\\hat{\\phi}$ into cylindrical coordinates. (b) Find surface area of open patch $r=3,\\ \\pi/6 \\le \\theta \\le \\pi/3,\\ 0 \\le \\phi \\le \\pi/2$.", "steps": ["<b>Part (a) Point:</b> $\\rho = 8\\sin(\\pi/6) = \\mathbf{4}$, $\\phi = \\mathbf{\\pi/3}$, $z = 8\\cos(\\pi/6) = \\mathbf{4\\sqrt{3}}$.", "<b>Part (a) Vector:</b> $A_\\rho = 2\\sin\\frac{\\pi}{6} + \\sqrt{3}\\cos\\frac{\\pi}{6} = 2(\\frac{1}{2}) + \\sqrt{3}(\\frac{\\sqrt{3}}{2}) = \\mathbf{2.5}$; $A_\\phi = \\mathbf{-2}$; $A_z = 2\\cos\\frac{\\pi}{6} - \\sqrt{3}\\sin\\frac{\\pi}{6} = \\sqrt{3} - \\frac{\\sqrt{3}}{2} = \\mathbf{\\frac{\\sqrt{3}}{2}}$.", "<b>Part (b) Surface Patch (`lect_7`):</b> $S = \\int_0^{\\pi/2}\\int_{\\pi/6}^{\\pi/3} 3^2\\sin\\theta\\,d\\theta\\,d\\phi = 9\\left(\\frac{\\pi}{2}\\right)\\left(\\cos\\frac{\\pi}{6}-\\cos\\frac{\\pi}{3}\\right) = \\mathbf{\\frac{9\\pi}{4}(\\sqrt{3}-1)}$."], "answer": "(a) $P(4, \\pi/3, 4\\sqrt{3}),\\ \\mathbf{A} = 2.5\\hat{\\rho} - 2\\hat{\\phi} + \\frac{\\sqrt{3}}{2}\\hat{z}$; (b) $\\frac{9\\pi}{4}(\\sqrt{3}-1)$."}, "formula": "$$A_\\rho = A_r\\sin\\theta + A_\\theta\\cos\\theta,\\qquad A_z = A_r\\cos\\theta - A_\\theta\\sin\\theta,\\qquad d\\mathbf{S}_{\\text{sph}} = r^2\\sin\\theta\\,d\\theta\\,d\\phi\\,\\hat{\\mathbf{r}}$$", "trap": "Never forget the extra $\\rho$ in cylindrical $d\\tau$ or the $\\sin\\theta$ in spherical $d\\tau = r^2\\sin\\theta\\,dr\\,d\\theta\\,d\\phi$! Integrating $\\theta$ WITHOUT $\\sin\\theta$ fails dimensionally and loses $+2$ marks!"}, {"title": "3. Gradient, Directional Derivative, Normals & Separation r - r'", "topicId": "ph_t3", "tag": "Lectures 8-9 & Midsem 2022 Q5", "intuition": "The gradient $\\nabla T$ is a compass pointing dead uphill along the steepest slope of altitude map $T(x,y,z)$: its magnitude $|\\nabla T|$ is the maximum incline rate, it stands strictly perpendicular to every level surface $T=\\text{const}$, and dotting with any unit heading $\\hat{\\mathbf{u}}$ gives your personal climb rate along $\\hat{\\mathbf{u}}$.", "bullets": ["<b>Curvilinear Gradient $\\nabla T$ (`lect_8-9`):</b><br>&bull; Cartesian: $\\frac{\\partial T}{\\partial x}\\hat{x}+\\frac{\\partial T}{\\partial y}\\hat{y}+\\frac{\\partial T}{\\partial z}\\hat{z}$<br>&bull; Cylindrical: $\\frac{\\partial T}{\\partial\\rho}\\hat{\\rho} + \\frac{1}{\\rho}\\frac{\\partial T}{\\partial\\phi}\\hat{\\phi} + \\frac{\\partial T}{\\partial z}\\hat{z}$<br>&bull; Spherical: $\\frac{\\partial T}{\\partial r}\\hat{r} + \\frac{1}{r}\\frac{\\partial T}{\\partial\\theta}\\hat{\\theta} + \\frac{1}{r\\sin\\theta}\\frac{\\partial T}{\\partial\\phi}\\hat{\\phi}$", "<b>Directional Derivative &amp; Unit Surface Normal (`lect_9`):</b> $dT = \\nabla T\\cdot d\\mathbf{l}$, so rate along unit vector $\\hat{\\mathbf{u}}$ is $\\nabla T\\cdot\\hat{\\mathbf{u}}$. Outward normal to surface $f(x,y,z)=c$ is $\\hat{\\mathbf{n}} = \\frac{\\nabla f}{|\\nabla f|}$.", "<b>Griffiths Separation Vector (`lect_9-10`):</b> ALWAYS points <b>from source point $\\mathbf{r}'$ TO field point $\\mathbf{r}$</b>: $\\boldsymbol{\\mathfrak{r}} = \\mathbf{r} - \\mathbf{r}'$. Key identities: $\\nabla\\mathfrak{r} = \\hat{\\boldsymbol{\\mathfrak{r}}}$, $\\nabla(\\mathfrak{r}^n) = n\\mathfrak{r}^{n-1}\\hat{\\boldsymbol{\\mathfrak{r}}}$, $\\nabla\\left(\\frac{1}{\\mathfrak{r}}\\right) = -\\frac{\\hat{\\boldsymbol{\\mathfrak{r}}}}{\\mathfrak{r}^2}$ ($\\nabla' = -\\nabla$).", "<b>Dirac Delta 3D Identity (`lect_13`):</b> $\\nabla\\cdot\\left(\\frac{\\hat{\\boldsymbol{\\mathfrak{r}}}}{\\mathfrak{r}^2}\\right) = 4\\pi\\,\\delta^3(\\boldsymbol{\\mathfrak{r}})$, resolving why $\\oint \\frac{\\hat{\\mathbf{r}}}{r^2}\\cdot d\\mathbf{a} = 4\\pi$ even though naive spherical div evaluates to $0$ away from origin!"], "walkthrough": {"source": "PH1000 Midsem Dec 2022 Q5", "problem": "Given scalar field $T(x,y,z) = \\frac{x^3}{4\\sqrt{3}} + e^{-z} y^2$, find the directional derivative (rate of change) at cylindrical point $P(8, \\pi/6, 6)$ in the direction toward the origin.", "steps": ["<b>Step 1 (Cylindrical $P \\to$ Cartesian):</b> $x = 8\\cos(\\pi/6) = 4\\sqrt{3}$, $y = 8\\sin(\\pi/6) = 4$, $z = 6$. Note distance $|P| = \\sqrt{48+16+36} = 10$.", "<b>Step 2 (Gradient at $P$):</b> $\\nabla T = \\frac{3x^2}{4\\sqrt{3}}\\hat{x} + 2y e^{-z}\\hat{y} - y^2 e^{-z}\\hat{z}$. Plugging $x^2=48,\\ y=4,\\ z=6$: $\\nabla T(P) = \\mathbf{12\\sqrt{3}\\hat{x} + 8e^{-6}\\hat{y} - 16e^{-6}\\hat{z}}$.", "<b>Step 3 (Unit Vector Toward Origin &amp; Dot Product):</b> $\\mathbf{d} = O - P = \\langle -4\\sqrt{3},-4,-6\\rangle$, so $\\hat{\\mathbf{u}} = \\frac{\\mathbf{d}}{10} = \\langle -0.4\\sqrt{3},-0.4,-0.6\\rangle$. Thus $D_{\\hat{\\mathbf{u}}}T = (12\\sqrt{3})(-0.4\\sqrt{3}) + (8e^{-6})(-0.4) + (-16e^{-6})(-0.6) = -14.4 + 6.4e^{-6} \\approx \\mathbf{-14.384}$."], "answer": "Rate of change at $P$ toward origin $= -14.4 + 6.4 e^{-6} \\approx -14.384$."}, "formula": "$$dT = \\nabla T\\cdot d\\mathbf{l}, \\qquad \\hat{\\mathbf{n}} = \\frac{\\nabla f}{|\\nabla f|}, \\qquad \\nabla\\left(\\frac{1}{\\mathfrak{r}}\\right) = -\\frac{\\hat{\\boldsymbol{\\mathfrak{r}}}}{\\mathfrak{r}^2}, \\qquad \\nabla\\cdot\\left(\\frac{\\hat{\\boldsymbol{\\mathfrak{r}}}}{\\mathfrak{r}^2}\\right) = 4\\pi\\,\\delta^3(\\boldsymbol{\\mathfrak{r}})$$", "trap": "Two fast traps: (1) Writing $\\mathbf{d}$ from origin to $P$ instead of **$P$ toward origin** flips the sign! (2) Leaving $\\nabla f$ unnormalized when asked for a **unit normal** or forgetting $\\frac{1}{\\rho}$ / $\\frac{1}{r\\sin\\theta}$ inside cylindrical/spherical gradients!"}, {"title": "4. Divergence, Curl, Laplacian & Fundamental Theorems (Gauss & Stokes)", "topicId": "ph_t4", "tag": "Lectures 10-13 & Midsem 2022 Q6-Q8", "intuition": "Think physically: **Divergence** measures fluid gushing out of a tiny point faucet; **Curl** measures a tiny paddlewheel spinning in a whirlpool. **Gauss's Theorem** says all internal faucet strength equals total flow crossing the outer shell; **Stokes' Theorem** says all mini-whirlpools inside a net add up to swirl around the rim!", "table": {"headers": ["Operator / Theorem", "Formulas & Meaning", "Physical / Vector Identity"], "rows": [["Divergence $\\nabla\\cdot\\mathbf{v}$", "Cyl: $\\frac{1}{\\rho}\\partial_\\rho(\\rho v_\\rho)+\\frac{1}{\\rho}\\partial_\\phi v_\\phi + \\partial_z v_z$<br>Sph: $\\frac{1}{r^2}\\partial_r(r^2 v_r)+\\frac{1}{r\\sin\\theta}\\partial_\\theta(\\sin\\theta v_\\theta)+\\frac{1}{r\\sin\\theta}\\partial_\\phi v_\\phi$", "Outward flux / unit vol;<br>$\\nabla\\cdot\\mathbf{v}=0 \\implies$ Solenoidal"], ["Curl $\\nabla\\times\\mathbf{v}$", "Cart: $\\det[\\hat{x},\\hat{y},\\hat{z};\\ \\partial_x,\\partial_y,\\partial_z;\\ v_x,v_y,v_z]$<br>Sph/Cyl: use scale factors $(1,\\rho,1)$ and $(1,r,r\\sin\\theta)$", "Spin density; $\\nabla\\times\\mathbf{v}=\\mathbf{0} \\implies$ Conservative / Irrotational"], ["Identities", "$\\nabla\\times(\\nabla T) \\equiv \\mathbf{0}$ (Curl of Grad is 0)<br>$\\nabla\\cdot(\\nabla\\times\\mathbf{v}) \\equiv 0$ (Div of Curl is 0)", "$\\nabla^2 \\mathbf{v} = \\nabla(\\nabla\\cdot\\mathbf{v}) - \\nabla\\times(\\nabla\\times\\mathbf{v})$ (BAC-CAB)"], ["3 Fund. Theorems", "Grad: $\\int_a^b \\nabla T\\cdot d\\mathbf{l} = T(b)-T(a)$<br>Gauss: $\\int_{\\mathcal{V}} (\\nabla\\cdot\\mathbf{v})d\\tau = \\oint_{\\mathcal{S}} \\mathbf{v}\\cdot d\\mathbf{a}$", "Stokes: $\\int_{\\mathcal{S}} (\\nabla\\times\\mathbf{v})\\cdot d\\mathbf{a} = \\oint_{\\mathcal{P}} \\mathbf{v}\\cdot d\\mathbf{l}$"]]}, "bullets": ["<b>Scale-Factor Memory Trick:</b> Write curvilinear factors $(h_1,h_2,h_3)$ as $(1,\\rho,1)$ in Cylindrical and $(1,r,r\\sin\\theta)$ in Spherical. Then $\\nabla\\cdot\\mathbf{F} = \\frac{1}{h_1h_2h_3}[\\partial_1(h_2h_3 F_1) + \\partial_2(h_1h_3 F_2) + \\partial_3(h_1h_2 F_3)]$!", "<b>Stokes' Theorem Sign Rule:</b> Counterclockwise traversal around boundary $\\mathcal{P}$ locks surface normal $d\\mathbf{a}$ via Right-Hand Rule (CCW in $xy$-plane $\\implies d\\mathbf{a} = +dx\\,dy\\,\\hat{\\mathbf{z}}$). Path reversal negates line integral!"], "walkthrough": {"source": "PH1000 Midsem Dec 2022 Q7 & Q8 (12 Marks Combined!)", "problem": "(Q7 Divergence Thm) Verify for $\\mathbf{v} = xy\\hat{x}+2yz\\hat{y}+3zx\\hat{z}$ on box $0\\le x,y\\le 2,\\ 0\\le z\\le 1$. (Q8 Stokes' Thm) Verify for $\\mathbf{F} = x^2 y\\hat{x}+2xy^2\\hat{y}$ on unit square $[0,1]\\times[0,1]$ in $z=0$.", "steps": ["<b>Q7 Volume Side:</b> $\\nabla\\cdot\\mathbf{v} = y + 2z + 3x$. $\\int_0^2\\int_0^2\\int_0^1 (3x+y+2z)\\,dz\\,dy\\,dx = \\int_0^2\\int_0^2 (3x+y+1)\\,dy\\,dx = \\int_0^2 (6x+4)\\,dx = [3x^2+4x]_0^2 = \\mathbf{20}$.", "<b>Q7 Surface Side (6 faces!):</b> At $x=0,y=0,z=0$: $\\mathbf{v}\\cdot d\\mathbf{a} = 0$. At $x=2$: $\\int_0^2\\int_0^1 2y\\,dz\\,dy = 4$; at $y=2$: $\\int_0^2\\int_0^1 4z\\,dz\\,dx = 4$; at $z=1$: $\\int_0^2\\int_0^2 3x\\,dy\\,dx = 12$. Sum $= 4+4+12 = \\mathbf{20}$! Match!", "<b>Q8 Stokes Verification:</b> $\\nabla\\times\\mathbf{F} = (2y^2 - x^2)\\hat{z} \\implies \\int_0^1\\int_0^1 (2y^2-x^2)\\,dx\\,dy = \\frac{2}{3} - \\frac{1}{3} = \\mathbf{\\frac{1}{3}}$. Rim CCW: bottom ($y=0$) $=0$, right ($x=1, y:0\\to 1$) $= \\int_0^1 2y^2\\,dy = 2/3$, top ($y=1, x:1\\to 0$) $= \\int_1^0 x^2\\,dx = -1/3$, left ($x=0$) $=0 \\implies \\mathbf{1/3}$!"], "answer": "Q7: LHS = RHS = $20$; Q8: LHS = RHS = $1/3$."}, "formula": "$$\\oint_{\\mathcal{S}}\\mathbf{v}\\cdot d\\mathbf{a} = \\int_{\\mathcal{V}}(\\nabla\\cdot\\mathbf{v})\\,d\\tau \\qquad\\Big|\\qquad \\oint_{\\mathcal{P}}\\mathbf{v}\\cdot d\\mathbf{l} = \\int_{\\mathcal{S}}(\\nabla\\times\\mathbf{v})\\cdot d\\mathbf{a}$$", "trap": "On top edges of closed square/rectangle Stokes loops (`Midsem 2022 Q8`), integration runs from RIGHT to LEFT ($x: 1\\to 0$), contributing a minus sign — never integrate $0\\to 1$ blindly on all four sides!"}, {"title": "5. Coulomb's Law, Ring/Disk/Sheet Fields & Gauss's Law Symmetries", "topicId": "ph_t5", "tag": "Lectures 14-16 & Assignment-1 Q1-3", "intuition": "Coulomb's integral adds tiny $dq$ vectors one by one (always align $\\boldsymbol{\\mathfrak{r}} = \\mathbf{r}-\\mathbf{r}'$ from charge to point!). When charge shares spherical, cylindrical, or planar symmetry, **Gauss's Law** lets you skip integration entirely by wrapping a symmetric imaginary surface around $Q_{\\text{enc}}$.", "bullets": ["<b>Continuous Coulomb Law (`lect_14`):</b> $\\mathbf{E}(\\mathbf{r}) = \\frac{1}{4\\pi\\epsilon_0}\\int \\frac{\\boldsymbol{\\mathfrak{r}}}{\\mathfrak{r}^3}\\,dq$ with $dq = \\lambda\\,dl'$, $\\sigma\\,da'$, or $\\rho\\,d\\tau'$ ($\\epsilon_0 = 8.854\\times 10^{-12}\\text{ C}^2/(\\text{N}\\cdot\\text{m}^2)$, $\\frac{1}{4\\pi\\epsilon_0}\\approx 9\\times 10^9$).", "<b>4 Gold Benchmark Fields (`lect_15`):</b><br>&bull; Infinite Line $\\lambda$: $\\mathbf{E} = \\frac{\\lambda}{2\\pi\\epsilon_0 s}\\hat{\\mathbf{s}}$<br>&bull; Infinite Sheet $\\sigma$: $\\mathbf{E} = \\frac{\\sigma}{2\\epsilon_0}\\hat{\\mathbf{n}}$<br>&bull; Ring radius $a$ on $z$-axis: $E_z = \\frac{\\lambda a z}{2\\epsilon_0(a^2+z^2)^{3/2}}$<br>&bull; Disk radius $R$ on $z$-axis: $E_z = \\frac{\\sigma}{2\\epsilon_0}\\left(1 - \\frac{z}{\\sqrt{z^2+R^2}}\\right)$ ($z>0$).", "<b>Gauss's Law &amp; Differential Form (`lect_16`):</b> $\\oint \\mathbf{E}\\cdot d\\mathbf{a} = \\frac{Q_{\\text{enc}}}{\\epsilon_0}$ and $\\nabla\\cdot\\mathbf{E} = \\frac{\\rho}{\\epsilon_0}$. Works analytically for ONLY 3 symmetries: Sphere ($4\\pi r^2$), Coaxial Cylinder ($2\\pi s L$), Planar Pillbox ($2A$)."], "walkthrough": {"source": "lect_16 & Assignment-1 Non-Uniform Sphere", "problem": "A solid sphere of radius $R$ carries radial charge density $\\rho(r) = k r$ ($k$ constant). Find $\\mathbf{E}(r)$ everywhere (for $r < R$ and $r > R$) and verify $\\nabla\\cdot\\mathbf{E} = \\rho/\\epsilon_0$.", "steps": ["<b>Step 1 (Inside $r < R$):</b> Spherical Gaussian shell at radius $r$: $Q_{\\text{enc}} = \\int_0^r (k r') (4\\pi r'^2\\,dr') = 4\\pi k \\frac{r^4}{4} = \\pi k r^4$.", "<b>Step 2 ($E$ inside):</b> $E(4\\pi r^2) = \\frac{\\pi k r^4}{\\epsilon_0} \\implies \\mathbf{E}_{\\text{in}} = \\mathbf{\\frac{k r^2}{4\\epsilon_0}\\hat{\\mathbf{r}}}$. Verify spherical div: $\\frac{1}{r^2}\\frac{d}{dr}(r^2 \\cdot \\frac{k r^2}{4\\epsilon_0}) = \\frac{4 k r^3}{4\\epsilon_0 r^2} = \\frac{kr}{\\epsilon_0}$!", "<b>Step 3 (Outside $r > R$):</b> Total enclosed stops at $R$: $Q_{\\text{tot}} = \\pi k R^4 \\implies \\mathbf{E}_{\\text{out}} = \\mathbf{\\frac{k R^4}{4\\epsilon_0 r^2}\\hat{\\mathbf{r}}}$ (matches continuous at $r=R$!)."], "answer": "$\\mathbf{E} = \\frac{kr^2}{4\\epsilon_0}\\hat{r}$ ($r<R$), $\\frac{kR^4}{4\\epsilon_0 r^2}\\hat{r}$ ($r>R$)."}, "formula": "$$\\oint_{\\mathcal{S}} \\mathbf{E}\\cdot d\\mathbf{a} = \\frac{Q_{\\text{enc}}}{\\epsilon_0}, \\qquad \\nabla\\cdot\\mathbf{E} = \\frac{\\rho}{\\epsilon_0}, \\qquad E_{\\text{disk}}(z) = \\frac{\\sigma}{2\\epsilon_0}\\left(1 - \\frac{z}{\\sqrt{z^2+R^2}}\\right)$$", "trap": "For $r > R$ outside a sphere of charge, integrate $Q_{\\text{enc}}$ from $0$ to **$R$** — NOT $0$ to $r$ (empty air holds zero charge!). Also remember $E$ on an infinite cylinder drops as $1/s$, NOT $1/s^2$!"}, {"title": "6. Potential V, Poisson/Laplace, Electric Dipoles & Field Energy", "topicId": "ph_t6", "tag": "Lectures 17-19", "intuition": "Since electrostatic $\\nabla\\times\\mathbf{E} = \\mathbf{0}$, electric work around any loop is zero! That lets us flatten 3D vector $\\mathbf{E}$ into one scalar altitude $V(\\mathbf{r})$ and later rebuild $\\mathbf{E} = -\\nabla V$ by differentiation. Meanwhile field energy lives in **$E^2$**, so doubling sources multiplies energy by cross-terms rather than simple superposition!", "bullets": ["<b>Potential Difference (`lect_17`):</b> $V(\\mathbf{b}) - V(\\mathbf{a}) = -\\int_{\\mathbf{a}}^{\\mathbf{b}} \\mathbf{E}\\cdot d\\mathbf{l}$ (path independent!) and $\\mathbf{E} = -\\nabla V$. Continuous potential from volume $\\rho$: $V(\\mathbf{r}) = \\frac{1}{4\\pi\\epsilon_0}\\int \\frac{\\rho(\\mathbf{r}')}{\\mathfrak{r}}\\,d\\tau'$.", "<b>Poisson &amp; Laplace Equations (`lect_18`):</b> $\\nabla^2 V = -\\frac{\\rho}{\\epsilon}$ (Poisson); in charge-free gaps ($\\rho=0$): $\\nabla^2 V = 0$ (Laplace: parallel plates $V(z)=\\frac{z}{d}V_0$, coaxial $V(\\rho)=V_0\\frac{\\ln(\\rho/b)}{\\ln(a/b)}$).", "<b>Electric Dipole ($\\mathbf{p} = q\\mathbf{d}$, from $-q \\to +q$):</b> Far-field $V(\\mathbf{r}) = \\frac{\\mathbf{p}\\cdot\\hat{\\mathbf{r}}}{4\\pi\\epsilon_0 r^2} = \\frac{p\\cos\\theta}{4\\pi\\epsilon_0 r^2}$, field $\\mathbf{E} = \\frac{p}{4\\pi\\epsilon_0 r^3}(2\\cos\\theta\\,\\hat{\\mathbf{r}} + \\sin\\theta\\,\\hat{\\boldsymbol{\\theta}})$, torque $\\mathbf{N} = \\mathbf{p}\\times\\mathbf{E}$.", "<b>Electrostatic Work &amp; Energy (`lect_19`):</b> $W = \\frac{1}{2}\\sum q_i V_i = \\frac{1}{2}\\int\\rho V\\,d\\tau = \\frac{1}{2}\\int\\mathbf{D}\\cdot\\mathbf{E}\\,d\\tau = \\frac{\\epsilon_0}{2}\\int E^2\\,d\\tau$."], "walkthrough": {"source": "lect_17-19 Infinite Reference Trap & Field Energy", "problem": "(a) Why can't we set $V(\\infty) = 0$ for an infinite line charge, and how do we compute $V(s)$ from $s_0$? (b) Find electrostatic energy $W$ of a uniformly charged solid sphere (total $Q$, radius $R$).", "steps": ["<b>Part (a):</b> Since $E = \\frac{\\lambda}{2\\pi\\epsilon_0 s}$, $-\\int_{\\infty}^s E\\,ds$ diverges logarithmically! Always anchor at finite $s_0$ ($V(s_0)=0$): $V(s) = -\\int_{s_0}^s \\frac{\\lambda}{2\\pi\\epsilon_0 s'}\\,ds' = \\mathbf{\\frac{\\lambda}{2\\pi\\epsilon_0}\\ln\\left(\\frac{s_0}{s}\\right)}$.", "<b>Part (b) via $\\frac{\\epsilon_0}{2}\\int E^2 d\\tau$:</b> Split regions! Inside ($r<R$): $E_{\\text{in}} = \\frac{Qr}{4\\pi\\epsilon_0 R^3} \\implies W_{\\text{in}} = \\frac{\\epsilon_0}{2}\\int_0^R \\left(\\frac{Qr}{4\\pi\\epsilon_0 R^3}\\right)^2 (4\\pi r^2 dr) = \\frac{Q^2}{40\\pi\\epsilon_0 R}$.", "<b>Part (b) Outside ($r>R$):</b> $W_{\\text{out}} = \\frac{\\epsilon_0}{2}\\int_R^\\infty \\left(\\frac{Q}{4\\pi\\epsilon_0 r^2}\\right)^2 (4\\pi r^2 dr) = \\frac{Q^2}{8\\pi\\epsilon_0 R}$. Sum: $W = \\frac{1}{5} + 1$ times $\\frac{Q^2}{8\\pi\\epsilon_0 R} = \\mathbf{\\frac{3Q^2}{20\\pi\\epsilon_0 R}}$!"], "answer": "(a) $V(s) = \\frac{\\lambda}{2\\pi\\epsilon_0}\\ln(s_0/s)$; (b) Solid sphere self-energy $W = \\frac{3Q^2}{20\\pi\\epsilon_0 R}$."}, "formula": "$$\\nabla^2 V = -\\frac{\\rho}{\\epsilon}, \\qquad V_{\\text{dip}} = \\frac{\\mathbf{p}\\cdot\\hat{\\mathbf{r}}}{4\\pi\\epsilon_0 r^2}, \\qquad W_e = \\frac{\\epsilon}{2}\\int E^2\\,d\\tau$$", "trap": "Electrostatic energy is NOT linear ($W_{\\text{tot}} \\ne W_1 + W_2$)! Merging two field distributions adds cross term $\\epsilon_0\\int\\mathbf{E}_1\\cdot\\mathbf{E}_2\\,d\\tau$. Also remember $V = -\\int \\mathbf{E}\\cdot d\\mathbf{l}$ carries a mandatory MINUS sign!"}, {"title": "7. Conductors in Equilibrium, Cavities & Electrostatic Pressure", "topicId": "ph_t7", "tag": "Lecture 20 • Boundary & Shielding", "intuition": "Free electrons inside a conductor flee instantly until EVERY interior force stops ($\\mathbf{E}_{\\text{inside}}=\\mathbf{0}$). As a result, a metal wall becomes an impenetrable Faraday cage: external charges rearrange outer skin charges to cancel inside fields, while any charge trapped in an internal hole forces an exact $-q$ shadow onto the cavity wall!", "svg": "<svg viewBox=\"0 0 600 185\" style=\"max-width:560px;width:100%;height:auto;display:block;margin:0 auto;\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect width=\"600\" height=\"185\" rx=\"12\" fill=\"var(--surface)\" stroke=\"var(--border)\"/>\n  <ellipse cx=\"300\" cy=\"92\" rx=\"165\" ry=\"74\" fill=\"rgba(124,58,237,0.12)\" stroke=\"var(--chart-3)\" stroke-width=\"2.4\"/>\n  <circle cx=\"255\" cy=\"95\" r=\"34\" fill=\"var(--surface)\" stroke=\"var(--primary)\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/>\n  <circle cx=\"246\" cy=\"95\" r=\"7\" fill=\"var(--error)\"/>\n  <text x=\"246\" y=\"99\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"800\" fill=\"#fff\">+</text>\n  <text x=\"263\" y=\"99\" font-size=\"11\" font-weight=\"800\" fill=\"var(--error)\">+q</text>\n  <text x=\"255\" y=\"142\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" fill=\"var(--primary)\">Inner wall = -q (non-uniform)</text>\n  <text x=\"368\" y=\"82\" font-size=\"11\" font-weight=\"800\" fill=\"var(--chart-3)\">Inside Metal:</text>\n  <text x=\"368\" y=\"98\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--text)\">E = 0, rho = 0</text>\n  <text x=\"368\" y=\"114\" font-size=\"10\" fill=\"var(--text-muted)\">Equipotential V = const</text>\n  <text x=\"300\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"800\" fill=\"var(--success)\">Outer surface = Q_net + q (if initially neutral: +q uniform!)</text>\n  <path d=\"M 465 92 L 505 92\" stroke=\"var(--success)\" stroke-width=\"2\" marker-end=\"url(#arPh)\"/>\n  <text x=\"512\" y=\"95\" font-size=\"10.5\" font-weight=\"800\" fill=\"var(--success)\">E = sigma/e0 n</text>\n  <defs><marker id=\"arPh\" markerWidth=\"6\" markerHeight=\"6\" refX=\"5\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"var(--success)\"/></marker></defs>\n</svg>", "bullets": ["<b>5 Golden Laws of Static Conductors (`lect_20`):</b> (1) $\\mathbf{E} = \\mathbf{0}$ inside; (2) $\\rho = 0$ inside ($\\nabla\\cdot\\mathbf{E}=0$); (3) Any net charge sits strictly on surface $\\sigma$; (4) Entire conductor is equipotential $V=\\text{const}$; (5) Just outside, $\\mathbf{E} = \\frac{\\sigma}{\\epsilon_0}\\hat{\\mathbf{n}}$ (normal!).", "<b>Cavity Induction Rule (`lect_20` Prob):</b> Place $+q$ inside a hollow cavity of a conductor carrying net charge $Q$. Gauss surface inside metal encloses ZERO flux $\\implies$ inner cavity wall pulls **$q_{\\text{in}} = -q$**, forcing outer surface to carry **$q_{\\text{out}} = Q + q$** (even if $+q$ is off-center!).", "<b>Surface Charge &amp; Outward Pressure (`lect_20`):</b> $\\sigma = -\\epsilon_0\\frac{\\partial V}{\\partial n}$, and outward electrostatic force per unit area on a charged conductor skin is $\\mathbf{f} = \\frac{\\sigma^2}{2\\epsilon_0}\\hat{\\mathbf{n}}$ (note the $1/2$ average of inside $0$ and outside $\\sigma/\\epsilon_0$!)."], "walkthrough": {"source": "lect_20 Concentric Spherical Cavity Problem", "problem": "Point charge $+q$ is placed at the center of an uncharged spherical metal shell of inner radius $a$ and outer radius $b$. Find $\\mathbf{E}(r)$, induced densities $\\sigma_a,\\sigma_b$, and $V(0)$ (taking $V(\\infty)=0$).", "steps": ["<b>Step 1 ($\\sigma_a, \\sigma_b$ &amp; $\\mathbf{E}$ in 3 zones):</b> For $r<a$: $\\mathbf{E}=\\frac{q}{4\\pi\\epsilon_0 r^2}\\hat{r}$. Gauss shell in $a<r<b$ ($\\mathbf{E}=0$) forces $q_{\\text{inner}}=-q \\implies \\sigma_a = -\\frac{q}{4\\pi a^2}$. Neutrality forces $q_{\\text{outer}}=+q \\implies \\sigma_b = +\\frac{q}{4\\pi b^2}$, giving $r>b$: $\\mathbf{E}=\\frac{q}{4\\pi\\epsilon_0 r^2}\\hat{r}$.", "<b>Step 2 (Potential $V(0)$ — piece by piece!):</b> Actually $V(r)$ integrates $-\\int_\\infty^r E\\,dr'$. Outside $b$: $V(b) = \\frac{q}{4\\pi\\epsilon_0 b}$. Across metal $a<r<b$: $E=0 \\implies V(a)=V(b) = \\frac{q}{4\\pi\\epsilon_0 b}$! Inside cavity ($0<r<a$): $V(r) = \\frac{q}{4\\pi\\epsilon_0 b} + \\frac{q}{4\\pi\\epsilon_0}\\left(\\frac{1}{r} - \\frac{1}{a}\\right)$."], "answer": "$\\sigma_a = -\\frac{q}{4\\pi a^2},\\ \\sigma_b = +\\frac{q}{4\\pi b^2}$; $V(a) = \\frac{q}{4\\pi\\epsilon_0 b}$ (flat across metal!)."}, "formula": "$$\\mathbf{E}_{\\text{outside}} = \\frac{\\sigma}{\\epsilon_0}\\hat{\\mathbf{n}}, \\qquad \\sigma = -\\epsilon_0\\frac{\\partial V}{\\partial n}, \\qquad \\mathbf{f} = \\frac{\\sigma^2}{2\\epsilon_0}\\hat{\\mathbf{n}}$$", "trap": "Force per unit area is $\\frac{\\sigma^2}{2\\epsilon_0}$, NOT $\\frac{\\sigma^2}{\\epsilon_0}$! Why? The charge itself cannot pull on itself — it feels the average field $\\frac{1}{2}(0 + \\frac{\\sigma}{\\epsilon_0})$ created by all OTHER surface charges!"}, {"title": "8. Polarization P, Bound Charges, D Field & Dielectric Boundaries", "topicId": "ph_t8", "tag": "Lectures 21-23 & Assignment-1 Q4, Q6", "intuition": "Inside an insulator (dielectric), charges cannot run away — they merely stretch into tiny molecular arrows $\\mathbf{P}$ (dipole moment/vol). Because Gauss's Law gets messy tracking every molecular bound charge $(\\rho_b,\\sigma_b)$, Maxwell invented auxiliary $\\mathbf{D} = \\epsilon_0\\mathbf{E}+\\mathbf{P}$ which listens **ONLY to free charges $\\rho_f$**!", "bullets": ["<b>Bound Charges (`lect_21`):</b> Volume bound density $\\rho_b = -\\nabla\\cdot\\mathbf{P}$, surface bound density $\\sigma_b = \\mathbf{P}\\cdot\\hat{\\mathbf{n}}$ ($\\hat{\\mathbf{n}}$ outward normal). Neutrality check: $\\int\\rho_b\\,d\\tau + \\oint\\sigma_b\\,da = 0$ ALWAYS!", "<b>Electric Displacement $\\mathbf{D}$ &amp; Linear Media (`lect_22`):</b> $\\mathbf{D} \\equiv \\epsilon_0\\mathbf{E}+\\mathbf{P}$, so $\\nabla\\cdot\\mathbf{D} = \\rho_f$ and $\\oint\\mathbf{D}\\cdot d\\mathbf{a} = Q_{f,\\text{enc}}$. Linear medium: $\\mathbf{P}=\\epsilon_0\\chi_e\\mathbf{E} \\implies \\mathbf{D}=\\epsilon\\mathbf{E}$ ($\\epsilon=\\epsilon_0(1+\\chi_e)=\\epsilon_0\\epsilon_r$).", "<b>Dielectric Boundary Conditions (`lect_22-23`):</b> Across interface ($2 \\to 1$, $\\hat{\\mathbf{a}}_n$ outward from 2 to 1): $D_{1\\perp} - D_{2\\perp} = \\sigma_f$ and $\\mathbf{E}_{1\\parallel} = \\mathbf{E}_{2\\parallel}$. At charge-free ($\\sigma_f=0$) interface: $\\frac{\\tan\\theta_1}{\\tan\\theta_2} = \\frac{\\epsilon_{r1}}{\\epsilon_{r2}}$.", "<b>Capacitors (`lect_22` Prob 3):</b> Plate $C=\\frac{\\epsilon A}{d}$; Spherical $C=\\frac{4\\pi\\epsilon ab}{b-a}$ ($a<b$); Coaxial $C/L=\\frac{2\\pi\\epsilon}{\\ln(b/a)}$. Split-dielectric sphere (half $\\epsilon_1$, half $\\epsilon_2$): two parallel caps $C = C_1+C_2 = \\frac{2\\pi(\\epsilon_1+\\epsilon_2)ab}{b-a}$!"], "walkthrough": {"source": "PH1000 Assignment-1 Q4 & Q6", "problem": "(Q4) A sphere of radius $R$ has polarization $\\mathbf{P}(\\mathbf{r}) = k\\mathbf{r}$ ($k$ const, no free charge). Find $\\rho_b,\\sigma_b,\\mathbf{E}_{\\text{in}},\\mathbf{E}_{\\text{out}}$. (Q6b) Find $\\epsilon_r$ if capacitor stores $u=100\\text{ J/m}^3$ with $V_0=200\\text{ V}$ across $d=45\\,\\mu\\text{m}$.", "steps": ["<b>Q4 Step 1 (Bound Charges):</b> $\\rho_b = -\\nabla\\cdot(k\\mathbf{r}) = -k(1+1+1) = \\mathbf{-3k}$; outer surface $\\sigma_b = \\mathbf{P}(R)\\cdot\\hat{\\mathbf{r}} = kR(\\hat{\\mathbf{r}}\\cdot\\hat{\\mathbf{r}}) = \\mathbf{kR}$. Check net bound charge: $(-3k)(\\frac{4}{3}\\pi R^3) + (kR)(4\\pi R^2) = 0$!", "<b>Q4 Step 2 ($\\mathbf{D}$ &amp; $\\mathbf{E}$):</b> Since $Q_{f,\\text{enc}}=0$ by spherical symmetry ($\\nabla\\times\\mathbf{P}=0$), $\\mathbf{D} = \\mathbf{0}$ EVERYWHERE! Inside ($r<R$): $\\epsilon_0\\mathbf{E}+\\mathbf{P}=0 \\implies \\mathbf{E}_{\\text{in}} = \\mathbf{-\\frac{k\\mathbf{r}}{\\epsilon_0}}$; Outside ($r>R$): $\\mathbf{P}=0 \\implies \\mathbf{E}_{\\text{out}} = \\mathbf{0}$.", "<b>Q6(b) Step 3:</b> $E = \\frac{200}{45\\times 10^{-6}} = 4.444\\times 10^6\\text{ V/m}$. Then $u = \\frac{1}{2}\\epsilon_0\\epsilon_r E^2 \\implies \\epsilon_r = \\frac{2(100)}{(8.854\\times 10^{-12})(4.444\\times 10^6)^2} = \\mathbf{1.143}$."], "answer": "Q4: $\\rho_b=-3k,\\ \\sigma_b=kR,\\ \\mathbf{E}_{\\text{in}}=-k\\mathbf{r}/\\epsilon_0,\\ \\mathbf{E}_{\\text{out}}=\\mathbf{0}$; Q6(b): $\\epsilon_r = 1.143$."}, "formula": "$$\\rho_b = -\\nabla\\cdot\\mathbf{P}, \\quad \\sigma_b = \\mathbf{P}\\cdot\\hat{\\mathbf{n}} \\qquad\\Big|\\qquad \\mathbf{D} = \\epsilon_0\\mathbf{E}+\\mathbf{P} = \\epsilon_0\\epsilon_r\\mathbf{E} \\qquad\\Big|\\qquad D_{1\\perp}-D_{2\\perp}=\\sigma_f,\\quad E_{1\\parallel}=E_{2\\parallel}$$", "trap": "Never drop the minus sign in $\\rho_b = -\\nabla\\cdot\\mathbf{P}$! And when asked for capacitance with a slab inserted: **Battery connected** ($V$ fixed) $\\implies Q' = \\epsilon_r Q,\\ W' = \\epsilon_r W$; **Battery disconnected** ($Q$ fixed) $\\implies V' = V/\\epsilon_r,\\ W' = W/\\epsilon_r$!"}, {"title": "9. Lorentz Force, Cyclotron Motion, Steady Currents & Continuity", "topicId": "ph_t9", "tag": "Lectures 24-25 • Magnetostatics Start", "intuition": "Magnetic forces ALWAYS act perpendicular to motion ($\\mathbf{v}\\times\\mathbf{B} \\perp \\mathbf{v}$), which means $\\mathbf{B}$ can bend a trajectory or steer a motor shaft, yet it can NEVER speed up or slow down a free particle ($dW_{\\text{mag}} = 0$!). Meanwhile, steady current obeys charge conservation: whatever charge leaves a volume equals incoming deficit $-\\partial\\rho/\\partial t$.", "bullets": ["<b>Lorentz Force Law (`lect_24`):</b> $\\mathbf{F} = q(\\mathbf{E} + \\mathbf{v}\\times\\mathbf{B})$. Magnetic work $dW_{\\text{mag}} = q(\\mathbf{v}\\times\\mathbf{B})\\cdot\\mathbf{v}\\,dt \\equiv 0$. Cyclotron radius ($v\\perp B$): $R = \\frac{mv}{qB}$, angular frequency $\\omega_c = \\frac{qB}{m}$. Velocity selector ($\\mathbf{F}=0$ when $\\mathbf{E}\\perp\\mathbf{B}$): $v = E/B$.", "<b>Line, Surface &amp; Volume Currents (`lect_25`):</b> Filament $I = \\lambda v$; surface current density $\\mathbf{K} = \\frac{d\\mathbf{I}}{dl_\\perp} = \\sigma\\mathbf{v}$ ($\\text{A/m}$); volume current density $\\mathbf{J} = \\frac{d\\mathbf{I}}{da_\\perp} = \\rho\\mathbf{v}$ ($\\text{A/m}^2$). Force on wire: $\\mathbf{F}_{\\text{mag}} = I\\int d\\mathbf{l}\\times\\mathbf{B}$.", "<b>Equation of Continuity (`lect_25`):</b> $\\oint_{\\mathcal{S}}\\mathbf{J}\\cdot d\\mathbf{a} = -\\frac{dQ_{\\text{enc}}}{dt} \\implies \\nabla\\cdot\\mathbf{J} = -\\frac{\\partial\\rho}{\\partial t}$. In **magnetostatics (steady currents)**, $\\rho$ is constant in time so $\\nabla\\cdot\\mathbf{J} = 0$."], "walkthrough": {"source": "lect_25 Cycloid Motion & Wire Force", "problem": "(a) Find force on a closed current loop $I$ inside a UNIFORM magnetic field $\\mathbf{B}_0$. (b) In `Assignment-2 Q1`-style wire problem, find cyclotron $R$ for proton ($m=1.67\\times 10^{-27}\\text{ kg}, q=1.6\\times 10^{-19}\\text{ C}$) with $v=2\\times 10^6\\text{ m/s}$ in $B=0.5\\text{ T}$.", "steps": ["<b>Part (a):</b> Pull constant $\\mathbf{B}_0$ outside the loop integral: $\\mathbf{F} = I\\left(\\oint d\\mathbf{l}\\right)\\times\\mathbf{B}_0 = \\mathbf{0}\\times\\mathbf{B}_0 = \\mathbf{0}$! Any closed rigid loop experiences zero net translation force in a uniform $\\mathbf{B}$ (only torque $\\mathbf{m}\\times\\mathbf{B}$!).", "<b>Part (b):</b> $R = \\frac{mv}{qB} = \\frac{(1.67\\times 10^{-27})(2\\times 10^6)}{(1.6\\times 10^{-19})(0.5)} = \\mathbf{0.04175\\text{ m}\\ (4.18\\text{ cm})}$."], "answer": "(a) $\\mathbf{F}_{\\text{net}} = \\mathbf{0}$; (b) $R = 4.18\\text{ cm}$."}, "formula": "$$\\mathbf{F} = q(\\mathbf{E}+\\mathbf{v}\\times\\mathbf{B}) \\quad (dW_{\\text{mag}}=0), \\qquad R = \\frac{mv}{qB}, \\qquad \\nabla\\cdot\\mathbf{J} = -\\frac{\\partial\\rho}{\\partial t}$$", "trap": "Confusing current density units drops easy marks: $\\mathbf{K}$ is current per unit perpendicular **width** ($\\text{A/m}$, $\\mathbf{K}=\\sigma\\mathbf{v}$), whereas $\\mathbf{J}$ is current per unit perpendicular **area** ($\\text{A/m}^2$, $\\mathbf{J}=\\rho\\mathbf{v}$)!"}, {"title": "10. Biot-Savart, Ampere's Law, Vector Potential A & Magnetic Dipoles", "topicId": "ph_t10", "tag": "Lectures 26-28 • Steady Fields & Vector A", "intuition": "Since $\\nabla\\cdot\\mathbf{B} = 0$ always (magnetic monopoles don't exist!), $\\mathbf{B}$ field lines NEVER start or stop — they form closed loops wrapping around currents! Just as symmetry turned Coulomb's Law into Gauss's Law, symmetry turns Biot-Savart into **Ampère's Law** for infinite wires, planes, solenoids, and toroids.", "bullets": ["<b>Biot-Savart Law (`lect_26`, $\\mu_0 = 4\\pi\\times 10^{-7}\\text{ N/A}^2$):</b> $\\mathbf{B}(\\mathbf{r}) = \\frac{\\mu_0 I}{4\\pi}\\int \\frac{d\\mathbf{l}'\\times\\hat{\\boldsymbol{\\mathfrak{r}}}}{\\mathfrak{r}^2}$.<br>&bull; Straight segment (angles $\\theta_1,\\theta_2$ from perp): $B = \\frac{\\mu_0 I}{4\\pi s}(\\sin\\theta_2 - \\sin\\theta_1) \\xrightarrow{\\infty} \\frac{\\mu_0 I}{2\\pi s}$.<br>&bull; Axis of circular loop (radius $R$): $B_z = \\frac{\\mu_0 I R^2}{2(R^2+z^2)^{3/2}}$; square loop uses 4 segments!<br>&bull; Two parallel wires $d$ apart: force/length $f = \\frac{\\mu_0 I_1 I_2}{2\\pi d}$ (same dir **attract**, opp dir **repel**).", "<b>Ampère's Law (`lect_27`):</b> $\\oint\\mathbf{B}\\cdot d\\mathbf{l} = \\mu_0 I_{\\text{enc}} \\iff \\nabla\\times\\mathbf{B} = \\mu_0\\mathbf{J}$ (steady currents ONLY!).<br>&bull; Solenoid ($n=N/L$): $B_{\\text{in}} = \\mu_0 n I$, $B_{\\text{out}}=0$.<br>&bull; Toroid ($N$ turns, radius $s$): $B_{\\text{in}} = \\frac{\\mu_0 N I}{2\\pi s}\\hat{\\boldsymbol{\\phi}}$.<br>&bull; Infinite current sheet $\\mathbf{K}=K\\hat{x}$: $\\mathbf{B} = \\pm\\frac{\\mu_0}{2}(\\mathbf{K}\\times\\hat{\\mathbf{n}})$.", "<b>Vector Potential $\\mathbf{A}$ &amp; Dipoles (`lect_28`):</b> $\\mathbf{B} = \\nabla\\times\\mathbf{A}$; Coulomb gauge $\\nabla\\cdot\\mathbf{A} = 0 \\implies \\nabla^2\\mathbf{A} = -\\mu_0\\mathbf{J} \\implies \\mathbf{A} = \\frac{\\mu_0}{4\\pi}\\int \\frac{\\mathbf{J}}{\\mathfrak{r}}\\,d\\tau'$. Magnetic dipole moment $\\mathbf{m} = N I A\\,\\hat{\\mathbf{n}}$ (torque $\\mathbf{N}=\\mathbf{m}\\times\\mathbf{B}$, potential $\\mathbf{A}_{\\text{dip}} = \\frac{\\mu_0}{4\\pi}\\frac{\\mathbf{m}\\times\\hat{\\mathbf{r}}}{r^2}$)."], "walkthrough": {"source": "lect_27 Thick Wire & Solenoid / Vector Potential A", "problem": "(a) Long cylindrical wire of radius $R$ carries total current $I$ with non-uniform density $\\mathbf{J}(s) = k s\\,\\hat{\\mathbf{z}}$. Find $\\mathbf{B}$ for $s<R$ and $s>R$. (b) Check $\\mathbf{A}$ inside/outside an infinite solenoid if $\\mathbf{B} = \\mu_0 n I\\,\\hat{z}$ ($s<R$).", "steps": ["<b>Part (a) Inside ($s < R$):</b> $I_{\\text{enc}}(s) = \\int_0^s (k s')(2\\pi s'\\,ds') = \\frac{2}{3}\\pi k s^3$. Ampère: $B(2\\pi s) = \\mu_0(\\frac{2}{3}\\pi k s^3) \\implies \\mathbf{B}_{\\text{in}} = \\mathbf{\\frac{\\mu_0 k s^2}{3}\\hat{\\boldsymbol{\\phi}}}$.", "<b>Part (a) Outside ($s > R$):</b> $I_{\\text{tot}} = \\frac{2}{3}\\pi k R^3 \\implies \\mathbf{B}_{\\text{out}} = \\frac{\\mu_0 I_{\\text{tot}}}{2\\pi s}\\hat{\\boldsymbol{\\phi}} = \\mathbf{\\frac{\\mu_0 k R^3}{3s}\\hat{\\boldsymbol{\\phi}}}$.", "<b>Part (b) Vector Potential $\\mathbf{A}$ of Solenoid (`lect_28`):</b> Using $\\oint\\mathbf{A}\\cdot d\\mathbf{l} = \\Phi_{\\text{enc}} = B\\cdot\\text{area}$: for $s<R$, $A(2\\pi s) = \\mu_0 n I(\\pi s^2) \\implies \\mathbf{A}_{\\text{in}} = \\frac{\\mu_0 n I s}{2}\\hat{\\boldsymbol{\\phi}}$; for $s>R$, $\\mathbf{A}_{\\text{out}} = \\frac{\\mu_0 n I R^2}{2s}\\hat{\\boldsymbol{\\phi}}$ (nonzero even where $\\mathbf{B}=0$!)."], "answer": "(a) $\\frac{\\mu_0 k s^2}{3}\\hat{\\phi}$ ($s<R$), $\\frac{\\mu_0 k R^3}{3s}\\hat{\\phi}$ ($s>R$); (b) $\\mathbf{A}$ goes as $s$ inside and $1/s$ outside!"}, "formula": "$$B_{\\text{wire}}=\\frac{\\mu_0 I}{2\\pi s},\\quad B_{\\text{sol}}=\\mu_0 n I \\qquad\\Big|\\qquad \\oint\\mathbf{B}\\cdot d\\mathbf{l}=\\mu_0 I_{\\text{enc}} \\qquad\\Big|\\qquad \\mathbf{B}=\\nabla\\times\\mathbf{A},\\quad \\oint\\mathbf{A}\\cdot d\\mathbf{l}=\\Phi$$", "trap": "Look closely at `lect_28`: vector potential $\\mathbf{A}$ can be NON-ZERO outside an infinite solenoid even though $\\mathbf{B}_{\\text{out}} = 0$! And unlike Coulomb attraction, parallel currents **ATTRACT** while antiparallel currents **REPEL**!"}, {"title": "11. Magnetization M, Bound Currents, H Field & Magnetic Boundaries", "topicId": "ph_t11", "tag": "Lectures 29-31 & Assignment-2 Q4", "intuition": "Just as electric polarization $\\mathbf{P}$ created bound charges $(\\rho_b, \\sigma_b)$ so $\\mathbf{D}$ could isolate free charges, **magnetization $\\mathbf{M}$** (magnetic dipole moment/vol) creates bound volume & surface currents $(\\mathbf{J}_b, \\mathbf{K}_b)$ so auxiliary field **$\\mathbf{H}$** only tracks FREE currents $I_{f,\\text{enc}}$!", "bullets": ["<b>Bound Currents (`lect_29`):</b> Volume bound current $\\mathbf{J}_b = \\nabla\\times\\mathbf{M}$ (Amperes/m$^2$); Surface bound current $\\mathbf{K}_b = \\mathbf{M}\\times\\hat{\\mathbf{n}}$ (Amperes/m, $\\hat{\\mathbf{n}}$ outward normal).", "<b>Auxiliary Field $\\mathbf{H}$ &amp; Ampère in Matter (`lect_30`):</b> Define $\\mathbf{H} \\equiv \\frac{1}{\\mu_0}\\mathbf{B} - \\mathbf{M}$ (so $\\mathbf{B} = \\mu_0(\\mathbf{H}+\\mathbf{M})$). Then $\\nabla\\times\\mathbf{H} = \\mathbf{J}_f$ and $\\oint\\mathbf{H}\\cdot d\\mathbf{l} = I_{f,\\text{enc}}$!", "<b>Linear Magnetic Media (`lect_30-31`):</b> $\\mathbf{M} = \\chi_m\\mathbf{H} \\implies \\mathbf{B} = \\mu_0(1+\\chi_m)\\mathbf{H} = \\mu_0\\mu_r\\mathbf{H} = \\mu\\mathbf{H}$. Classification: Diamagnet ($\\chi_m < 0$, e.g. Bi/Cu), Paramagnet ($\\chi_m > 0$, e.g. Al/O$_2$), Ferromagnet (non-linear hysteresis, $\\mu_r \\gg 1$, Fe/Ni/Co).", "<b>Magnetic Boundary Conditions (`lect_31`):</b> $B_{1\\perp} = B_{2\\perp}$ (always continuous since $\\nabla\\cdot\\mathbf{B}=0$!) and tangential jump $\\mathbf{H}_{1\\parallel} - \\mathbf{H}_{2\\parallel} = \\mathbf{K}_f \\times \\hat{\\mathbf{n}}$ (or $\\mathbf{B}_{1\\parallel} - \\mathbf{B}_{2\\parallel} = \\mu_0(\\mathbf{K}\\times\\hat{\\mathbf{n}})$ in vacuum)."], "walkthrough": {"source": "PH1000 Assignment-2 Q4 & lect_31 Coaxial / Cylinder", "problem": "An infinite solid circular cylinder of radius $R$ carries frozen magnetization $\\mathbf{M}(s) = b s\\,\\hat{\\mathbf{z}}$ (with ZERO free current anywhere). Find $\\mathbf{J}_b,\\ \\mathbf{K}_b,\\ \\mathbf{H},\\ \\mathbf{B}_{\\text{in}},$ and $\\mathbf{B}_{\\text{out}}$.", "steps": ["<b>Step 1 (Bound Currents — Cylindrical Curl!):</b> Note $\\mathbf{M}$ only has $z$-component depending on $s$: $\\mathbf{J}_b = \\nabla\\times\\mathbf{M} = -\\frac{\\partial M_z}{\\partial s}\\hat{\\boldsymbol{\\phi}} = \\mathbf{-b\\hat{\\boldsymbol{\\phi}}}$. Outer surface ($s=R$, $\\hat{\\mathbf{n}}=\\hat{\\mathbf{s}}$): $\\mathbf{K}_b = \\mathbf{M}(R)\\times\\hat{\\mathbf{s}} = (bR\\,\\hat{\\mathbf{z}})\\times\\hat{\\mathbf{s}} = \\mathbf{+bR\\,\\hat{\\boldsymbol{\\phi}}}$.", "<b>Step 2 (Free Field $\\mathbf{H}$):</b> Because $I_{f,\\text{enc}} = 0$ everywhere ($\\mathbf{J}_f=0, \\mathbf{K}_f=0$) and symmetry suppresses divergence, $\\oint\\mathbf{H}\\cdot d\\mathbf{l}=0 \\implies \\mathbf{H} = \\mathbf{0}$ everywhere!", "<b>Step 3 (Total Field $\\mathbf{B}$):</b> Use $\\mathbf{B} = \\mu_0(\\mathbf{H}+\\mathbf{M})$: Inside ($s<R$), $\\mathbf{B}_{\\text{in}} = \\mathbf{\\mu_0 b s\\,\\hat{\\mathbf{z}}}$; Outside ($s>R$), $\\mathbf{M}=\\mathbf{0} \\implies \\mathbf{B}_{\\text{out}} = \\mathbf{0}$! (Verify jump at $s=R$: $\\Delta B_\\parallel = \\mu_0 K_b = \\mu_0 b R$!)"], "answer": "$\\mathbf{J}_b=-b\\hat{\\phi},\\ \\mathbf{K}_b=bR\\hat{\\phi},\\ \\mathbf{H}=\\mathbf{0},\\ \\mathbf{B}_{\\text{in}}=\\mu_0 b s\\,\\hat{z},\\ \\mathbf{B}_{\\text{out}}=\\mathbf{0}$."}, "formula": "$$\\mathbf{J}_b = \\nabla\\times\\mathbf{M}, \\quad \\mathbf{K}_b = \\mathbf{M}\\times\\hat{\\mathbf{n}} \\qquad\\Big|\\qquad \\oint\\mathbf{H}\\cdot d\\mathbf{l} = I_{f,\\text{enc}} \\qquad\\Big|\\qquad B_{1\\perp}=B_{2\\perp},\\quad \\mathbf{H}_{1\\parallel}-\\mathbf{H}_{2\\parallel}=\\mathbf{K}_f\\times\\hat{\\mathbf{n}}$$", "trap": "Check TWO opposite cross/normal rules! Electric: $\\rho_b = -\\nabla\\cdot\\mathbf{P}$ has a minus sign; Magnetic: $\\mathbf{J}_b = +\\nabla\\times\\mathbf{M}$ has NO minus sign, and $\\mathbf{K}_b = \\mathbf{M}\\times\\hat{\\mathbf{n}}$ (M FIRST, normal SECOND — reversing gives opposite sign!)."}, {"title": "12. Faraday's Law, Lenz Polarity, Motional EMF & Inductance", "topicId": "ph_t12", "tag": "Lectures 32-36 • Time-Varying Flux & Energy", "intuition": "Nature hates abrupt changes in magnetic flux! If flux through a loop tries to climb, Faraday builds a swirling non-conservative $\\mathbf{E}$-field ($\\nabla\\times\\mathbf{E} = -\\partial\\mathbf{B}/\\partial t$) driving a current whose magnetic field fights the rise. Inside any coil or moving bar acting as an EMF source, induced current flows from $-$ terminal to $+$ terminal!", "bullets": ["<b>Faraday's Law &amp; Lenz's Law (`lect_32`):</b> $\\mathcal{E} = \\oint\\mathbf{E}\\cdot d\\mathbf{l} = -\\frac{d\\Phi}{dt}$ where $\\Phi = \\int_{\\mathcal{S}}\\mathbf{B}\\cdot d\\mathbf{a}$, so differential form is $\\nabla\\times\\mathbf{E} = -\\frac{\\partial\\mathbf{B}}{\\partial t}$.", "<b>Motional EMF (`lect_33`):</b> $\\mathcal{E} = \\oint(\\mathbf{u}\\times\\mathbf{B})\\cdot d\\mathbf{l}$ (force per unit charge magnetic drift): sliding bar $\\mathcal{E} = B L u$; rotating spoke in $B\\perp\\text{plane}$: $\\mathcal{E} = \\frac{1}{2}B\\omega L^2$; Flux Rule holds for both!", "<b>Inductance &amp; Magnetic Energy (`lect_35-36`):</b> Mutual $M_{12} = M_{21} = \\frac{\\Phi_2}{I_1}$ (Neumann formula); Self-inductance $N\\Phi = L I$ giving back EMF $\\mathcal{E} = -L\\frac{di}{dt}$. Solenoid $L = \\mu_0 n^2 \\pi r^2 l$ (or $\\frac{\\mu_0 N^2 A}{l}$). Energy: $W_m = \\frac{1}{2}LI^2 = \\frac{1}{2}\\int\\mathbf{A}\\cdot\\mathbf{J}\\,d\\tau = \\frac{1}{2\\mu_0}\\int B^2\\,d\\tau$."], "walkthrough": {"source": "lect_35-36 Terminal Polarity & Rotating/Falling Loop", "problem": "(a) `lect_36`: A metal ring sits in a $+\\hat{\\mathbf{z}}$ field $\\mathbf{B}(t)$ that INCREASES with time ($dB/dt > 0$), with a small break $a$-$b$ (seen from above, $a$ on left of break, $b$ on right). Find which terminal is $+$ and magnitude $\\mathcal{E} = \\pi R^2 \\dot{B}$. (b) Find energy density $w_m$ and total energy $W_m$ in a toroidal coil or solenoid.", "steps": ["<b>Part (a) Lenz Opposition Field:</b> External $\\mathbf{B}_{\\text{ext}}$ increases along $+\\hat{\\mathbf{z}}$ (out of page), so induced $\\mathbf{B}_{\\text{in}}$ MUST point into page ($-\\hat{\\mathbf{z}}$) to oppose the increase!", "<b>Part (a) Current &amp; Source Polarity:</b> Right-hand thumb into page $-\\hat{\\mathbf{z}}$ curls **clockwise** around the ring! Because an induced loop behaves like a source driving current from $-$ to $+$ inside itself, following clockwise around the lower ring arc drives current into terminal **$a$** and out toward the break from **$b \\to a$**, making terminal **$a$ positive ($+$)** and **$b$ negative ($-$)** (check at upper break: load current crosses $a \\to b$ clockwise!).", "<b>Part (b) Solenoid $L$:</b> $W_m = \\frac{1}{2\\mu_0}B^2 (\\pi r^2 l) = \\frac{1}{2\\mu_0}(\\mu_0 n I)^2 (\\pi r^2 l) = \\frac{1}{2}(\\mu_0 n^2 \\pi r^2 l)I^2 \\implies L = \\mathbf{\\mu_0 n^2 \\pi r^2 l}$."], "answer": "(a) Clockwise current makes terminal $a$ ($+$) wrt $b$ ($-$), $|\\mathcal{E}|=\\pi R^2\\dot{B}$; (b) $L=\\mu_0 n^2\\pi r^2 l$."}, "formula": "$$\\nabla\\times\\mathbf{E} = -\\frac{\\partial\\mathbf{B}}{\\partial t}, \\qquad \\mathcal{E}_{\\text{mot}} = B L u\\ \\big(\\tfrac{1}{2}B\\omega L^2\\big), \\qquad W_m = \\frac{1}{2}LI^2 = \\frac{1}{2\\mu_0}\\int B^2\\,d\\tau$$", "trap": "Never confuse **flux** $\\Phi = B A\\cos\\theta$ vs **rate of change** $-d\\Phi/dt$: a strong static magnet ($\\dot{B}=0$) produces ZERO induced EMF, and inside a generating coil/ring, conventional current exits the **POSITIVE ($+$)** terminal!"}, {"title": "13. Displacement Current J_d, Maxwell's Equations, Poynting & EM Waves", "topicId": "ph_t13", "tag": "Lectures 34-37 & Assignment-2 Q5", "intuition": "Steady Ampère's Law breaks down between two charging capacitor plates where ZERO real charges cross the vacuum gap — yet magnetic $\\mathbf{B}$ still wraps around it! Maxwell rescued electromagnetism by spotting that a **changing electric field** ($\\mathbf{J}_d = \\epsilon\\partial\\mathbf{E}/\\partial t$) generates the exact same magnetic swirl as conduction current, predicting light itself as self-sustaining $\\mathbf{E}\\leftrightarrow\\mathbf{B}$ waves!", "svg": "<svg viewBox=\"0 0 620 190\" style=\"max-width:580px;width:100%;height:auto;display:block;margin:0 auto;\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect width=\"620\" height=\"190\" rx=\"12\" fill=\"var(--surface)\" stroke=\"var(--border)\"/>\n  <g transform=\"translate(18,16)\">\n    <text x=\"125\" y=\"12\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" fill=\"var(--chart-3)\">Charging Capacitor Gap (J_d)</text>\n    <line x1=\"15\" y1=\"90\" x2=\"95\" y2=\"90\" stroke=\"var(--text)\" stroke-width=\"3.5\"/>\n    <rect x=\"95\" y=\"40\" width=\"8\" height=\"100\" rx=\"2\" fill=\"var(--primary)\"/>\n    <rect x=\"147\" y=\"40\" width=\"8\" height=\"100\" rx=\"2\" fill=\"var(--primary)\"/>\n    <line x1=\"155\" y1=\"90\" x2=\"235\" y2=\"90\" stroke=\"var(--text)\" stroke-width=\"3.5\"/>\n    <line x1=\"106\" y1=\"62\" x2=\"144\" y2=\"62\" stroke=\"var(--error)\" stroke-width=\"1.8\" marker-end=\"url(#arRed)\"/>\n    <line x1=\"106\" y1=\"90\" x2=\"144\" y2=\"90\" stroke=\"var(--error)\" stroke-width=\"1.8\" marker-end=\"url(#arRed)\"/>\n    <line x1=\"106\" y1=\"118\" x2=\"144\" y2=\"118\" stroke=\"var(--error)\" stroke-width=\"1.8\" marker-end=\"url(#arRed)\"/>\n    <text x=\"125\" y=\"156\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--error)\">J_d = e0 dE/dt matches I_c</text>\n    <text x=\"35\" y=\"82\" font-size=\"10.5\" font-weight=\"700\" fill=\"var(--text)\">I = 10 A</text>\n  </g>\n  <line x1=\"275\" y1=\"18\" x2=\"275\" y2=\"172\" stroke=\"var(--border)\" stroke-dasharray=\"4 3\"/>\n  <g transform=\"translate(295,16)\">\n    <text x=\"150\" y=\"12\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"800\" fill=\"var(--primary)\">Plane EM Wave: E x B along k</text>\n    <line x1=\"20\" y1=\"95\" x2=\"295\" y2=\"95\" stroke=\"var(--text-muted)\" stroke-width=\"1.5\"/>\n    <path d=\"M 30 95 Q 65 28 100 95 T 170 95 T 240 95\" fill=\"none\" stroke=\"var(--error)\" stroke-width=\"2.4\"/>\n    <path d=\"M 30 95 Q 65 130 100 95 T 170 95 T 240 95\" fill=\"none\" stroke=\"var(--primary)\" stroke-width=\"2\" stroke-dasharray=\"5 3\"/>\n    <text x=\"58\" y=\"42\" font-size=\"11\" font-weight=\"800\" fill=\"var(--error)\">E (x)</text>\n    <text x=\"58\" y=\"138\" font-size=\"11\" font-weight=\"800\" fill=\"var(--primary)\">B (y)</text>\n    <text x=\"255\" y=\"88\" font-size=\"11\" font-weight=\"800\" fill=\"var(--success)\">+z (k = S)</text>\n    <text x=\"150\" y=\"160\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"var(--text-muted)\">B0 = E0 / c  |  &lt;S&gt; = 1/2 e0 c E0^2</text>\n  </g>\n  <defs><marker id=\"arRed\" markerWidth=\"6\" markerHeight=\"6\" refX=\"5\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"var(--error)\"/></marker></defs>\n</svg>", "table": {"headers": ["Law Name", "Maxwell Equation (In Matter)", "Free-Space Form (rho, J)"], "rows": [["1. Gauss (Electric)", "$\\nabla\\cdot\\mathbf{D} = \\rho_f$", "$\\nabla\\cdot\\mathbf{E} = \\rho/\\epsilon_0$"], ["2. Gauss (Magnetic)", "$\\nabla\\cdot\\mathbf{B} = 0$", "$\\nabla\\cdot\\mathbf{B} = 0$ (no monopoles)"], ["3. Faraday's Law", "$\\nabla\\times\\mathbf{E} = -\\frac{\\partial\\mathbf{B}}{\\partial t}$", "$\\nabla\\times\\mathbf{E} = -\\frac{\\partial\\mathbf{B}}{\\partial t}$"], ["4. Ampère-Maxwell", "$\\nabla\\times\\mathbf{H} = \\mathbf{J}_f + \\frac{\\partial\\mathbf{D}}{\\partial t}$", "$\\nabla\\times\\mathbf{B} = \\mu_0\\mathbf{J} + \\mu_0\\epsilon_0\\frac{\\partial\\mathbf{E}}{\\partial t}$"]]}, "bullets": ["<b>Displacement Current Fix (`lect_34`):</b> Taking div of Ampère gives $\\nabla\\cdot(\\nabla\\times\\mathbf{H})=0$, contradicting $\\nabla\\cdot\\mathbf{J}=-\\partial\\rho/\\partial t$ unless $\\mathbf{J}_d = \\frac{\\partial\\mathbf{D}}{\\partial t} = \\epsilon\\frac{\\partial\\mathbf{E}}{\\partial t}$ is added! Conduction vs Displacement ratio: $J_c = \\sigma E$ vs $J_d = \\epsilon\\frac{\\partial E}{\\partial t}$.", "<b>Poynting Vector &amp; Energy Flow (`lect_36`):</b> Power flux $\\mathbf{S} = \\mathbf{E}\\times\\mathbf{H} = \\frac{1}{\\mu_0}(\\mathbf{E}\\times\\mathbf{B})$ ($\\text{W/m}^2$). Energy balance: $-\\frac{d}{dt}\\int u\\,d\\tau = \\int \\mathbf{J}\\cdot\\mathbf{E}\\,d\\tau + \\oint \\mathbf{S}\\cdot d\\mathbf{a}$ ($u = \\frac{1}{2}(\\epsilon_0 E^2 + \\frac{1}{\\mu_0}B^2)$).", "<b>Plane EM Waves (`lect_37`):</b> Speed $c = \\frac{1}{\\sqrt{\\mu_0\\epsilon_0}} = 3\\times 10^8\\text{ m/s}$, in matter $v = \\frac{c}{n}$ ($n=\\sqrt{\\epsilon_r\\mu_r}$). Orthogonal triad $\\mathbf{B} = \\frac{E_0}{v}\\cos(\\mathbf{k}\\cdot\\mathbf{r}-\\omega t)(\\hat{\\mathbf{k}}\\times\\hat{\\mathbf{n}})$, impedance $\\frac{E_0}{H_0} = \\sqrt{\\frac{\\mu_0}{\\epsilon_0}}\\approx 377\\,\\Omega$, Intensity $I = \\langle S\\rangle = \\frac{1}{2}\\epsilon_0 c E_0^2 = \\frac{E_0 B_0}{2\\mu_0}$."], "walkthrough": {"source": "PH1000 Assignment-2 Q5 & lect_34 / lect_37", "problem": "(Q5 Gap): Wire radius $R=2\\text{ cm}$ carries steady $I=10\\text{ A}$ into parallel-plate capacitor gap. Find $B$ in the gap at $r=1\\text{ cm}$. (lect_37): Planet receives $10\\text{ cal}/(\\text{m}^2\\cdot\\text{s})$ from Sun ($1\\text{ cal}=4.184\\text{ J}$). Find $E_0, B_0$.", "steps": ["<b>Assignment-2 Q5 ($J_d$ in Gap):</b> Zero conduction current across gap; uniform $\\mathbf{J}_d$ sums to $I=10\\text{ A}$ over radius $R$, so loop $r=1\\text{ cm}$ encloses $I_{d,\\text{enc}} = I\\frac{\\pi r^2}{\\pi R^2}$. Ampère-Maxwell: $B(2\\pi r) = \\mu_0 I \\frac{r^2}{R^2} \\implies B = \\frac{\\mu_0 I r}{2\\pi R^2} = \\frac{(4\\pi\\times 10^{-7})(10)(0.01)}{2\\pi(0.02)^2} = \\mathbf{5\\times 10^{-5}\\text{ T}\\ (50\\,\\mu\\text{T})}$.", "<b>lect_37 Solar Irradiance:</b> Convert $I = \\langle S\\rangle = 10\\times 4.184 = 41.84\\text{ W/m}^2$. Since $I = \\frac{1}{2}\\epsilon_0 c E_0^2$, $E_0 = \\sqrt{\\frac{2(41.84)}{(8.854\\times 10^{-12})(3\\times 10^8)}} = \\mathbf{177.5\\text{ V/m}}$, and $B_0 = \\frac{E_0}{c} = \\mathbf{5.92\\times 10^{-7}\\text{ T}}$."], "answer": "Q5: $B = 50\\,\\mu\\text{T}$; lect_37: $E_0 = 177.5\\text{ V/m},\\ B_0 = 5.92\\times 10^{-7}\\text{ T}$."}, "formula": "$$\\mathbf{J}_d = \\frac{\\partial\\mathbf{D}}{\\partial t}, \\qquad \\mathbf{S} = \\mathbf{E}\\times\\mathbf{H}, \\qquad \\langle S\\rangle = \\frac{1}{2}\\epsilon_0 c E_0^2, \\qquad B_0 = \\frac{E_0}{c}$$", "trap": "NEVER drop the **$1/2$** in time-averaged EM intensity $\\langle S\\rangle = \\frac{1}{2}\\epsilon_0 c E_0^2$ ($\\langle\\cos^2\\rangle = 1/2$)! And ALWAYS verify wave signs: $\\hat{\\mathbf{E}}\\times\\hat{\\mathbf{B}}$ MUST point in the propagation direction $\\hat{\\mathbf{k}}$!"}], "practice": [{"id": "ph_q1", "src": "Midsem / Endsem", "level": "Midsem 2022 Q1", "q": "Given $\\vec{u} = 10\\hat{r}+30\\hat{\\theta}-10\\hat{\\phi}$ and $\\vec{v} = -3\\hat{r}-10\\hat{\\theta}+20\\hat{\\phi}$ at the same point $P$, find the vector projection of $\\vec{u}$ onto $\\vec{v}$.", "hint": "Same point $P$ $\\implies$ direct spherical dot product applies: $\\frac{\\vec{u}\\cdot\\vec{v}}{\\|\\vec{v}\\|^2}\\vec{v}$.", "sol": "$\\vec{u}\\cdot\\vec{v} = -30 - 300 - 200 = -530$; $\\|\\vec{v}\\|^2 = 9 + 100 + 400 = 509$.\n$\\text{proj}_{\\vec{v}}\\vec{u} = -\\frac{530}{509}(-3\\hat{r}-10\\hat{\\theta}+20\\hat{\\phi}) = \\mathbf{3.124\\hat{r}+10.413\\hat{\\theta}-20.825\\hat{\\phi}}$."}, {"id": "ph_q2", "src": "Midsem / Endsem", "level": "Midsem 2022 Q2", "q": "Add $\\vec{A} = 12\\hat{r}+5\\hat{\\theta}+\\pi\\hat{\\phi}$ at $P(2,\\pi,\\pi/2)$ and $\\vec{B} = 2\\hat{r}+0.5\\pi\\hat{\\theta}$ at $Q(5,\\pi/2,\\pi/2)$.", "hint": "Different points! Convert BOTH vectors to fixed Cartesian $(\\hat{x},\\hat{y},\\hat{z})$ first.", "sol": "At $P(\\pi,\\pi/2)$: $A_x=-\\pi,\\ A_y=-5,\\ A_z=-12$.\nAt $Q(\\pi/2,\\pi/2)$: $B_x=0,\\ B_y=2,\\ B_z=-0.5\\pi$.\nSum $\\vec{C} = \\mathbf{-\\pi\\hat{x} - 3\\hat{y} - (12+0.5\\pi)\\hat{z}}$."}, {"id": "ph_q3", "src": "Midsem / Endsem", "level": "Midsem 2022 Q3-Q4", "q": "(a) Given $\\mathbf{A}=\\hat{x}+2\\hat{y},\\ \\mathbf{B}=-2\\hat{x}+\\hat{y}+3\\hat{z},\\ \\mathbf{C}=3\\hat{y}-\\hat{z}$, compute $(\\mathbf{A}\\times\\mathbf{B})\\cdot\\mathbf{C}$ &amp; check BAC-CAB. (b) Transform $P(r=8,\\theta=\\pi/6,\\phi=\\pi/3)$ and $\\mathbf{A}=2\\hat{r}+\\sqrt{3}\\hat{\\theta}-2\\hat{\\phi}$ to cylindrical coordinates.", "hint": "$A_\\rho = A_r\\sin\\theta + A_\\theta\\cos\\theta$, $A_z = A_r\\cos\\theta - A_\\theta\\sin\\theta$.", "sol": "(a) $\\mathbf{A}\\times\\mathbf{B} = 6\\hat{x}-3\\hat{y}+5\\hat{z} \\implies (\\mathbf{A}\\times\\mathbf{B})\\cdot\\mathbf{C} = -14$.\n(b) $\\rho = 8\\sin\\frac{\\pi}{6}=4,\\ \\phi=\\frac{\\pi}{3},\\ z=4\\sqrt{3}$; $A_\\rho=2.5,\\ A_\\phi=-2,\\ A_z=\\frac{\\sqrt{3}}{2}$."}, {"id": "ph_q4", "src": "Quiz / Lab", "level": "lect_6-7 Surface & Vol", "q": "Compute (a) volume of wedge $1 \\le \\rho \\le 2,\\ 0 \\le \\phi \\le \\pi/3,\\ -1 \\le z \\le 2$, and (b) closed surface area of hemispherical bowl $r=4,\\ 0\\le\\theta\\le\\pi/2$ (curved dome + flat equatorial base).", "hint": "Curved dome uses $r^2\\sin\\theta\\,d\\theta\\,d\\phi$; flat disk base is $\\pi r^2$.", "sol": "(a) $V = \\int_1^2 \\rho\\,d\\rho \\cdot \\frac{\\pi}{3}\\cdot 3 = \\frac{3}{2}\\pi = 1.5\\pi$.\n(b) Curved dome $2\\pi(4^2) = 32\\pi$, flat equator disk $\\pi(4^2) = 16\\pi \\implies \\text{Total } = 48\\pi$."}, {"id": "ph_q5", "src": "Midsem / Endsem", "level": "Midsem 2022 Q5-Q6", "q": "(a) For $T(x,y,z) = \\frac{x^3}{4\\sqrt{3}} + e^{-z}y^2$, find directional derivative at cylindrical $P(8,\\pi/6,6)$ toward origin. (b) Find unit normal to ellipsoid $x^2+2y^2+3z^2=6$ at $(1,1,1)$ (`lect_9`).", "hint": "$P=(4\\sqrt{3}, 4, 6)$, unit vector toward origin is $-P/|P|$; surface normal is $\\nabla f / |\\nabla f|$.", "sol": "(a) $\\nabla T(P) = (12\\sqrt{3},\\ 8e^{-6},\\ -16e^{-6})$; $\\hat{\\mathbf{u}} = (-0.4\\sqrt{3}, -0.4, -0.6) \\implies D_{\\hat{\\mathbf{u}}}T = -14.4 + 6.4e^{-6} = \\mathbf{-14.384}$.\n(b) $\\nabla f(1,1,1) = \\langle 2,4,6\\rangle \\implies \\hat{\\mathbf{n}} = \\frac{\\langle 1,2,3\\rangle}{\\sqrt{14}}$."}, {"id": "ph_q6", "src": "Midsem / Endsem", "level": "Midsem 2022 Q7", "q": "Verify Gauss's Divergence Theorem for $\\mathbf{v} = xy\\hat{x}+2yz\\hat{y}+3zx\\hat{z}$ over rectangular box $[0,2]\\times[0,2]\\times[0,1]$.", "hint": "Integrate $\\nabla\\cdot\\mathbf{v}=3x+y+2z$ over box and check the 3 nonzero outer faces ($x=2, y=2, z=1$).", "sol": "Volume: $\\int_0^2\\int_0^2\\int_0^1 (3x+y+2z)\\,dz\\,dy\\,dx = 20$.\nFaces: $4\\ (x=2) + 4\\ (y=2) + 12\\ (z=1) + 0+0+0 = 20$."}, {"id": "ph_q7", "src": "Midsem / Endsem", "level": "Midsem 2022 Q8", "q": "Verify Stokes' Theorem for $\\mathbf{F} = x^2 y\\hat{x}+2xy^2\\hat{y}$ on the unit square $0\\le x\\le 1,\\ 0\\le y\\le 1$ in $z=0$.", "hint": "Curl only has $z$-component $(2y^2-x^2)$; remember top edge $y=1$ integrates backward $x: 1\\to 0$!", "sol": "Surface $\\int_0^1\\int_0^1 (2y^2-x^2)\\,dx\\,dy = \\frac{2}{3}-\\frac{1}{3} = \\mathbf{\\frac{1}{3}}$.\nRim: $0 + \\int_0^1 2y^2 dy + \\int_1^0 x^2 dx + 0 = \\frac{2}{3}-\\frac{1}{3} = \\mathbf{\\frac{1}{3}}$."}, {"id": "ph_q8", "src": "Quiz / Lab", "level": "lect_10-13 Div/Curl Check", "q": "(a) Is $\\mathbf{F} = yz\\hat{x}+xz\\hat{y}+xy\\hat{z}$ solenoidal, conservative, or both? Find $\\phi$ if $\\mathbf{F}=\\nabla\\phi$. (b) Compute $\\nabla\\cdot(r^n\\hat{r})$ in spherical (`lect_13`).", "hint": "Check $\\nabla\\cdot\\mathbf{F}$ and $\\nabla\\times\\mathbf{F}$; use $\\frac{1}{r^2}\\frac{d}{dr}(r^{n+2})$.", "sol": "(a) $\\nabla\\cdot\\mathbf{F}=0$ AND $\\nabla\\times\\mathbf{F}=\\mathbf{0}$ (both!): $\\phi = xyz$.\n(b) $(n+2)r^{n-1}$ (for $n=-2$, $=0$ for $r\\ne 0$ and $4\\pi\\delta^3(\\mathbf{r})$ at origin!)."}, {"id": "ph_q9", "src": "Assignment / Tutorial", "level": "lect_14-15 Coulomb Disk & Line", "q": "(a) Find $E_z$ above a uniformly charged ring (radius $a$, $\\lambda$) and derive the large-disk limit ($R \\to \\infty$) to recover the infinite sheet $\\sigma/(2\\epsilon_0)$. (b) Find force per unit charge at $P(0,0,5)$ above square loop $[-1,1]\\times[-1,1]$ (`lect_15`).", "hint": "Use horizontal symmetry cancellation; take $R\\to\\infty$ in the disk formula.", "sol": "Ring: $E_z = \\frac{\\lambda a z}{2\\epsilon_0(a^2+z^2)^{3/2}}$; Disk: $E_z = \\frac{\\sigma}{2\\epsilon_0}\\left(1 - \\frac{z}{\\sqrt{z^2+R^2}}\\right) \\xrightarrow{R\\to\\infty} \\frac{\\sigma}{2\\epsilon_0}$!"}, {"id": "ph_q10", "src": "Assignment / Tutorial", "level": "Assignment-1 Q1 & lect_16", "q": "(a) Spherical shell $a < r < b$ has $\\rho = k/r^2$: find $\\mathbf{E}$ in all 3 regions ($r<a,\\ a<r<b,\\ r>b$). (b) Infinite coaxial cylinder has $\\rho_0$ inside $s<a$ and opposing $\\sigma$ on $s=b$: find $\\sigma$ so $\\mathbf{E}(s>b)=0$.", "hint": "$d\\tau = 4\\pi r^2 dr$ cancels $1/r^2$ cleanly! Set total linear charge $\\lambda_{\\text{tot}}=0$ in (b).", "sol": "(a) $r<a$: $0$; $a<r<b$: $Q_{\\text{enc}} = 4\\pi k(r-a) \\implies E = \\frac{k(r-a)}{\\epsilon_0 r^2}\\hat{r}$; $r>b$: $\\frac{k(b-a)}{\\epsilon_0 r^2}\\hat{r}$.\n(b) $\\pi a^2\\rho_0 + 2\\pi b \\sigma = 0 \\implies \\sigma = -\\frac{\\rho_0 a^2}{2b}$."}, {"id": "ph_q11", "src": "Assignment / Tutorial", "level": "lect_17-18 Potential & Laplace", "q": "(a) Compute $V(r)$ from center $r=0$ to $\\infty$ for uniformly charged sphere $(R, Q)$. (b) Solve Laplace's eq $\\nabla^2 V = 0$ for concentric spheres $V(a)=V_0,\\ V(b)=0$.", "hint": "Integrate $\\mathbf{E}_{\\text{out}}$ from $\\infty\\to R$ first, then add $-\\int_R^r \\mathbf{E}_{\\text{in}}\\cdot dr$.", "sol": "(a) $r\\ge R$: $\\frac{Q}{4\\pi\\epsilon_0 r}$; $r<R$: $V(r) = \\frac{Q}{8\\pi\\epsilon_0 R}\\left(3 - \\frac{r^2}{R^2}\\right)$ (center $V(0)=\\frac{3}{2}V(R)$!).\n(b) $\\frac{d}{dr}(r^2\\frac{dV}{dr})=0 \\implies V(r) = V_0\\frac{a}{b-a}\\left(\\frac{b}{r}-1\\right)$."}, {"id": "ph_q12", "src": "Quiz / Lab", "level": "lect_19 Dipoles & Field Energy", "q": "(a) Dipole $\\mathbf{p}=2\\hat{z}\\text{ nC}\\cdot\\text{m}$ sits at origin in uniform $\\mathbf{E}=3\\hat{x}+4\\hat{y}$: find torque $\\mathbf{N}$ and far potential at $(r=2, \\theta=60^\\circ)$. (b) Compare electrostatic energy $W$ of two shells vs merged field.", "hint": "$\\mathbf{N} = \\mathbf{p}\\times\\mathbf{E}$; cross term $\\epsilon_0\\int\\mathbf{E}_1\\cdot\\mathbf{E}_2 d\\tau$ violates additivity!", "sol": "(a) $\\mathbf{N} = 2\\hat{z}\\times(3\\hat{x}+4\\hat{y}) = -8\\hat{x}+6\\hat{y}\\text{ nN}\\cdot\\text{m}$; $V = \\frac{2\\times 10^{-9}\\cos 60^\\circ}{4\\pi\\epsilon_0 (4)} = 2.25\\text{ V}$.\n(b) $W = W_1+W_2+\\epsilon_0\\int\\mathbf{E}_1\\cdot\\mathbf{E}_2\\,d\\tau$."}, {"id": "ph_q13", "src": "Quiz / Lab", "level": "lect_20 Conductors & Shielding", "q": "A thick uncharged spherical conductor shell (inner $a$, outer $b$) contains off-center $+q$ inside its cavity AND is surrounded far away by $+Q_{\\text{ext}}$. Which surface charges ($\\sigma_a$ or $\\sigma_b$) stay uniform vs non-uniform, and why?", "hint": "$+q$ is off-center inside cavity; conductor skin shields interior from outer $Q_{\\text{ext}}$!", "sol": "$\\sigma_a$ is **non-uniform** (total $-q$, concentrated closest to off-center $+q$). However $\\mathbf{E}=0$ inside metal isolates inside from outside: so induced outer charge $+q$ spreads **uniformly** if $Q_{\\text{ext}}$ absent (or distorts under $Q_{\\text{ext}}$ while keeping total $+q$)!"}, {"id": "ph_q14", "src": "Assignment / Tutorial", "level": "Assignment-1 Q4 (Polarized Sphere)", "q": "A dielectric sphere of radius $R$ carries frozen polarization $\\mathbf{P}(\\mathbf{r}) = k\\mathbf{r}$ ($k$ constant, $\\rho_f = 0$). Find $\\rho_b$, $\\sigma_b$, $\\mathbf{E}_{\\text{in}}$, and $\\mathbf{E}_{\\text{out}}$.", "hint": "Verify net bound charge $=0$; then radial symmetry gives $\\mathbf{D}=\\mathbf{0}$ everywhere!", "sol": "$\\rho_b = -\\nabla\\cdot(k\\mathbf{r}) = -3k$; $\\sigma_b = \\mathbf{P}(R)\\cdot\\hat{r} = kR$.\nSince $\\rho_f=0$, $\\mathbf{D}=\\mathbf{0} \\implies \\mathbf{E}_{\\text{in}} = -\\frac{k\\mathbf{r}}{\\epsilon_0}$, $\\mathbf{E}_{\\text{out}} = \\mathbf{0}$."}, {"id": "ph_q15", "src": "Assignment / Tutorial", "level": "Assignment-1 Q6", "q": "Determine relative permittivity $\\epsilon_r$ in 3 cases: (a) $A=0.12\\text{ m}^2, d=80\\,\\mu\\text{m}, V=12\\text{ V}, W=1\\,\\mu\\text{J}$; (b) $u=100\\text{ J/m}^3, V=200\\text{ V}, d=45\\,\\mu\\text{m}$; (c) $E=200\\text{ kV/m}, \\sigma=20\\,\\mu\\text{C/m}^2$.", "hint": "$W=\\frac{1}{2}CV^2,\\ u=\\frac{1}{2}\\epsilon E^2,\\ \\sigma=D=\\epsilon E$.", "sol": "(a) $\\epsilon_r = 1.046$; (b) $E=4.444\\times 10^6 \\implies \\epsilon_r = 1.143$; (c) $\\epsilon_r = \\frac{20\\times 10^{-6}}{8.854\\times 10^{-12}\\times 2\\times 10^5} = 11.29$."}, {"id": "ph_q16", "src": "Quiz / Lab", "level": "lect_22 Prob 3 & Boundaries", "q": "(a) Derive capacitance of spherical capacitor $(a<b)$ filled half with $\\epsilon_1$ ($\\phi\\in[0,\\pi]$) and half with $\\epsilon_2$. (b) Across $z=0$ ($\\sigma_f=0$, $\\epsilon_{r1}=2,\\ \\epsilon_{r2}=5$), $\\mathbf{E}_1 = 3\\hat{x}+4\\hat{y}+10\\hat{z}$: find $\\mathbf{E}_2$.", "hint": "Parallel half-capacitors in (a)! Match $E_{\\parallel}$ and $D_\\perp$ in (b).", "sol": "(a) $C = C_1 + C_2 = \\mathbf{\\frac{2\\pi(\\epsilon_1+\\epsilon_2)ab}{b-a}}$.\n(b) $E_{2x}=3, E_{2y}=4$; $2(10)=5 E_{2z} \\implies E_{2z}=4 \\implies \\mathbf{E}_2 = 3\\hat{x}+4\\hat{y}+4\\hat{z}$."}, {"id": "ph_q17", "src": "Quiz / Lab", "level": "lect_24-25 Lorentz & Continuity", "q": "(a) Electron ($m=9.11\\times 10^{-31}\\text{ kg}$) enters $\\mathbf{E}=10^4\\hat{y}\\text{ V/m}$ &amp; $\\mathbf{B}=0.02\\hat{z}\\text{ T}$ undeflected along $+\\hat{x}$: find speed $v$. (b) Given $\\mathbf{J} = \\frac{10^3 e^{-2t}}{r^2}\\hat{r}$, find $\\frac{\\partial\\rho}{\\partial t}$ at $r>0$ (`lect_25`).", "hint": "Force balance $qE = qvB$; cylindrical/spherical divergence of $1/r^2$ away from $0$!", "sol": "(a) $v = E/B = 10^4/0.02 = 5\\times 10^5\\text{ m/s}$.\n(b) $\\frac{\\partial\\rho}{\\partial t} = -\\nabla\\cdot\\mathbf{J} = 0$ for $r>0$ (charge leaves origin at $-4\\pi(10^3)e^{-2t}$)."}, {"id": "ph_q18", "src": "Assignment / Tutorial", "level": "Assignment-2 Q1 & lect_26", "q": "Find $\\mathbf{B}$ at center of a regular square current loop of side $L$ carrying steady current $I$ CCW in $xy$-plane.", "hint": "Each of 4 sides has $s=L/2$ and angles $\\theta_1=-45^\\circ,\\ \\theta_2=+45^\\circ$!", "sol": "One side: $B_1 = \\frac{\\mu_0 I}{4\\pi(L/2)}(\\sin 45^\\circ - \\sin(-45^\\circ)) = \\frac{\\mu_0 I\\sqrt{2}}{2\\pi L}$.\nFour sides add along $+\\hat{z}$: $\\mathbf{B}_{\\text{tot}} = \\mathbf{\\frac{2\\sqrt{2}\\,\\mu_0 I}{\\pi L}\\hat{z}}$."}, {"id": "ph_q19", "src": "Assignment / Tutorial", "level": "lect_26-27 Parallel Wires & Sheets", "q": "(a) Two infinite parallel current sheets carry $\\mathbf{K}_1=+K\\hat{x}$ ($z=+a$) and $\\mathbf{K}_2=-K\\hat{x}$ ($z=-a$). Find $\\mathbf{B}$ in all 3 regions ($z>a,\\ |z|<a,\\ z<-a$). (b) Two wires $10\\text{ cm}$ apart carry $15\\text{ A}$ &amp; $20\\text{ A}$ in opposite directions: find force/m.", "hint": "$B_{\\text{sheet}} = \\frac{1}{2}\\mu_0(\\mathbf{K}\\times\\hat{\\mathbf{n}})$; opposite currents repel!", "sol": "(a) Fields cancel for $z>a$ and $z<-a$ ($\\mathbf{B}=\\mathbf{0}$), and add between plates: $|z|<a \\implies \\mathbf{B} = \\mathbf{-\\mu_0 K\\hat{y}}$ (check $+\\hat{x}\\times(-\\hat{z})=+\\hat{y}$ vs sheet normal!). Magnitude is $\\mu_0 K$ inside, $0$ outside.\n(b) $f = \\frac{4\\pi\\times 10^{-7}(15)(20)}{2\\pi(0.1)} = \\mathbf{6\\times 10^{-4}\\text{ N/m}}$ (repulsive)."}, {"id": "ph_q20", "src": "Quiz / Lab", "level": "lect_27-28 Coax, Toroid & Vector A", "q": "(a) Derive $B(s)$ inside &amp; outside a toroid ($N$ turns, inner $a$, outer $b$, current $I$). (b) Verify if $\\mathbf{A} = \\frac{1}{2}(\\mathbf{B}_0\\times\\mathbf{r})$ yields constant $\\mathbf{B}_0$ &amp; satisfies $\\nabla\\cdot\\mathbf{A}=0$.", "hint": "Amperian circle of radius $s$ inside toroid encloses $NI$; expand $\\nabla\\times(\\mathbf{B}_0\\times\\mathbf{r})$ with BAC-CAB!", "sol": "(a) Inside ($a<s<b$): $B = \\frac{\\mu_0 N I}{2\\pi s}\\hat{\\phi}$; elsewhere ($s<a$ or $s>b$): $B=0$.\n(
