$a_1=\\sqrt{2},\\ a_n=\\sqrt{2+\\sqrt{a_{n-1}}}$.", "hint": "In (a) $r_{n} = 1 + 1/r_{n-1}$; in (b) prove bounded above by $2$ and increasing.", "sol": "(a) Passing $r_n = a_{n+1}/a_n = 1 + 1/r_{n-1}$ gives $L = 1 + 1/L \\implies L^2 - L - 1 = 0 \\implies L = \\frac{1+\\sqrt{5}}{2}$ (alternating contractions $r_{2k} \\uparrow L, r_{2k+1} \\downarrow L$).\n(b) Since $a_1=\\sqrt{2} < 2$, if $a_{n-1} < 2$ then $a_n < \\sqrt{2+\\sqrt{2}} < 2$; also $a_2 = \\sqrt{2+2^{1/4}} > a_1$ and by induction $a_n$ increases to root $L$ of $L = \\sqrt{2+\\sqrt{L}}$ ($L \\approx 1.831$)."}, {"id": "ma_q6", "src": "Midsem / Endsem", "level": "CAL-Midsem Q3-5", "q": "(a) Construct nonzero-term series summing to $0$ and $\\pi^2$. (b) Test $\\sum \\sin(1/n)$ and $\\sum \\cos(1/n)$.", "hint": "Recall Basel sum $\\sum_{n=1}^\\infty 1/n^2 = \\pi^2/6$, and LCT with $1/n$ for $\\sin(1/n)$.", "sol": "(a) Sum $0$: $-2 + \\sum_{n=0}^\\infty (1/2)^n = 0$. Sum $\\pi^2$: $\\sum_{n=1}^\\infty \\frac{6}{n^2} = \\pi^2$ (or $\\pi^2 - 2 + \\sum (1/2)^n$).\n(b) $\\frac{\\sin(1/n)}{1/n} \\to 1 \\implies \\sum \\sin(1/n)$ diverges by LCT with harmonic series; $\\cos(1/n) \\to 1 \\ne 0 \\implies$ diverges by $n$-th term test."}, {"id": "ma_q7", "src": "Midsem / Endsem", "level": "CAL-Midsem Q6", "q": "Does $\\sum a_n$ converge where $a_n = n/2^n$ if $n$ is prime, and $1/2^n$ otherwise?", "hint": "Ratio test fails; sandwich $a_n^{1/n}$ and apply Cauchy's Root Test.", "sol": "$\\frac{1}{2^n} \\le a_n \\le \\frac{n}{2^n} \\implies \\frac{1}{2} \\le a_n^{1/n} \\le \\frac{n^{1/n}}{2} \\to \\frac{1}{2}$.\nBy Sandwich & Root Test ($\\lim a_n^{1/n} = 1/2 < 1$), $\\sum a_n$ converges absolutely."}, {"id": "ma_q8", "src": "Midsem / Endsem", "level": "Midsem 2022 Q5-7", "q": "(a) Discuss $\\sum_{n=2}^\\infty \\frac{1}{(\\ln n)^p}$ and $\\sum_{n=27}^\\infty \\frac{(-1)^{n+1}}{\\ln(\\ln n)}$. (b) Prove: $\\sum a_n$ div $\\implies \\sum|a_n|$ div; $\\sum a_n$ conv ($a_n\\ge 0$) $\\implies \\sum a_n^2$ conv.", "hint": "Compare $(\\ln n)^p < n$ eventually; use contrapositive of Abs Conv $\\implies$ Conv.", "sol": "(a) $(\\ln n)^p/n \\to 0 \\implies 1/(\\ln n)^p > 1/n$ eventually $\\implies$ diverges for ALL $p \\in \\mathbb{R}$. Alternating $1/\\ln(\\ln n) \\downarrow 0 \\implies$ converges conditionally (compare $|a_n| > 1/n$).\n(b) If $\\sum |a_n|$ converged then $\\sum a_n$ would converge (contradiction!). Since $a_n \\to 0 \\implies a_n < 1$ eventually $\\implies a_n^2 \\le a_n \\implies \\sum a_n^2$ converges by Comparison."}, {"id": "ma_q9", "src": "Assignment / Tutorial", "level": "Problem Set 2 Q1-3", "q": "(a) Find $r$ &amp; sum for $1 + 2r + r^2 + 2r^3 + r^4 + \\dots$. (b) Test $\\sum_{n=2}^\\infty \\frac{1}{n\\ln n(\\ln\\ln n)^p}$ and $\\sum \\left(\\frac{2^2}{1^2}-\\frac{2}{1}\\right)^{-1} + \\left(\\frac{3^3}{2^3}-\\frac{3}{2}\\right)^{-2} + \\dots$.", "hint": "Group pairs $(1+2r)r^{2k}$ in (a); Integral Test $u=\\ln\\ln x$ &amp; Root Test in (b).", "sol": "(a) Converges iff $|r|<1$; sum $= (1+2r)\\sum_{k=0}^\\infty r^{2k} = \\frac{1+2r}{1-r^2}$.\n(b) Integral $\\int_3^\\infty \\frac{du}{u^p}$ (with $u=\\ln\\ln x$) converges iff $p>1$. Second series term $u_n = \\left[\\left(\\frac{n+1}{n}\\right)^{n+1} - \\frac{n+1}{n}\\right]^{-n}$ satisfies $u_n^{1/n} = \\left[\\left(1+\\frac{1}{n}\\right)^n\\left(1+\\frac{1}{n}\\right) - \\left(1+\\frac{1}{n}\\right)\\right]^{-1} \\to \\frac{1}{e-1} < 1 \\implies$ Converges by Root Test!"}, {"id": "ma_q10", "src": "Assignment / Tutorial", "level": "Problem Set 3 Q7-19", "q": "(a) Find $N$ so $\\sum_{n=1}^N \\frac{1}{n^4}$ approximates $\\sum_{n=1}^\\infty \\frac{1}{n^4}$ within $\\pm 0.005$, and $N$ for $\\sum_{n=1}^\\infty \\frac{(-1)^{n-1}}{n^3}$ within $10^{-4}$. (b) Classify $\\sum_{n=1}^\\infty \\frac{(-1)^{n-1}\\tan^{-1}n}{n}$.", "hint": "Integral remainder $\\frac{1}{3N^3} < 0.005$ vs AST remainder $(N+1)^{-3} < 10^{-4}$.", "sol": "(a) $R_N \\le \\int_N^\\infty x^{-4}dx = \\frac{1}{3N^3} < 0.005 \\iff N^3 > 66.67 \\implies N = 5$. For AST: $(N+1)^{-3} < 10^{-4} \\iff N+1 \\ge 22 \\implies N = 21$.\n(b) Decreases to $0 \\implies$ converges by AST; $|\\tan^{-1}n|/n \\ge \\frac{\\pi/4}{n} \\implies$ Conditionally Convergent."}, {"id": "ma_q11", "src": "Midsem / Endsem", "level": "Endsem 2023 Q5", "q": "Evaluate the exact infinite sum $\\sum_{n=0}^\\infty \\frac{n^2}{2^n}$.", "hint": "Differentiate $\\frac{1}{1-x} = \\sum x^n$, multiply by $x$, repeat once, plug $x=1/2$.", "sol": "$\\sum x^n = (1-x)^{-1} \\implies \\sum n x^n = x(1-x)^{-2} \\implies \\sum n^2 x^n = \\frac{x(1+x)}{(1-x)^3}$.\nAt $x = 1/2$: $\\frac{(1/2)(3/2)}{(1/2)^3} = 6$."}, {"id": "ma_q12", "src": "Midsem / Endsem", "level": "Midsem 2022 Q9-10 & CAL-M Q9-10", "q": "Find power series &amp; IOC: (a) $\\frac{x^{123}}{x^2-2x+1}$ at $0$; (b) $\\sum_{n=1}^\\infty \\frac{x^n}{n^{10}}$; (c) $\\sum_{n=0}^\\infty \\frac{(x-1)^{2n}}{4^n}$ (`Endsem_21`); (d) $\\frac{(3x-2)^n}{n\\,5^n}$ (`PS2`).", "hint": "Identify $(1-x)^{-2}$ in (a), $p=10$ at $\\pm 1$ in (b), $|x-1|^2 < 4$ in (c).", "sol": "(a) $x^{123}(1-x)^{-2} = \\sum_{n=0}^\\infty (n+1)x^{n+123}$, IOC $(-1, 1)$.\n(b) $R=1$; abs conv on $[-1, 1]$, no conditional points.\n(c) $|x-1|<2 \\implies (-1, 3)$, sum $\\frac{4}{4-(x-1)^2}$, diverges at $-1, 3$.\n(d) $R=5/3$ centered at $2/3$: open $(-1, 7/3)$; at $x=-1$ $\\sum (-1)^n/n$ conv, at $x=7/3$ $\\sum 1/n$ div $\\implies [-1, 7/3)$."}, {"id": "ma_q13", "src": "Assignment / Tutorial", "level": "Problem Set 4 A-Q1..Q4", "q": "(a) Test $\\sum \\left[x + \\frac{a-b}{2!}x^2 + \\frac{(a-b)(a-2b)}{3!}x^3 + \\dots\\right]$; (b) IOC of $\\sum_{n=2}^\\infty \\frac{(x+2)^n}{\\ln n}$ &amp; $\\frac{1}{2}x + \\frac{1\\cdot 3}{2\\cdot 5}x^2 + \\frac{1\\cdot 3\\cdot 5}{2\\cdot 5\\cdot 8}x^3 + \\dots$; (c) Taylor of $\\cos(2x+\\pi/2)$ at $\\pi/4$ &amp; $\\frac{x}{1+2x+x^2}$ at $0$.", "hint": "Use Ratio Test $|u_{n+1}/u_n|$ and shift $t = x - \\pi/4$.", "sol": "(a) Ratio $|\\frac{a-nb}{n+1}x| \\to |bx| \\implies$ conv if $|x|<1/|b|$ (or all $x$ if $b=0$).\n(b) $\\frac{(x+2)^n}{\\ln n}$ has IOC $[-3, -1)$; Ratio for $\\frac{1\\cdot3\\cdots(2n-1)}{2\\cdot5\\cdots(3n-1)}x^n$ is $\\frac{2n+1}{3n+2}|x| \\to \\frac{2}{3}|x| \\implies R = 3/2$ (diverges at $\\pm 3/2$ as $a_n \\not\\to 0$).\n(c) $\\cos(2t+\\pi) = -\\cos(2t) = -\\sum_{n=0}^\\infty \\frac{(-1)^n 2^{2n}(x-\\pi/4)^{2n}}{(2n)!}$; $\\frac{x}{(1+x)^2} = \\sum_{n=1}^\\infty (-1)^{n-1} n x^n$ ($|x|<1$)."}, {"id": "ma_q14", "src": "Assignment / Tutorial", "level": "Assignment 1 Q10, 15c, 18-20", "q": "(a) Solve $1 + e^b + e^{2b} + \\dots = 9$. (b) IOC of $\\sum_{n=1}^\\infty \\left(\\frac{n}{n+1}\\right)^{n^2} x^n$. (c) Maclaurin of $\\sin^2 x$ &amp; $\\tan^{-1}(3x^4)$.", "hint": "Geometric ratio $r=e^b<1$ in (a); Cauchy Root Test in (b); substitute in (c).", "sol": "(a) $\\frac{1}{1-e^b} = 9 \\implies e^b = \\frac{8}{9} \\implies b = \\ln(8/9) < 0$.\n(b) Root Test: $\\left(\\frac{n}{n+1}\\right)^n |x| \\to \\frac{|x|}{e} < 1 \\implies R = e$, div at $\\pm e \\implies (-e, e)$.\n(c) $\\sin^2 x = \\sum_{n=1}^\\infty \\frac{(-1)^{n-1}2^{2n-1}}{(2n)!}x^{2n}$; $\\tan^{-1}(3x^4) = \\sum_{n=0}^\\infty (-1)^n \\frac{3^{2n+1} x^{8n+4}}{2n+1}$ ($|x| \\le 3^{-1/4}$)."}, {"id": "ma_q15", "src": "Midsem / Endsem", "level": "Endsem_21 Q2b & CAL-M Q8", "q": "(a) Find IOC and exact sum of $\\sum_{n=0}^\\infty (\\ln x)^n$. (b) Prove if $\\sum a_n x^n$ converges at $c\\ne 0$, it converges absolutely for $|x|<|c|$.", "hint": "Geometric series converges iff $|\\ln x| < 1$. Use $|a_n c^n|<1$ eventually in (b).", "sol": "(a) $|\\ln x| < 1 \\iff e^{-1} < x < e$, with exact sum $\\frac{1}{1-\\ln x}$.\n(b) $a_n c^n \\to 0 \\implies \\exists N: |a_n|<1/|c|^n\\ \\forall n \\ge N \\implies |a_n x^n| < |x/c|^n$ (geometric $|x/c|<1 \\implies$ converges!)."}, {"id": "ma_q16", "src": "Midsem / Endsem", "level": "Endsem 2023 Q4 & Quotient PDF", "q": "(a) Prove harmonic divergence in 3 ways. (b) State and prove the Quotient Rule for sequences: $a_n \\to a,\\ b_n \\to b\\ne 0 \\implies \\frac{a_n}{b_n} \\to \\frac{a}{b}$.", "hint": "In (b), first choose $N_1$ using $\\epsilon' = |b|/2$ so $|b_n| > |b|/2$.", "sol": "(a) 1) Integral $\\int_1^\\infty dx/x = \\infty$; 2) Oresme $1 + 1/2 + (1/3+1/4)+\\dots > \\sum 1/2$; 3) Cauchy $S_{2n}-S_n \\ge 1/2 \\not\\to 0$.\n(b) $|b_n - b| < |b|/2 \\implies |b_n| > |b|/2$. Then $\\left|\\frac{a_n}{b_n}-\\frac{a}{b}\\right| \\le \\frac{2}{|b|}|a_n-a| + \\frac{2|a|}{|b|^2}|b_n-b|$; make each $<\\epsilon/2$ via $N_2, N_3$ and set $N=\\max(N_1, N_2, N_3)$."}, {"id": "ma_q17", "src": "Midsem / Endsem", "level": "Endsem_21 Q3 & Problem Set 4 B", "q": "Prove via $\\epsilon$-$\\delta$: (a) $\\lim_{x\\to 3}(x^2+2x) = 15$; (b) $\\lim_{x\\to 2}\\frac{x^3-4}{x^2+1}=\\frac{4}{5}$; (c) Evaluate $\\lim_{x\\to 0}\\frac{1-2\\cos x+\\cos 2x}{x^2}$.", "hint": "Assume $\\delta \\le 1$ first; expand cosines in (c).", "sol": "(a) $\\delta = \\min(1, \\epsilon/9)$ since $|x-3|<1 \\implies |x+5|<9$.\n(b) $\\frac{|x-2||5x^2+6x+12|}{5(x^2+1)} \\le \\frac{75}{10}|x-2|$ for $|x-2|<1 \\implies \\delta = \\min(1, 2\\epsilon/15)$.\n(c) $\\frac{1 - 2(1-x^2/2) + (1-2x^2) + O(x^4)}{x^2} \\to -1$."}, {"id": "ma_q18", "src": "Assignment / Tutorial", "level": "Assignment 2 Q10 & Q14 & PS4 C", "q": "(a) Find $a, b, c$ so $\\lim_{x\\to 0}\\frac{x(a+b\\cos x)+c\\sin x}{x^5} = \\frac{1}{60}$. (b) Discuss continuity of $g(x)=2x$ ($x\\in\\mathbb{Q}$), $x+3$ ($x\\notin\\mathbb{Q}$).", "hint": "Use Maclaurin up to $x^5$ in (a); equate branches in (b).", "sol": "(a) $x^1: a+b+c=0$, $x^3: -b/2-c/6=0 \\implies c=-3b, a=2b$; $x^5: b/24 + c/120 = b/60 = 1/60 \\implies b=1, c=-3, a=2$.\n(b) Continuous ONLY at $x = 3$ where $2(3) = 3+3 = 6$."}, {"id": "ma_q19", "src": "Midsem / Endsem", "level": "Endsem 2023 Q7-8 & PS5 Q6", "q": "(a) Show $x\\sin(1/x)$ is continuous at $0$ (not diff) while $x^2\\sin(1/x)$ IS diff at $0$. (b) Find $m$ so $x^m\\sin(1/x)$ has continuous derivative at $0$. (c) Prove $(u/v)' = (v u' - u v')/v^2$.", "hint": "Check $|g(h)/h| = |h\\sin(1/h)| \\to 0$ vs $\\lim_{x\\to 0} f'(x)$ for $m>2$.", "sol": "(a) $|x\\sin(1/x)|\\le |x|\\to 0$ (cont), $\\lim_{h\\to 0} (x\\sin(1/x))/x = \\sin(1/h)$ DNE; $\\lim_{h\\to 0} h\\sin(1/h) = 0$ (diff!).\n(b) $f'(x) = m x^{m-1}\\sin(1/x) - x^{m-2}\\cos(1/x) \\to 0 = f'(0)$ iff $m > 2$.\n(c) Write $\\frac{u(x+h)v(x) - u(x)v(x) + u(x)v(x) - u(x)v(x+h)}{h\\,v(x+h)v(x)} \\to \\frac{u'v - uv'}{v^2}$."}, {"id": "ma_q20", "src": "Assignment / Tutorial", "level": "Assignment 2 Q3 & Q7", "q": "(a) Find discontinuities of $f(x)=\\lim_{n\\to\\infty}\\frac{(1+\\sin\\pi x)^n - 1}{(1+\\sin\\pi x)^n + 1}$. (b) Prove between any two roots of $e^x\\cos x + 1 = 0$ lies a root of $e^x\\sin x + 1 = 0$.", "hint": "Check sign of $\\sin\\pi x$: $>0$, $=0$, or $<0$; for Rolle's Theorem in (b), construct $F(x) = \\cos x + e^{-x}$.", "sol": "(a) If $\\sin\\pi x > 0$, base $>1 \\implies f=1$; if $\\sin\\pi x = 0$ ($x\\in\\mathbb{Z}$), $f=0$; if $-1 \\le \\sin\\pi x < 0$, base $\\in [0,1) \\implies f=-1$. Discontinuous at $x = k\\in\\mathbb{Z}$ (note at $\\sin\\pi x = -1$: $0 \\implies -1$ still).\n(b) Let $F(x) = \\cos x + e^{-x}$. Since $F(x) = e^{-x}(e^x\\cos x + 1)$, any two consecutive roots $a < b$ of $e^x\\cos x + 1 = 0$ satisfy $F(a)=F(b)=0$. By Rolle's Theorem, $\\exists\\,c\\in(a,b)$ with $F'(c) = -\\sin c - e^{-c} = -e^{-c}(e^c\\sin c + 1) = 0 \\implies e^c\\sin c + 1 = 0$!"}, {"id": "ma_q21", "src": "Assignment / Tutorial", "level": "Rolle & Cauchy PDF", "q": "(a) Prove $x < \\sin^{-1} x < \\frac{x}{\\sqrt{1-x^2}}$ ($0<x<1$). (b) Find local/global extrema of $f(x) = (\\sin x)^{\\sin x}$ ($0<x<\\pi$).", "hint": "LMVT on $\\sin^{-1} t$ over $[0,x]$; differentiate $\\ln f = \\sin x\\ln(\\sin x)$ in (b).", "sol": "(a) $\\frac{\\sin^{-1}x}{x} = \\frac{1}{\\sqrt{1-c^2}}$ ($0<c<x$), bounded between $1$ and $1/\\sqrt{1-x^2}$.\n(b) $f' = f\\cos x(\\ln\\sin x + 1) = 0 \\implies \\cos x=0$ ($x=\\pi/2$: max $1$) or $\\sin x = 1/e$ (min $(1/e)^{1/e}$)."}, {"id": "ma_q22", "src": "Midsem / Endsem", "level": "Endsem 2023 Q10-11 & Endsem_21 Q6", "q": "(a) Critical pts &amp; abs extrema of $f(x)=|x|$ ($[-\\pi,0)$) and $\\sin x$ ($[0,\\pi]$). (b) Same for $g(x)=3x^{2/3}$ on $[-27, 8]$. (c) State &amp; prove First Derivative Theorem for Local Extrema.", "hint": "Never miss cusp critical points where $f'(c)$ DNE!", "sol": "(a) Critical at $0$ (LHD $-1 \\ne$ RHD $+1$) &amp; $\\pi/2$. Max $= \\pi$ (at $-\\pi$), Min $= 0$ (at $0, \\pi$).\n(b) $g'(x)=2x^{-1/3}$ DNE at $0$! Check $-27\\to 27$, $0\\to 0$, $8\\to 12 \\implies$ Max $= 27$, Min $= 0$.\n(c) At local max $c\\in(a,b)$, $\\frac{f(c+h)-f(c)}{h}$ is $\\le 0$ for $h>0$ and $\\ge 0$ for $h<0 \\implies f'(c)=0$."}, {"id": "ma_q23", "src": "Assignment / Tutorial", "level": "Problem Set 5 Q9-12 & Cauchy MVT", "q": "(a) Prove $\\frac{v-u}{1+v^2} < \\tan^{-1}v - \\tan^{-1}u < \\frac{v-u}{1+u^2}$ ($0<u<v$). (b) Prove Cauchy MVT using $h(x) = [f(b)-f(a)]g(x) - [g(b)-g(a)]f(x)$ (`Endsem_21 Q5`).", "hint": "Apply Rolle to $h(x)$ after verifying $h(a) = h(b)$!", "sol": "(a) Apply LMVT to $\\tan^{-1}t$ on $[u,v]$: $\\frac{\\tan^{-1}v-\\tan^{-1}u}{v-u} = \\frac{1}{1+c^2}$ with $\\frac{1}{1+v^2} < \\frac{1}{1+c^2} < \\frac{1}{1+u^2}$.\n(b) Compute $h(b)-h(a) = [f(b)-f(a)][g(b)-g(a)] - [g(b)-g(a)][f(b)-f(a)] = 0$. By Rolle, $h'(c)=0 \\implies \\frac{f'(c)}{g'(c)} = \\frac{f(b)-f(a)}{g(b)-g(a)}$."}, {"id": "ma_q24", "src": "Midsem / Endsem", "level": "Endsem_21 Q7-8 & 04_Riemann", "q": "(a) Prove $\\underline{\\int_a^b} f \\le \\overline{\\int_a^b} f$. (b) Prove $f(x)=x^2$ is Riemann integrable on $[1,3]$ via uniform $P_n$ and find $\\int_1^3 x^2\\,dx$.", "hint": "Use common refinement $Q = P_1 \\cup P_2$ in (a); $\\Delta x = 2/n,\\ x_k = 1 + 2k/n$ in (b).", "sol": "(a) $L(P_1,f) \\le L(Q,f) \\le U(Q,f) \\le U(P_2,f) \\implies \\sup L \\le \\inf U$.\n(b) $U-L = \\frac{2}{n}(3^2-1^2) = \\frac{16}{n} < \\epsilon$ for $n > 16/\\epsilon$. $\\lim L(P_n,f) = \\lim R(P_n,f) = \\frac{27-1}{3} = \\frac{26}{3}$."}, {"id": "ma_q25", "src": "Midsem / Endsem", "level": "Endsem 2023 Q12-14 & Assignment 2 Q18", "q": "(a) State &amp; prove FTC Part 2 ($\\int_a^b f = F(b)-F(a)$). (b) Evaluate $\\lim_{n\\to\\infty}\\sum_{k=1}^n \\frac{1}{n+k}$. (c) If $f(x)=\\begin{cases}1&x\\in\\mathbb{Q}\\\\-1&x\\notin\\mathbb{Q}\\end{cases}$ on $[0,1]$, check $f$ and $|f|$ integrability.", "hint": "Use MVT on $F$ over $[x_{i-1},x_i]$ in (a); $|f| \\equiv 1$ in (c)!", "sol": "(a) Given $U(P,f)-L(P,f)<\\epsilon$, MVT gives $F(b)-F(a)=\\sum f(t_i)\\Delta x_i \\in [L, U]$, so $|F(b)-F(a)-\\int_a^b f| < \\epsilon$.\n(b) $\\frac{1}{n}\\sum_{k=1}^n \\frac{1}{1+k/n} \\to \\int_0^1 \\frac{dx}{1+x} = \\ln 2$.\n(c) $\\underline{\\int} f = -1 \\ne +1 = \\overline{\\int} f$ (NOT integrable), while $|f| \\equiv 1 \\implies$ integrable with $\\int_0^1 |f| = 1$!"}, {"id": "ma_q26", "src": "Assignment / Tutorial", "level": "Tutorial 3 RI", "q": "(a) Compute $\\int_0^3 (x^2+1)\\,dx$ and $\\int_{-1}^0 (x^2-x^3)\\,dx$ by Riemann sums. (b) If $\\int_0^{x^2} f(t)\\,dt = x\\cos(\\pi x)$, find $f(4)$.", "hint": "Right endpoints: $x_k = 3k/n$ for $[0,3]$; differentiate (b) using Chain Rule!", "sol": "(a1) $3\\cdot \\frac{1}{n}\\sum (\\frac{9k^2}{n^2}+1) \\to 9+3 = 12$. (a2) $[(-1)^3(-1/3)^0]\\dots = \\frac{1}{3} + \\frac{1}{4} = \\frac{7}{12}$ via $\\Delta x = 1/n,\\ c_k = -1+k/n$.\n(b) $2x f(x^2) = \\cos(\\pi x) - \\pi x\\sin(\\pi x)$. Put $x=2$: $4 f(4) = 1 \\implies f(4) = 1/4$."}, {"id": "ma_q27", "src": "Midsem / Endsem", "level": "Endsem_21 Q9 & Endsem 2023 Q15", "q": "(a) Is $S=\\{(x,y): x^2+y^2=1,\\ y>0\\}$ open or closed in $\\mathbb{R}^2$? (b) Prove via $\\epsilon$-$\\delta$ that $\\lim_{(x,y)\\to(0,0)}\\frac{4xy^2}{x^2+y^2}=0$.", "hint": "Does a 1D curve hold any 2D open disk? Notice $|x|\\le r$ and $y^2/(x^2+y^2)\\le 1$.", "sol": "(a) Neither: empty 2D interior $\\implies$ not open; misses boundary points $(\\pm 1,0) \\implies$ not closed.\n(b) $\\frac{4|x|y^2}{x^2+y^2} \\le 4|x| \\le 4\\sqrt{x^2+y^2} < \\epsilon$ whenever $\\sqrt{x^2+y^2} < \\delta = \\epsilon/4$."}, {"id": "ma_q28", "src": "Midsem / Endsem", "level": "05_Partial & Endsem_21 Q10", "q": "(a) Show $\\lim_{(x,y)\\to(0,0)}\\frac{2x^2 y}{x^4+y^2}$ DNE. (b) Prove $f(x,y)=\\frac{xy}{\\sqrt{x^2+y^2}}$ ($0$ at $(0,0)$) is continuous everywhere, compute $f_x(0,0), f_y(0,0)$, and test differentiability at $(0,0)$.", "hint": "Try curve $y = kx^2$ in (a); test $h=k$ in differentiability limit in (b).", "sol": "(a) Along $y=kx^2$, $f = \\frac{2k}{1+k^2}$ depends on $k \\implies$ limit DNE by Two-Path Test.\n(b) $|f(x,y)|\\le |y| \\le \\sqrt{x^2+y^2}$ gives continuity ($\\delta=\\epsilon$); $f_x(0,0)=f_y(0,0)=0$, yet $\\frac{f(h,k)-0}{\\sqrt{h^2+k^2}} = \\frac{hk}{h^2+k^2} \\xrightarrow{h=k} \\frac{1}{2} \\ne 0 \\implies$ NOT differentiable!"}, {"id": "ma_q29", "src": "Midsem / Endsem", "level": "Endsem 2023 Q16", "q": "Let $f(x,y)=1$ if $xy=0$, and $0$ otherwise. Show $f_x(0,0)$ and $f_y(0,0)$ both exist yet $f$ is discontinuous at $(0,0)$.", "hint": "Along $x$-axis and $y$-axis $xy=0$ identically, whereas along $y=x$ ($x\\ne 0$), $xy \\ne 0$!", "sol": "$f_x(0,0) = \\lim_{h\\to 0}\\frac{1-1}{h} = 0$, $f_y(0,0)=0$. However along $y=x\\ne 0$, $f(x,x)=0 \\to 0 \\ne 1 = f(0,0) \\implies$ Discontinuous!"}, {"id": "ma_q30", "src": "Assignment / Tutorial", "level": "Practice Problems.jpg & 05_Partial", "q": "(a) Find directional derivative of $f(x,y)=x^2/2 + y^2/2$ at $(1,1)$ along $\\mathbf{v}=2\\hat{i}+\\hat{j}$. (b) Find $D_{\\hat{\\mathbf{u}}}g(1,0,2)$ and max rate of increase for $g(x,y,z)=x e^y + y z^2$ along $\\mathbf{v}=\\langle 2,-1,2\\rangle$.", "hint": "ALWAYS normalize $\\mathbf{v}$ into unit vector $\\hat{\\mathbf{u}} = \\mathbf{v}/\\|\\mathbf{v}\\|$!", "sol": "(a) $\\nabla f(1,1) = \\langle 1,1\\rangle$, $\\hat{\\mathbf{u}} = \\langle 2,1\\rangle/\\sqrt{5} \\implies D_{\\hat{\\mathbf{u}}}f = 3/\\sqrt{5}$.\n(b) $\\nabla g(1,0,2) = \\langle 1, 5, 0\\rangle$, $\\hat{\\mathbf{u}} = \\langle 2/3, -1/3, 2/3\\rangle \\implies D_{\\hat{\\mathbf{u}}}g = -1$; max rate $= \\|\\nabla g\\| = \\sqrt{26}$."}]}, "EC1000": {"code": "EC1000", "name": "Electrical Circuits", "short": "DC/AC Analysis, Theorems, Transients, Trafos, Motors & Diodes", "accent": "var(--chart-2)", "strategy": {"gradeRule": "EC1000 full marks come from airtight circuit hygiene: explicitly mark your reference node ($0\\text{ V}$), trace current/voltage polarities BEFORE multiplying ($V_o = +IR$ vs $-IR$), NEVER drop dependent sources when finding $R_{Th}/Z_{Th}$ or applying Superposition, and split DC ($\\omega=0$) from AC ($\\omega>0$) before phasors.", "targets": [{"item": "Spot Δ-Y bridges (Quiz 1 Q2, ECE-Midsem Q5) and balanced Wheatstone 0 A branches in 10 seconds", "weight": "+6 marks"}, {"item": "KEEP dependent sources active for Thevenin R_Th -> ALWAYS use V_oc/I_sc or 1V/1A test source", "weight": "+10 marks"}, {"item": "Lock the 4-Step Transient Algorithm: x(t) = x(inf) + [x(0+) - x(inf)] e^(-t/tau)", "weight": "+8 marks"}, {"item": "Separate peak (1/2 V_m I_m*) vs RMS (V_rms I_rms*), Z_L=Z_Th* vs real R_L=|Z_Th|, Trafo eta_max & IM slip", "weight": "+12 marks"}], "schedule": ["DC Foundations & Theorems (Slides 1-7): Sign convention, bulbs, Y-Delta, Nodal/Mesh, Supernode/Supermesh, Dependent Thevenin, Max Power.", "Energy & Transients (Slides 8-9): C & L DC steady state, piecewise dv/dt & di/dt, Source-free & Step RC/RL switching.", "AC Phasors, Machines & Diodes (Slides 10-13): Phasors, Mixed-freq Superposition, Complex Power & PF Cap, Transformers, IM/DC Motors & Bridge Rectifiers."]}, "topics": [{"id": "ec_t1", "name": "Basic Concepts, Passive Sign Convention, kWh Bills & Bulb Trap", "tag": "HIGH YIELD"}, {"id": "ec_t2", "name": "Kirchhoff's Laws, VDR/CDR, Ladder Equivalents & Y-Delta Bridges", "tag": "MUST KNOW"}, {"id": "ec_t3", "name": "Nodal Analysis, Inspection Matrix & Floating Supernodes", "tag": "MUST KNOW"}, {"id": "ec_t4", "name": "Mesh Analysis, Supermeshes & Dependent Controlled Sources", "tag": "MUST KNOW"}, {"id": "ec_t5", "name": "Superposition, Mixed Frequencies & Source Transformation", "tag": "MUST KNOW"}, {"id": "ec_t6", "name": "Thevenin/Norton (Dependent Sources via Test Source) & DC Max Power", "tag": "MUST KNOW"}, {"id": "ec_t7", "name": "Capacitors, Inductors, Energy W = 1/2 CV^2 / 1/2 LI^2 & DC Steady State", "tag": "HIGH YIELD"}, {"id": "ec_t8", "name": "1st-Order Source-Free & Step Response RC/RL Transients", "tag": "MUST KNOW"}, {"id": "ec_t9", "name": "Sinusoids, Phasors (sin->cos-90), Impedances Z & Admittances Y", "tag": "MUST KNOW"}, {"id": "ec_t10", "name": "Sinusoidal Steady-State Nodal, Mesh, Norton & Multi-Freq Superposition", "tag": "MUST KNOW"}, {"id": "ec_t11", "name": "AC Power Triangle S = P+jQ, RMS Waves, PF Correction & AC Max Power", "tag": "MUST KNOW"}, {"id": "ec_t12", "name": "1-Ph Transformers (E=4.44fNPhi_m, Max Eta), DC Motors & 3-Ph IM Slip", "tag": "HIGH YIELD"}, {"id": "ec_t13", "name": "Semiconductor Diodes, Zener Regulators, HWR, Center-Tap & Bridge FWR", "tag": "HIGH YIELD"}], "slides": [{"title": "1. Basic Laws, Passive Sign, Utility Cost & The Bulb Trap", "topicId": "ec_t1", "tag": "Lecture 1 & Basic Concepts • Fundamentals", "intuition": "Light bulbs at home are built for PARALLEL wall sockets ($V_{\\text{rated}} = 120\\text{ V}$ or $230\\text{ V}$), so a higher-wattage bulb MUST have a LOWER filament resistance ($R = V^2/P$) to pull more current! Put them in series instead, and the same current punishes the largest resistance (the LOW-wattage bulb) with $I^2 R$!", "bullets": ["<b>Charge, Current, Power &amp; Energy:</b> $q(t) = \\int i\\,dt$, $p = vi$, $W = \\int p\\,dt$; $1\\text{ kWh} = 3.6\\times 10^6\\text{ J}$.", "<b>Passive Sign Convention:</b> Current entering the $+$ terminal $\\implies p = +vi$ is <b>absorbed</b>; current leaving $+$ $\\implies$ <b>supplied</b>. Conservation check on every solved circuit: $\\sum p_k = 0$.", "<b>Battery Ah &amp; Tariff Arithmetic (`Quiz 1` Q1 &amp; `Ch-1`):</b> $\\text{Capacity (Ah)} = I \\times t$; Energy $(\\text{Wh}) = V \\times \\text{Ah}$. Tiered electricity bills add base fixed fee + slab rates.", "<b>Bulb Resistance Law (`ELE103T` Q1):</b> $R_{\\text{bulb}} = \\frac{V_{\\text{rated}}^2}{P_{\\text{rated}}}$. At $120\\text{ V}$: $R_{30}=480\\,\\Omega$, $R_{40}=360\\,\\Omega$, $R_{50}=288\\,\\Omega$."], "walkthrough": {"source": "Quiz 1 Sept 2023 Q1 & ELE103T Quiz 1 Q1", "problem": "(a) A $600\\text{ W}$ TV runs $4\\text{ h}$ at Rs. $10/\\text{kWh}$: cost? (b) A $0.8\\text{ Ah}, 6\\text{ V}$ battery lasts $10\\text{ h}$: find $I, P, E$. (c) Three $120\\text{ V}$ bulbs ($30\\text{ W}, 40\\text{ W}, 50\\text{ W}$) in series across $120\\text{ V}$: which is brightest?", "steps": ["<b>Part (a):</b> Energy $= 0.6\\text{ kW} \\times 4\\text{ h} = 2.4\\text{ kWh} \\implies$ Cost $= 2.4 \\times 10 = \\mathbf{\\text{Rs. } 24}$.", "<b>Part (b):</b> $I = \\frac{0.8\\text{ Ah}}{10\\text{ h}} = \\mathbf{80\\text{ mA}}$; $P = 6\\text{ V}\\times 0.08\\text{ A} = \\mathbf{0.48\\text{ W}}$; $E = 6\\text{ V}\\times 0.8\\text{ Ah} = \\mathbf{4.8\\text{ Wh}}\\ (= 17.28\\text{ kJ})$.", "<b>Part (c):</b> $R_{30}=480\\,\\Omega$, $R_{40}=360\\,\\Omega$, $R_{50}=288\\,\\Omega$. Total $R_s = 1128\\,\\Omega \\implies I = \\frac{120}{1128} = 0.1064\\text{ A}$. Power $P = I^2 R \\implies P_{30} = \\mathbf{5.43\\text{ W}}$ beats $4.07\\text{ W}$ and $3.26\\text{ W}$!"], "answer": "(a) Rs. 24; (b) $80\\text{ mA},\\ 0.48\\text{ W},\\ 4.8\\text{ Wh}$; (c) The **$30\\text{ W}$ bulb** glows brightest in series ($50\\text{ W}$ in parallel!)."}, "formula": "$$P_{\\text{bulb, series}} = I^2\\left(\\frac{V^2}{P_{\\text{rated}}}\\right) \\qquad\\Big|\\qquad \\sum_{\\text{all elements}} P_k = 0 \\qquad\\Big|\\qquad 1\\text{ kWh} = 3.6\\text{ MJ}$$", "trap": "Never report a single resistance value when a dependent source sits inside a network, and don't mix up Ah ($= It$) with Wh ($= VIt$)!"}, {"title": "2. Kirchhoff's Laws, VDR/CDR & Delta-Y Bridges", "topicId": "ec_t2", "tag": "Lecture 2a & 2b • Reduction & Bridges", "intuition": "When a diagonal or horizontal bridge resistor pins two mid-nodes together so no pair is strictly series or parallel, first test the Wheatstone ratio ($\\frac{R_1}{R_2}=\\frac{R_3}{R_4}$: zero bridge current $\\implies$ delete the bridge!). Otherwise convert one $\\Delta$ triangle into a $Y$ star and the whole ladder collapses instantly!", "bullets": ["<b>Topology Law:</b> Branches $= \\text{loops} + \\text{nodes} - 1$ (`b = l + n - 1`). Series resistors add ($R_{\\text{eq}} = \\sum R_k$); parallel conductances add ($G_{\\text{eq}} = \\sum G_k = \\sum 1/R_k$).", "<b>Voltage &amp; Current Dividers:</b> Series VDR: $v_k = \\frac{R_k}{R_{\\text{tot}}}v_s$. Parallel CDR (2 resistors): $i_1 = \\frac{R_2}{R_1+R_2}i_s$ (OPPOSITE resistor in numerator!).", "<b>$\\Delta \\to Y$ Conversion:</b> Given delta resistors $R_a, R_b, R_c$ around a loop ($R_{\\text{sum}} = R_a+R_b+R_c$), each $Y$ arm equals the product of its <b>two adjacent $\\Delta$ arms</b> divided by $R_{\\text{sum}}$: $R_1 = \\frac{R_b R_c}{R_{\\text{sum}}}$.", "<b>$Y \\to \\Delta$ Conversion:</b> Given star $R_1, R_2, R_3$, each $\\Delta$ arm is $\\frac{R_1R_2+R_2R_3+R_3R_1}{\\text{opposite } Y\\text{ arm}}$. Identical arms satisfy $R_\\Delta = 3 R_Y$!"], "walkthrough": {"source": "Quiz 1 Sept 2023 Q2 & ECE-Midsem 21 Q5", "problem": "A $24\\text{ V}$ source feeds a bridge: top $\\Delta$ has $20\\,\\Omega$ (left), $60\\,\\Omega$ (right), $40\\,\\Omega$ (horizontal bridge); bottom left has $10\\,\\Omega$, bottom right has $50\\,\\Omega$ in series with $20\\,\\Omega$. Find $R_{\\text{eq}}$ and $I_o$.", "steps": ["Convert the top $\\Delta(20, 60, 40)$ (total $120\\,\\Omega$) into a $Y$: top stem $R_{\\text{top}} = \\frac{20\\times 60}{120} = \\mathbf{10\\,\\Omega}$, left leg $R_L = \\frac{20\\times 40}{120} = \\frac{20}{3}\\,\\Omega$, right leg $R_R = \\frac{60\\times 40}{120} = 20\\,\\Omega$.", "Combine bottom branches in parallel: left $= \\frac{20}{3} + 10 = \\frac{50}{3}\\,\\Omega$; right $= 20 + 50 + 20 = 90\\,\\Omega$. Parallel: $\\frac{(50/3)(90)}{50/3 + 90} = \\frac{225}{16} = 14.0625\\,\\Omega$.", "Add the top Y branch $R_{\\text{top}} = 10\\,\\Omega$ in series: $R_{\\text{eq}} = 10 + 14.0625 = \\mathbf{24.0625\\,\\Omega} \\implies I_o = \\frac{24}{24.0625} = \\mathbf{0.9974\\text{ A}}$! (`ECE-Midsem Q5` multiplies every resistor by $2.5 \\implies R_{\\text{eq}} = 60.1563\\,\\Omega$, $60\\text{ V}/60.1563 = 0.9974\\text{ A}$!)"], "answer": "$R_{\\text{eq}} = 24.0625\\,\\Omega$, $I_o = 0.9974\\text{ A}$ (Exact $\\Delta$-$Y$ &amp; MNA verified)."}, "formula": "$$R_Y = \\frac{R_{\\text{adj},1} R_{\\text{adj},2}}{R_a + R_b + R_c} \\qquad\\Big|\\qquad R_\\Delta = 3 R_Y \\qquad\\Big|\\qquad \\text{Balanced Bridge: } R_1 R_4 = R_2 R_3 \\implies I_{\\text{bridge}} = 0$$", "trap": "Never forget to check symmetry FIRST (`Ch-3 Nodal Sym`): on a symmetric diamond ($6\\text{k},6\\text{k}$ top, $4\\text{k},4\\text{k}$ bottom), bridge current is $0$ — deleting it solves $I_o$ in two lines without $\\Delta$-$Y$!"}, {"title": "3. Nodal Analysis, Inspection Matrix & Supernodes", "topicId": "ec_t3", "tag": "Lecture 3A & 3B1 • KCL Systematic", "intuition": "Current through an ideal voltage source can be anything the circuit demands, so you can't write $I = (V_a - V_b)/R$ across it. A **Supernode** simply wraps a dashed bubble around BOTH terminals of a floating voltage source so all unknown internal source currents cancel in a single KCL equation!", "bullets": ["<b>3-Step Nodal Algorithm:</b> (1) Pick reference node ($0\\text{ V}$); (2) Label non-reference voltages $v_1, \\dots, v_{n-1}$ (if source touches ref, set $v_k = V_s$ immediately); (3) Write KCL ($\\sum \\text{currents leaving} = 0$) at each free node.", "<b>Inspection Conductance Matrix $[G][V]=[I]$ (`ELE103T Q6`):</b> $G_{ii} = \\sum$ conductances touching node $i$; $G_{ij} = -\\sum$ conductances shared directly between $i$ and $j$; $I_i = \\sum$ independent currents ENTERING node $i$. <b>LEGAL ONLY IF ZERO DEPENDENT SOURCES EXIST!</b>", "<b>Floating Supernode Rules:</b> Combine BOTH nodes into ONE KCL sum of every branch exiting the bubble, PLUS the constraint equation $v_+ - v_- = V_s$."], "walkthrough": {"source": "Quiz 1 Sept 2023 Q4 & ECE-Midsem 21 Q2", "problem": "(a) `Quiz 1 Q4`: $60\\text{ V}$ node feeds $4\\,\\Omega$ (carrying $i_o$) to $v_T$ and $10\\,\\Omega$ to $v_M$; $8\\,\\Omega$ goes $v_T\\to\\text{gnd}$; $2\\,\\Omega$ links $v_T, v_M$; dependent $3i_o$ enters $v_M$. Find $i_o$. (b) `ECE-Midsem Q2`: Triple Supernode ($v_A - v_C = 12$, $v_C - v_B = 6$, $4\\text{k}\\Omega$ at $v_A$, $6\\text{mA}\\uparrow$ at $v_B$, $6\\text{k}\\Omega$ at $v_C$). Find $V_o = v_C$.", "steps": ["<b>Part (a):</b> Define $i_o = \\frac{60-v_T}{4}$. KCL at $v_T$: $\\frac{v_T-60}{4}+\\frac{v_T-v_M}{2}+\\frac{v_T}{8}=0 \\implies 7v_T - 4v_M = 120$. KCL at $v_M$: $\\frac{v_M-60}{10}+\\frac{v_M-v_T}{2} = 3\\frac{60-v_T}{4} \\implies 5v_T+12v_M=1020$. Solving: $v_T=53.077\\text{ V}, v_M=62.885\\text{ V}, i_o = \\mathbf{1.7308\\text{ A}}$.", "<b>Part (b):</b> Supernode wraps ALL 3 nodes ($v_A, v_B, v_C$)! Write $v_A = v_C+12$ and $v_B = v_C-6$. Single Supernode KCL (note inner $6\\text{ k}\\Omega$ cancels inside bubble!): $\\frac{v_A}{4\\text{k}} + \\frac{v_C}{6\\text{k}} - 6\\text{ mA} = 0 \\implies \\frac{v_C+12}{4} + \\frac{v_C}{6} = 6 \\implies 5v_C = 36 \\implies V_o = \\mathbf{7.2\\text{ V}}$!"], "answer": "(a) $i_o = 1.7308\\text{ A}$; (b) $V_o = 7.2\\text{ V}$ (MNA verified)."}, "formula": "$$[G][V] = [I] \\ \\text{(No dep. src)} \\qquad\\Big|\\qquad \\text{Supernode: } \\sum_{\\text{exit}} i = 0 \\ \\land\\ v_+ - v_- = V_s$$", "trap": "Never include a branch that sits completely <b>inside</b> a Supernode (like the $6\\text{ k}\\Omega$ between $v_A$ and $v_B$ in `ECE-Midsem Q2`) inside your outer Supernode KCL — its current enters one node and leaves the other, cancelling identically!"}, {"title": "4. Mesh Analysis, Inspection Matrix & Supermeshes", "topicId": "ec_t4", "tag": "Lecture 3A & 3B2 • KVL Planar", "intuition": "Voltage across an ideal current source is unknown until the rest of the circuit settles. So whenever two clockwise meshes share a current source, draw a **Supermesh** loop that skirts right around that shared branch (AND any resistor directly in series with it!) — replacing both loops with ONE clean outer KVL plus one current-difference equation!", "bullets": ["<b>Planar Mesh Steps:</b> Label clockwise mesh currents $i_1, \\dots, i_m$. Branch shared between $i_a, i_b$ drops $R(i_a - i_b)$ along $i_a$. If a current source sits on an OUTER perimeter mesh (`Ch-3`), fix $i_k = \\pm I_s$ immediately!", "<b>Inspection Resistance Matrix $[R][I]=[V]$:</b> $R_{ii} = \\sum$ resistances in mesh $i$; $R_{ij} = -\\sum$ shared resistances; $V_i = \\sum$ net voltage rises CW around mesh $i$. (Independent sources ONLY!)", "<b>Supermesh Rule (`Quiz 1 Q3` &amp; `ELE103T Fig 2`):</b> Remove shared current source branch (including its series resistor!), write KVL around the big combined loop, then add constraint $i_a - i_b = I_s$ matching the arrow direction."], "walkthrough": {"source": "Quiz 1 Sept 2023 Q3 & Lec 3B2 / Practice Ch-4 Supermesh", "problem": "In `Quiz 1 Q3`: left mesh $i_1$ ($8\\text{ V}$ rise, shared $2\\,\\Omega$ with top-right $i_3$), bottom-right $i_2$ ($8\\,\\Omega$ outer, shared $4\\,\\Omega$ with $i_3$, shared $2\\,\\Omega$-less? wait: downward $4\\text{ A}$ in series with $1\\,\\Omega$ sits between $i_1$ and $i_2$). Find $i_1, i_2, i_3$.", "steps": ["<b>1. Current constraint:</b> $i_1$ flows down through the shared branch, $i_2$ flows up $\\implies \\mathbf{i_1 - i_2 = 4}$.", "<b>2. Mesh 3 KVL ($i_3$):</b> $2(i_3-i_1) + 2 i_3 + 4(i_3-i_2) = 0 \\implies -2i_1 - 4i_2 + 8i_3 = 0$.", "<b>3. Supermesh ($i_1 + i_2$) KVL:</b> $-8 + 2(i_1-i_3) + 4(i_2-i_3) + 8i_2 = 0 \\implies 2i_1 + 12i_2 - 6i_3 = 8$. Solving yields $i_2 = \\frac{12}{19} = \\mathbf{0.6316\\text{ A}}$, $i_1 = \\mathbf{4.6316\\text{ A}}$, $i_3 = \\mathbf{1.4737\\text{ A}}$!"], "answer": "$i_1 = 4.632\\text{ A},\\ i_2 = 0.632\\text{ A},\\ i_3 = 1.474\\text{ A}$ (Note: $1\\,\\Omega$ in series with $4\\text{ A}$ doesn't appear anywhere in KVL!)."}, "formula": "$$[R][I]=[V] \\quad\\Big|\\quad \\text{Supermesh } (i_1, i_2):\\ \\text{drop shared } I_s\\text{ branch} \\implies \\text{KVL}_{\\text{merged}}=0 \\ \\land\\ i_1 - i_2 = I_s$$", "trap": "Never include a resistor wired in SERIES with an ideal current source inside Supermesh KVL (`1 Ohm` in `Quiz 1 Q3`) — you don't know the current-source voltage anyway, so the whole series branch is bypassed during KVL!"}, {"title": "5. Superposition & Source Transformation", "topicId": "ec_t5", "tag": "Lecture 4A & 4B • Linearity Tools", "intuition": "Linear circuits obey proportionality: turning on multiple independent batteries/current sources at once produces the exact sum of turning each one on individually while zeroing the rest! Meanwhile Source Transformation swaps a stubborn series $V_s$-$R$ branch into a parallel $I_s$-$R$ branch so parallel resistors can merge!", "bullets": ["<b>3 Sacred Rules of Superposition:</b> (1) Kill all OTHER independent sources ($V\\text{-source} \\to \\mathbf{0\\text{ V}\\ \\text{short}}$, $I\\text{-source} \\to \\mathbf{0\\text{ A}\\ \\text{open}}$); (2) <b>NEVER turn off dependent sources</b> (keep them active in EVERY pass!); (3) <b>NEVER superpose Power!</b> Sum voltages/currents FIRST, then compute $P = I_{\\text{tot}}^2 R$.", "<b>Source Transformation Equivalence (`Lec 4A`):</b> $V_s$ series $R \\iff I_s = V_s/R$ parallel $R$ ($+$ end of $V_s$ matches arrow head of $I_s$). Only transforms terminal behavior OUTSIDE the $R$-pair, and NEVER swallow a dependent control variable ($v_x$ / $i_x$)! Note: also works for dependent sources ($2i_x\\text{ V}$ series $R \\leftrightarrow (2i_x/R)\\text{ A}$ parallel $R$).", "<b>Source-Redundancy Shortcuts:</b> Anything in <b>parallel with an ideal $V_s$</b> doesn't affect outer nodes; anything in <b>series with an ideal $I_s$</b> doesn't affect outer mesh currents."], "walkthrough": {"source": "Quiz 1 Sept 2023 Q5-6 & ECE-Midsem 21 Q3", "problem": "(a) `Quiz 1 Q5`: $12\\text{ V}$ (left) feeds $4\\,\\Omega$ to central $3\\,\\Omega$ (carrying $i$ down), top rail has $24\\text{ V}$ ($+$ left) + $8\\,\\Omega$, right has $4\\,\\Omega$ from center + $3\\text{ A}\\uparrow$. Find $i$. (b) `Quiz 1 Q6`: find $v_o$ ($+$ left across $2\\,\\Omega$ in series with $30\\text{ V}$ at bottom).", "steps": ["<b>Part (a) Superposition ($3$ passes):</b> 1) $12\\text{ V}$ only ($24\\text{ V}$ short, $3\\text{ A}$ open): yields $+2\\text{ A}$. 2) $24\\text{ V}$ only: $-1\\text{ A}$. 3) $3\\text{ A}$ only: $+1\\text{ A}$. Total $i = 2 - 1 + 1 = \\mathbf{2\\text{ A}}$ ($P_{3\\Omega} = 2^2\\times 3 = 12\\text{ W} \\ne 12+3+3$!).", "<b>Part (b) Source Transform:</b> Convert $3\\text{ A}\\downarrow \\parallel 4\\,\\Omega \\to 12\\text{ V}$ ($+$ bot), $2\\text{ A}\\rightarrow \\parallel 9\\,\\Omega \\to 18\\text{ V}$ ($+$ right), and $6\\text{ A}\\downarrow \\parallel 5\\,\\Omega \\to 30\\text{ V}$ ($+$ bot). Single $20\\,\\Omega$ outer loop has net CW push $= 18 + 30 + 30 - 12 = +66\\text{ V}$ $\\implies I_{\\text{CW}} = 3.3\\text{ A}$ hitting $-$ of $v_o \\implies v_o = -3.3\\times 2 = \\mathbf{-6.6\\text{ V}}$!"], "answer": "(a) $i = 2\\text{ A}$ ($12\\text{ W}$); (b) $v_o = -6.6\\text{ V}$ (Verified via MNA)."}, "formula": "$$P \\ne P_1 + P_2 \\quad\\Big|\\quad V_s = I_s R \\quad\\Big|\\quad \\text{Zero } V\\text{-src}=\\text{SHORT (0 V)}, \\quad \\text{Zero } I\\text{-src}=\\text{OPEN (0 A)}$$", "trap": "Killing $V$ by opening it or killing $I$ by shorting it reverses the rules completely! Also remember in `Practice Ch-4 Superposition Q2`: summing powers gives wrong answer — compute $i = i_1+i_2 = 1.875\\text{ A}$ first, THEN $P = (1.875)^2(3) = 10.55\\text{ W}$!"}, {"title": "6. Thevenin, Norton & DC Maximum Power Transfer", "topicId": "ec_t6", "tag": "Lecture 4B & 4C • Black-Box Equivalents", "intuition": "If you stand at two load terminals $a$-$b$, ANY gigantic linear DC network feels identical to ONE battery ($V_{Th} = V_{oc}$) in series with ONE resistor ($R_{Th}$). Max power hits at $R_L = R_{Th}$ ($50\\%$ efficiency), whereas if a dependent source lurks inside you MUST excite terminals $a$-$b$ with a $1\\text{ V}$ or $1\\text{ A}$ test probe!", "bullets": ["<b>Thevenin &amp; Norton Pair:</b> $V_{Th} = V_{oc}$ (open $a$-$b$); $I_N = I_{sc}$ (short $a$-$b$); $V_{Th} = I_N R_{Th}$ and $R_{Th} = R_N$.", "<b>Case 1 (No Dependent Sources):</b> Zero all independent sources, compute $R_{Th} = R_{ab}$ by series/parallel/$\\Delta$-$Y$.", "<b>Case 2 (Dependent Sources Present — `Lec 4B Ex 4.9-4.10`):</b> Turn OFF independent sources ONLY (KEEP dependent sources!). Apply $V_o = 1\\text{ V}$ at $a$-$b$, solve $I_o \\implies R_{Th} = 1/I_o$ (OR compute both $V_{oc}$ and $I_{sc} \\implies R_{Th} = V_{oc}/I_{sc}$!). Note: $R_{Th}$ can even be <b>negative</b> in active dependent circuits!", "<b>Max Power Transfer:</b> Set $R_L = R_{Th}$ for $P_{\\max} = \\frac{V_{Th}^2}{4 R_{Th}}$. Careful: if the load $R$ is <i>fixed</i> inside a bridge (`ECE-Midsem Q4`), pull $R$ out FIRST and find $V_{Th}, R_{Th}$ looking back into those two cut wires!"], "walkthrough": {"source": "ECE-Midsem 21 Q4 & Lec 4B Dependent Thevenin", "problem": "(a) `ECE-Midsem Q4`: Bottom ground; left $10\\text{ V}$ ($+$ top) $\\to 3\\,\\Omega \\to v_x$; between $v_x$ &amp; $v_y$: $(12\\,\\Omega + 10\\text{ V}\\ [- \\text{ left}, +\\text{ right}])$ in parallel with variable load $R$; $v_y$ has $5\\,\\Omega$ to gnd and $16\\text{ A}\\downarrow$ to gnd. Find optimal $R$ and $P_{\\max}$. (b) Find $R_{Th}$ looking into $4\\text{ A}\\uparrow \\parallel 4\\,\\Omega$? (`Lec 4B` $2v_x$ across $2\\,\\Omega$).", "steps": ["<b>Part (a) Step 1 ($R_{Th}$):</b> Remove $R$, short both $10\\text{ V}$ sources, open $16\\text{ A}$. Looking between $v_x$ and $v_y$: $3\\,\\Omega$ goes $v_x$-gnd and $5\\,\\Omega$ goes $v_y$-gnd ($3+5=8\\,\\Omega$), directly in parallel with the $12\\,\\Omega$ bridge $\\implies R_{Th} = 8 \\parallel 12 = \\mathbf{4.8\\,\\Omega}$!", "<b>Part (a) Step 2 ($V_{Th}$ &amp; $P_{\\max}$):</b> Nodal with $R$ open: $\\frac{v_x-10}{3}+\\frac{v_x-v_y+10}{12}=0 \\implies 5v_x - v_y = 30$; $\\frac{v_y}{5} + 16 + \\frac{v_y-v_x-10}{12}=0 \\implies -5v_x+17v_y = -910$. Solving: $v_x = -5\\text{ V},\\ v_y = -55\\text{ V} \\implies V_{Th} = v_x - v_y = \\mathbf{50\\text{ V}}$. Thus $P_{\\max} = \\frac{50^2}{4(4.8)} = \\mathbf{130.21\\text{ W}}$!", "<b>Part (b) (`ELE103T` 2018 Q3):</b> $6\\text{ A}\\parallel 16\\,\\Omega \\to 96\\text{ V}$ series $16\\,\\Omega$. Removing $4\\,\\Omega$: $V_{Th} = 96 - 6 = 90\\text{ V},\\ R_{Th} = 16 + 20 = 36\\,\\Omega \\implies I_{4\\Omega} = \\frac{90}{36+4} = \\mathbf{2.25\\text{ A}}$!"], "answer": "(a) $R = 4.8\\,\\Omega,\\ P_{\\max} = 130.21\\text{ W}$; (b) $I_{4\\Omega} = 2.25\\text{ A}$."}, "formula": "$$R_L = R_{Th} \\implies P_{\\max} = \\frac{V_{Th}^2}{4 R_{Th}} \\qquad\\Big|\\qquad R_{Th} = \\frac{V_{\\text{test}}}{I_{\\text{test}}} = \\frac{V_{oc}}{I_{sc}} \\qquad\\Big|\\qquad \\eta_{\\max P} = 50\\%$$", "trap": "Two classic blunders: (1) Trying to evaluate $R_{Th}$ by parallel/series while a dependent source sits inside the box (`0 marks`); (2) Shorting/opening dependent sources when applying $1\\text{ V}$ test probe (`WRONG`!)."}, {"title": "7. Capacitors, Inductors & DC Steady-State Rules", "topicId": "ec_t7", "tag": "Lecture 5 (Ch-6) • Energy Storage", "intuition": "In steady DC ($\\frac{d}{dt} = 0$), capacitor current $i_C = C\\frac{dv}{dt}$ drops to $0$ (behaves like an **OPEN** circuit holding constant voltage), while inductor voltage $v_L = L\\frac{di}{dt}$ drops to $0$ (behaves like a **SHORT** wire carrying steady current). Both store energy smoothly without abrupt jumps in $v_C$ or $i_L$!", "table": {"headers": ["Property", "Capacitor C [Farad]", "Inductor L [Henry]", "Exam Remember"], "rows": [["i-v Derivative", "i = C (dv/dt)", "v = L (di/dt)", "Zero slope -> zero current (C) or zero V (L)"], ["Integral Law", "v(t) = (1/C) int i dt + v(t0)", "i(t) = (1/L) int v dt + i(t0)", "Must keep initial v(0) / i(0)!"], ["Stored Energy", "W_C = 1/2 C v^2 [J]", "W_L = 1/2 L i^2 [J]", "Finite power => v_C, i_L continuous!"], ["Series Combination", "1/C_eq = sum 1/C_k (Like R par!)", "L_eq = sum L_k (Like R series!)", "Caps combine OPPOSITE to R!"], ["Parallel Combination", "C_eq = sum C_k (Like R series!)", "1/L_eq = sum 1/L_k (Like R par!)", "Parallel C adds directly!"], ["DC Steady State", "OPEN CIRCUIT (i_C = 0)", "SHORT CIRCUIT (v_L = 0)", "Step 1 of ALL Ch-7 transient problems"]]}, "bullets": ["<b>Piecewise Slope Waveforms (`Ch-6` Q3 &amp; `Q5`):</b> Current pulse on a $5\\text{ mH}$ inductor ($0\\to 10\\text{ A}$ in $2\\text{ ms}$, flat $2..4\\text{ ms}$, $10\\to 0\\text{ A}$ in $4..6\\text{ ms}$) has slopes $+5000, 0, -5000\\text{ A/s} \\implies v_L = +25\\text{ V}, 0\\text{ V}, -25\\text{ V}$!", "<b>Exponential Differentiation Check (`ECE-Midsem Q8`):</b> If $50\\text{ mH} \\parallel 2.5\\text{ k}\\Omega$ has $i_L = 50 e^{-100t}\\text{ mA}$, then $v_L = L\\frac{di}{dt} = 0.05(-5 e^{-100t}) = -0.25 e^{-100t}\\text{ V} = v_R$ (same parallel voltage!), and $W_L(0) = \\frac{1}{2}(0.05)(0.05)^2 = \\mathbf{62.5\\,\\mu\\text{J}}$!"], "walkthrough": {"source": "ECE-Midsem 21 Q1 & Lec 5 Ch-6 Problems", "problem": "(a) Under DC steady state: $50\\text{ V}$ ($+$ top) in series with $10\\,\\Omega$ meets junction $X$: left goes $30\\,\\Omega$ to node $Y$ ($40\\,\\Omega \\parallel C_1$), right goes $20\\,\\Omega$ to $C_2$ to gnd. Find $V_1$ across $C_1$ and $V_2$ across $C_2$. (b) $20\\text{ mH}$ inductor has $|i(t)| = |v(t)|$ $\\forall t$ with $i(0)=2\\text{ A}$ (`Ch-6` Q2): find $i(t)$.", "steps": ["<b>Part (a):</b> At DC steady state, BOTH $C_1$ and $C_2$ become <b>Open Circuits</b>! Because $C_2$ is open, ZERO current flows through the right $20\\,\\Omega$ resistor $\\implies V_2 = V_X$ directly!", "All current from the $50\\text{ V}$ source circulates through $10\\,\\Omega + 30\\,\\Omega + 40\\,\\Omega = 80\\,\\Omega$ ($I = 50/80 = 0.625\\text{ A}$). By voltage divider: $V_1 = 50\\frac{40}{80} = \\mathbf{25\\text{ V}}$ and $V_2 = V_X = 50\\frac{30+40}{80} = \\mathbf{43.75\\text{ V}}$!", "<b>Part (b):</b> If $v = +L\\frac{di}{dt} = i \\implies \\frac{di}{i} = \\frac{dt}{0.02} = 50\\,dt \\implies i(t) = 2 e^{50t}\\text{ A}$ (or $2 e^{-50t}\\text{ A}$ if opposing sign)."], "answer": "(a) $V_1 = 25\\text{ V},\\ V_2 = 43.75\\text{ V}$; (b) $i(t) = 2 e^{\\pm 50t}\\text{ A}$."}, "formula": "$$i_C = C\\frac{dv}{dt}, \\quad v_L = L\\frac{di}{dt} \\qquad\\Big|\\qquad C_{\\text{series}} = \\frac{C_1 C_2}{C_1+C_2} \\qquad\\Big|\\qquad L_{\\text{parallel}} = \\frac{L_1 L_2}{L_1+L_2}$$", "trap": "A resistor in series with an OPEN DC capacitor carries zero current — so NO voltage drops across that $20\\,\\Omega$ resistor ($V_2 = V_X$, NOT $0\\text{ V}$!). Also don't forget to integrate $i(t) = \\frac{1}{C}\\dots$ WITH the $+v(t_0)$ constant!"}, {"title": "8. First-Order Transients (Source-Free & Step Response)", "topicId": "ec_t8", "tag": "Lectures 6a & 6b (Ch-7) • Switching Circuits", "intuition": "Whether an $RC$ or $RL$ circuit is draining to zero (Source-Free) or charging toward a new battery (Step Response), it ALWAYS follows the exact same exponential curve between its locked initial value $x(0^+)$ and its new resting equilibrium $x(\\infty)$, paced by time constant $\\tau$!", "bullets": ["<b>Master Complete Response Formula ($t \\ge 0$):</b> $$x(t) = x(\\infty) + \\big[x(0^+) - x(\\infty)\\big] e^{-t/\\tau}$$Works for BOTH $v_C(t)$ and $i_L(t)$ — AND even any auxiliary resistor voltage/current $v_o(t)$ for $t > 0$ (WAIT: only $v_C, i_L$ are continuous at $t=0$; for $v_o(0^+)$, solve at $t=0^+$ replacing $C\\to V_C(0^-)$ and $L\\to I_L(0^-)$!).", "<b>The 4-Step Exam Recipe:</b> (1) $t<0$ DC steady state ($C$ open, $L$ short) $\\to$ get $v_C(0^-)$ or $i_L(0^-)$; (2) $t=0^+$ continuity $\\to v_C(0^+)=v_C(0^-),\\ i_L(0^+)=i_L(0^-)$; (3) $t\\to\\infty$ new DC steady state $\\to x(\\infty)$; (4) $t>0$ zero independent sources $\\to R_{Th}$ seen by $C/L \\implies \\tau_{RC} = R_{Th}C,\\ \\tau_{RL} = L/R_{Th}$.", "<b>Decay Time Benchmark (`Ch-7` Q4):</b> Time to decay to fraction $1/k$: $e^{-t/\\tau} = 1/k \\implies t = \\tau\\ln k$ (after $5\\tau$, transient is $>99\\%$ finished!).", "<b>Unit Step Function $u(t-t_0)$:</b> Equal to $0$ for $t < t_0$ and $1$ for $t > t_0$. Sequential switching (`Ch-7 RL Q4`) simply restarts the 4-step formula at $t=2\\text{ s}$ using $i(2^+)=i(2^-)$!"], "walkthrough": {"source": "Lec 6a/6b & Practice Ch-7 Source-Free/Step", "problem": "(a) Switch closed long ($12\\text{ V} \\to 2\\,\\Omega \\to [\\text{sw}] \\to 4\\,\\Omega \\parallel 3\\text{ F}$) OPENS at $t=0$. Find $v_o(t)$ across the $3\\text{ F}$ capacitor for $t>0$. (b) In a first-order $RL$ circuit (`Lec 6b`), $i(0^-)=2\\text{ A}$, $t>0$ sees $R_{Th}=4\\,\\Omega, L=2\\text{ H}, i(\\infty)=5\\text{ A}$; find $i_L(t)$ and inductor voltage $v_L(t)=L\\frac{di_L}{dt}$.", "steps": ["<b>Part (a) Step 1-2:</b> For $t<0$ (switch closed, DC open cap): divider across $4\\,\\Omega$ gives $v_o(0^-) = 12\\frac{4}{2+4} = \\mathbf{8\\text{ V}} = v_o(0^+)$.", "<b>Part (a) Step 3-4:</b> For $t>0$ (switch open), $12\\text{ V}$ is disconnected: $v_o(\\infty) = 0\\text{ V}$, $R_{Th} = 4\\,\\Omega \\implies \\tau = R_{Th} C = 4\\times 3 = 12\\text{ s}$. Thus $v_o(t) = \\mathbf{8 e^{-t/12}\\text{ V}}$ for $t \\ge 0$.", "<b>Part (b):</b> $\\tau = \\frac{L}{R_{Th}} = \\frac{2}{4} = 0.5\\text{ s} \\implies 1/\\tau = 2$. $i_L(t) = 5 + (2-5)e^{-2t} = \\mathbf{5 - 3e^{-2t}\\text{ A}}$ ($t\\ge 0$). Then $v_L(t) = L\\frac{di}{dt} = 2(6e^{-2t}) = 12e^{-2t}\\text{ V}$ — notice $v_L(0^-)=0$ jumped to $v_L(0^+)=12\\text{ V}$!"], "answer": "(a) $v_o(t) = 8e^{-t/12}\\text{ V}$; (b) $i_L(t) = 5 - 3e^{-2t}\\text{ A}$ ($v_L$ jumps at $t=0^+$ while $i_L$ stays continuous!)."}, "formula": "$$x(t) = x(\\infty) + [x(0^+)-x(\\infty)]e^{-t/\\tau} \\qquad\\Big|\\qquad \\tau_{RC} = R_{Th} C, \\quad \\tau_{RL} = \\frac{L}{R_{Th}}$$", "trap": "Check switch arrows carefully! An arrow opening at $t=0$ means the switch was **CLOSED** for $t<0$; and NEVER assume auxiliary resistor currents or voltages are continuous across $t=0$ — ONLY $v_C$ and $i_L$ cannot jump!"}, {"title": "9. Sinusoids, Phasors, Impedances & Admittances", "topicId": "ec_t9", "tag": "Lecture 8 (Ch-9) & Assignment 2-2 • AC Basics", "intuition": "Calculus turns differential equations into ugly derivatives and integrals; Euler's formula $e^{j\\theta} = \\cos\\theta + j\\sin\\theta$ freezes a cosine wave at $t=0$ into a static complex arrow $\\mathbf{V} = V_m\\angle\\phi$ so differentiating simply multiplies by $j\\omega$ — letting DC Nodal/Mesh/Thevenin work identically with complex numbers!", "bullets": ["<b>Mandatory Cosine Convention (`Lec 8`):</b> Convert ALL sines to cosines first: $\\pm A\\sin(\\omega t+\\phi)$ using $+A\\sin x = A\\cos(x-90^\\circ)$ and $-A\\sin x = A\\cos(x+90^\\circ)$! Example: $-4\\sin(30t+50^\\circ) = \\mathbf{4\\angle 140^\\circ}$!", "<b>Lead vs Lag:</b> Compare phase angles on the SAME positive cosine/sine form: $i_1$ leads $i_2$ if $\\theta_1 > \\theta_2$ (`Lec 8`: $i_1 = 4\\cos(\\omega t+10^\\circ),\\ i_2 = -5\\cos(\\omega t-35^\\circ) = 5\\cos(\\omega t+145^\\circ) \\implies i_2$ leads by $135^\\circ$!).", "<b>Element Impedances &amp; Admittances:</b> $Z_R = R$, $Z_L = j\\omega L$, $Z_C = \\frac{1}{j\\omega C} = -\\frac{j}{\\omega C}$; Admittance $Y = \\frac{1}{Z} = G + jB$ [Siemens] (Susceptance of $L$ is $-j/(\\omega L)$; $C$ is $+j\\omega C$!).", "<b>Phasor Ops:</b> $V\\angle\\theta = V\\cos\\theta + j V\\sin\\theta$; $|z| = \\sqrt{x^2+y^2}$, $\\angle z = \\text{atan2}(y,x)$; $Z_1 \\parallel Z_2 = \\frac{Z_1 Z_2}{Z_1+Z_2}$."], "walkthrough": {"source": "Lec 8 & Assignment 2-2 Q6 & Q9", "problem": "(a) Find $Z_{\\text{eq}}$ and current $\\mathbf{I}$ for `A2-2 Q6` ($\\omega=10\\text{ rad/s}$: $12\\angle 0^\\circ\\text{ V} \\to 4\\,\\Omega \\to j20\\,\\Omega \\to [16\\,\\Omega \\parallel (-j14\\,\\Omega + j25\\,\\Omega)]$). (b) If $50\\,\\mu\\text{F}$ cap sees $v=6\\cos(100t-30^\\circ)\\text{ V}$, find $i(t)$.", "steps": ["<b>Part (a):</b> Combine right series impedances: $-j14 + j25 = j11\\,\\Omega$. Parallel with $16\\,\\Omega$: $\\frac{16(j11)}{16+j11} = \\frac{j176(16-j11)}{256+121} = \\frac{1936 + j2816}{377} = 5.1353 + j7.4695\\,\\Omega$.", "Add left $4 + j20\\,\\Omega$: $Z_{\\text{eq}} = \\mathbf{9.1353 + j27.4695\\,\\Omega} = 28.9486\\angle 71.60^\\circ\\,\\Omega \\implies \\mathbf{I} = \\frac{12\\angle 0^\\circ}{28.95\\angle 71.60^\\circ} = \\mathbf{0.4145\\angle -71.60^\\circ\\text{ A}}$.", "<b>Part (b):</b> $\\mathbf{V} = 6\\angle -30^\\circ$, $\\mathbf{I} = j\\omega C \\mathbf{V} = (100\\times 50\\times 10^{-6}\\angle 90^\\circ)(6\\angle -30^\\circ) = 0.03\\angle 60^\\circ\\text{ A} \\implies i(t) = \\mathbf{30\\cos(100t + 60^\\circ)\\text{ mA}}$!"], "answer": "(a) $Z_{\\text{eq}} = 9.14 + j27.47\\,\\Omega,\\ \\mathbf{I} = 0.4145\\angle -71.60^\\circ\\text{ A}$; (b) $30\\cos(100t+60^\\circ)\\text{ mA}$."}, "formula": "$$\\sin(\\omega t+\\phi) \\leftrightarrow 1\\angle(\\phi-90^\\circ) \\qquad\\Big|\\qquad Z_L = j\\omega L, \\quad Z_C = \\frac{-j}{\\omega C} \\qquad\\Big|\\qquad \\frac{dv}{dt} \\leftrightarrow j\\omega\\mathbf{V}$$", "trap": "Never write $Z_C = +j\\omega C$! Impedance of a capacitor is $\\frac{1}{j\\omega C} = \\mathbf{-j/(\\omega C)}$ (negative imaginary reactance $-X_C$), while admittance is $Y_C = +j\\omega C$!"}, {"title": "10. AC Nodal, Mesh, Norton & Multi-Freq Superposition", "topicId": "ec_t10", "tag": "Lectures 9a & 9b, A2-2 Q1-4 & A3 Q1-4 • AC Analysis", "intuition": "Every theorem you mastered for DC works unchanged in AC phasors — JUST replace $R$ with complex $Z$. The ONE absolute exception is **Mixed Frequencies** ($\\omega_1 \\ne \\omega_2$, or DC + AC): different speeds cannot share one phasor snapshot, so run Superposition frequency-by-frequency and add ONLY in the time domain!", "bullets": ["<b>AC Nodal/Mesh/Thevenin (`A2-2 Q1-4`, `A3 Q1-3`):</b> Solve complex linear systems carefully using polar multiplication/division and rectangular addition/subtraction.", "<b>Mixed-Frequency Rule (`A2-2 Q3`, `A3 Q4`):</b> Circuit with $V_{\\text{DC}}\\ (\\omega=0)$, $\\cos(2000t)$, and $\\sin(4000t)$ MUST run <b>3 separate passes</b>: Pass 1 computes $Z_C=\\infty, Z_L=0$; Pass 2 computes $j\\omega_2 L, -j/(\\omega_2 C)$; Pass 3 computes $j\\omega_3 L, -j/(\\omega_3 C)$. Convert each answer to time domain BEFORE adding!", "<b>AC Norton/Thevenin (`A2-2 Q4`):</b> Open $a$-$b$ for $\\mathbf{V}_{Th}$ or short $a$-$b$ for $\\mathbf{I}_N$; zero independent sources for $\\mathbf{Z}_{Th} = \\mathbf{Z}_N$ (or $1\\text{ V}$ test source if dependent sources present!)."], "walkthrough": {"source": "Assignment 2-2 Q1, Q2 & Assignment 3 Q4", "problem": "(a) `A2-2 Q2`: Left mesh $4\\angle -30^\\circ\\text{ A}$ shares $2\\,\\Omega$ ($+V_o-$) with right mesh ($j4\\,\\Omega$ top, $-3V_o+$ controlled bottom? wait: $-/+ 3V_o$ opp/rise, $-j2\\,\\Omega$ right carrying $I_o$). Find $I_o, V_o$. (b) `A3 Q4`: $20\\cos(4t)\\text{ V} \\to 4\\,\\Omega \\to \\text{mid}(1\\text{ H}\\downarrow i_o) \\to 2\\,\\Omega \\to 16\\text{ V DC}$. Find $i_o(t)$.", "steps": ["<b>Part (a):</b> Mesh 1 fixed: $I_1 = 4\\angle -30^\\circ\\text{ A}$, $V_o = 2(I_1 - I_2)$. Mesh 2 KVL: $2(I_2 - I_1) + j4 I_2 - 3V_o - j2 I_2 = 0 \\implies -8 I_1 + (8+j2)I_2 = 0 \\implies I_o = I_2 = \\frac{8}{8+j2}(4\\angle -30^\\circ) = \\mathbf{3.881\\angle -44.04^\\circ\\text{ A}}$ and $V_o = \\mathbf{1.940\\angle 45.96^\\circ\\text{ V}}$.", "<b>Part (b) Mixed DC + AC (`A3 Q4`):</b> <b>1) DC ($\\omega=0$):</b> Short $20\\cos(4t)$, $1\\text{ H} \\to \\text{short}$! So $i_{o,\\text{DC}} = \\frac{16}{2} = \\mathbf{8\\text{ A}}$. <b>2) AC ($\\omega=4$):</b> Short $16\\text{ V}$, $Z_L = j4\\,\\Omega$. Nodal at top of $1\\text{ H}$: $\\frac{V-20}{4} + \\frac{V}{j4} + \\frac{V}{2} = 0 \\implies V = \\frac{5}{0.75-j0.25} = 6+j2$, so $I_{o,\\text{AC}} = \\frac{V}{j4} = 0.5-j1.5 = 1.581\\angle -71.57^\\circ\\text{ A}$.", "<b>Combine in time:</b> $i_o(t) = \\mathbf{8 + 1.581\\cos(4t - 71.57^\\circ)\\text{ A}}$!"], "answer": "(a) $I_o = 3.881\\angle -44.04^\\circ\\text{ A},\\ V_o = 1.940\\angle 45.96^\\circ\\text{ V}$; (b) $8 + 1.581\\cos(4t - 71.57^\\circ)\\text{ A}$."}, "formula": "$$i_{\\text{tot}}(t) = I_{\\text{DC}} + \\sum_k I_{mk}\\cos(\\omega_k t + \\theta_k) \\qquad\\Big|\\qquad \\mathbf{Z}_N = \\mathbf{Z}_{Th}, \\quad \\mathbf{I}_N = \\frac{\\mathbf{V}_{Th}}{\\mathbf{Z}_{Th}}$$", "trap": "NEVER add $8 + 1.581\\angle -71.57^\\circ$ in phasor form — you CANNOT add DC and AC phasors because $8$ doesn't rotate at $\\omega = 4\\text{ rad/s}$!"}, {"title": "11. AC Power, RMS, Power Factor Correction & AC Max Power", "topicId": "ec_t11", "tag": "Lecture 10 (Ch-11), A2-2 Q10-15 & A3 Q5-11 • High Yield", "intuition": "Think of apparent power $|S|$ as total truck capacity: Real power $P$ [W] is actual cargo delivered (ONLY resistors consume $P$), while Reactive power $Q$ [VAR] sloshes back and forth in $L$ ($+Q$, lagging pf) and $C$ ($-Q$, leading pf). Adding a parallel capacitor injects $-Q_C$ to cancel $+Q_L$ — raising power factor closer to $1$ and cutting line current without altering $P$!", "table": {"headers": ["AC Power Quantity", "Peak Phasor (V_m, I_m)", "RMS Phasor (V_rms, I_rms)", "Key Unit & Sign"], "rows": [["Complex Power S", "1/2 V_m I_m* = P + jQ", "V_rms I_rms* = |I_rms|^2 Z", "VA (Voltage-Ampere)"], ["Real Avg Power P", "1/2 V_m I_m cos(th_v - th_i)", "V_rms I_rms cos(theta)", "Watts [W] (= |I_rms|^2 R)"], ["Reactive Power Q", "1/2 V_m I_m sin(th_v - th_i)", "V_rms I_rms sin(theta)", "VAR (+ Lag/Ind, - Lead/Cap)"], ["Apparent Power |S|", "1/2 V_m I_m", "V_rms I_rms", "pf = P/|S| = cos(theta_v - theta_i)"]]}, "bullets": ["<b>RMS Definitions (`Lec 10` &amp; Periodic Signals):</b> Pure sine $V_m/\\sqrt{2}$; <b>Half-Wave Rectified Sine $V_m / 2$</b>; Full-Wave Rectified Sine $V_m/\\sqrt{2}$; General DC + Harmonics $I_{\\text{rms}} = \\sqrt{I_{\\text{DC}}^2 + \\sum \\frac{1}{2}I_{mk}^2}$.", "<b>AC Max Average Power Transfer:</b> Complex load takes conjugate match $Z_L = Z_{Th}^* \\implies P_{\\max} = \\frac{|V_{Th,\\text{rms}}|^2}{4 R_{Th}}$ ($=\\frac{|V_{Th,m}|^2}{8 R_{Th}}$). Purely resistive load MUST take magnitude $R_L = |Z_{Th}| = \\sqrt{R_{Th}^2 + X_{Th}^2}$!", "<b>PF Correction Capacitor:</b> $Q_C = P(\\tan\\theta_1 - \\tan\\theta_2)$, $C = \\frac{Q_C}{\\omega V_{\\text{rms}}^2}$ (use negative $\\theta$ if leading!).", "<b>Multi-Load Complex Addition (`A2-2 Q14-15` &amp; `A3 Q11`):</b> Convert EVERY load into $S_k = P_k \\pm jQ_k$ (+ lag, $-$ lead), sum $S_{\\text{tot}} = \\sum S_k$, then recover total current $\\mathbf{I}_o = (S_{\\text{tot}} / \\mathbf{V}_s)^*$!"], "walkthrough": {"source": "Assignment 2-2 Q11 & Q15 (= Assignment 3 Q11)", "problem": "(a) `A2-2 Q11`: $V_s$ feeds $20\\,\\Omega$ to $[ (30-j10\\,\\Omega) \\parallel (60+j20\\,\\Omega) ]$. The $60\\,\\Omega$ resistor absorbs $P_{60}=240\\text{ W}$ (current phase $0^\\circ$). Find $V_s$ and total complex power $S_{\\text{tot}}$. (b) `A2-2 Q15`: $220\\angle 0^\\circ\\text{ V}_{\\text{rms}}$ feeds 3 parallel loads: (1) $12\\text{ kW} @ 0.866\\text{ lead}$, (2) $16\\text{ kW} @ 0.85\\text{ lag}$, (3) $20\\text{ kVAR} @ 0.6\\text{ lag}$. Find $\\mathbf{I}_o$.", "steps": ["<b>Part (a):</b> $I_{60}^2(60) = 240 \\implies I_2 = 2\\angle 0^\\circ\\text{ A}_{\\text{rms}}$! Node voltage $V_{\\text{mid}} = 2(60+j20) = 120+j40\\text{ V}$. Branch 1 current $I_1 = \\frac{120+j40}{30-j10} = 3.2+j2.4\\text{ A} \\implies I_{\\text{tot}} = 5.2+j2.4\\text{ A}$. $V_s = 120+j40 + 20(5.2+j2.4) = \\mathbf{224+j88\\text{ V}\\ (240.67\\angle 21.45^\\circ\\text{ V})}$, $S_{\\text{tot}} = V_s I_{\\text{tot}}^* = \\mathbf{1376 - j80\\text{ VA}}$.", "<b>Part (b):</b> Compute $S_1 = 12000 - j12000\\tan(\\cos^{-1}0.866) = 12000 - j6930\\text{ VA}$; $S_2 = 16000 + j16000\\tan(\\cos^{-1}0.85) = 16000 + j9916\\text{ VA}$. Careful on Load 3: given $Q_3=+20\\text{ kVAR}$ at $0.6\\text{ lag} \\implies \\sin\\theta=0.8 \\implies P_3 = 20\\text{ k}\\cdot\\frac{0.6}{0.8} = 15\\text{ kW} \\implies S_3 = 15000 + j20000\\text{ VA}$.", "<b>Total Current:</b> $S_{\\text{tot}} = 43.00 + j22.99\\text{ kVA} \\implies \\mathbf{I}_o = (S_{\\text{tot}}/220)^* = 195.45 - j104.49 = \\mathbf{221.63\\angle -28.13^\\circ\\text{ A}}$!"], "answer": "(a) $V_s = 240.67\\angle 21.45^\\circ\\text{ V},\\ S_{\\text{tot}} = 1376-j80\\text{ VA}$; (b) $\\mathbf{I}_o = 221.63\\angle -28.13^\\circ\\text{ A}$."}, "formula": "$$\\mathbf{S} = \\mathbf{V}_{\\text{rms}}\\mathbf{I}_{\\text{rms}}^* = \\frac{1}{2}\\mathbf{V}_m\\mathbf{I}_m^* \\quad\\Big|\\quad Q_C = P(\\tan\\theta_1 - \\tan\\theta_2) \\quad\\Big|\\quad V_{\\text{HWR, rms}} = \\frac{V_m}{2}$$", "trap": "Two instant traps: (1) Putting $1/2$ in front of ALREADY-RMS values ($240\\text{ V}_{\\text{rms}}$ uses $V_{\\text{rms}}I_{\\text{rms}}^*$, NO $1/2$!); (2) In `A2-2 Q15`, Load 3 gives **$20\\text{ kVAR}$** reactive power, NOT $20\\text{ kW}$!"}, {"title": "12. Transformers, DC Motors & 3-Phase Induction Motors", "topicId": "ec_t12", "tag": "Lectures 11 & 12 • Electrical Machines", "intuition": "A transformer links two coils magnetically so frequency $f$ NEVER changes, while voltage scales by turns ratio $K = N_2/N_1$ and impedance scales by $1/K^2$. Meanwhile an induction motor's rotor MUST lag behind the spinning stator magnetic field (slip $s > 0$) to keep cutting magnetic flux and producing torque!", "bullets": ["<b>Transformer Core &amp; Ideal Ratio (`Lec 11`):</b> $E_1 = 4.44 f N_1 \\Phi_m$, $E_2 = 4.44 f N_2 \\Phi_m$ ($\\Phi_m = B_m A_c$); EMF per turn $= 4.44 f \\Phi_m$; turns ratio $K = \\frac{N_2}{N_1} = \\frac{E_2}{E_1} = \\frac{I_1}{I_2}$; reflected load $Z'_L = \\left(\\frac{N_1}{N_2}\\right)^2 Z_L$.", "<b>Transformer Efficiency &amp; Voltage Regulation:</b> $\\eta = \\frac{x S \\cos\\phi}{x S \\cos\\phi + P_i + x^2 P_{cu,\\text{fl}}}$, where $x = \\text{load fraction}$. Maximum efficiency occurs when Core loss = Copper loss ($P_i = x^2 P_{cu,\\text{fl}} \\implies x = \\sqrt{P_i/P_{cu,\\text{fl}}}$). $\\%\\text{VR} = \\frac{E_2 - V_2}{V_2}\\times 100\\%$.", "<b>DC Motor (`Lec 12`):</b> Back EMF $E_b = V_t - I_a R_a = k\\phi\\omega$, Mechanical Torque $\\tau = k\\phi I_a$; Series motor works on both AC &amp; DC (**Universal Motor**).", "<b>3-Phase Induction Motor (`Lec 12`):</b> Synchronous speed $n_s = \\frac{120 f_e}{P}\\text{ [rpm]}$ ($P$ = poles $= 2 \\times \\text{pole-pairs}$); slip $s = \\frac{n_s - n_m}{n_s}$; rotor current frequency $f_r = s f_e$; shaft torque $\\tau = \\frac{P_{\\text{out}}}{\\omega_m}$ ($1\\text{ hp} = 746\\text{ W}$)."], "walkthrough": {"source": "Lectures 11 & 12 Worked Examples", "problem": "(a) `Lec 11`: $25\\text{ kVA}, 50\\text{ Hz}$ trafo has $N_1=500, N_2=40$? Check `Lec 11` Slide: $25\\text{ kVA}, 50\\text{ Hz}, 1500/240\\text{ V}$ with $N_1=250, N_2=40$: find $\\Phi_m, E_2, I_{1,\\text{fl}}, I_{2,\\text{fl}}$. (b) `Lec 12`: 6-pole, $50\\text{ Hz}$ 3-ph IM runs at $3\\%$ slip delivering $150\\text{ N}\\cdot\\text{m}$? Also check rotor rev/min from $120\\text{ cpm}$: $f_r = 2\\text{ Hz} \\implies s = 2/50 = 4\\%$!", "steps": ["<b>Part (a) (`Lec 11` Slide):</b> $1500 = 4.44(50)(250)\\Phi_m \\implies \\Phi_m = \\frac{1500}{55500} = \\mathbf{27.03\\text{ mWb}}$ (or using $4.44\\to 4.4$: $25\\text{ mWb}$ in rounded slide note). Secondary $E_2 = 1500\\times \\frac{40}{250} = \\mathbf{240\\text{ V}}$; $I_1 = \\frac{25000}{1500} = \\mathbf{16.67\\text{ A}}$, $I_2 = \\frac{25000}{240} = \\mathbf{104.2\\text{ A}}$.", "<b>Part (b) (`Lec 12` 3-pole-pair / 6-pole):</b> $n_s = \\frac{120(50)}{6} = \\mathbf{1000\\text{ rpm}}$. If $f_r = 120\\text{ cycles/min} = 2\\text{ Hz}$, slip $s = \\frac{2}{50} = \\mathbf{0.04\\ (4\\%)}$, so $n_m = 1000(1-0.04) = \\mathbf{960\\text{ rpm}}$ ($\\omega_m = 100.53\\text{ rad/s}$). With $\\tau = 40\\text{ N}\\cdot\\text{m}$, $P_{\\text{out}} = \\tau\\omega_m = \\mathbf{4.02\\text{ kW}}$!"], "answer": "(a) $E_2=240\\text{ V},\\ I_1=16.67\\text{ A},\\ I_2=104.2\\text{ A}$; (b) $n_s=1000\\text{ rpm},\\ s=4\\%,\\ n_m=960\\text{ rpm},\\ P=4.02\\text{ kW}$."}, "formula": "$$E = 4.44 f N \\Phi_m \\qquad\\Big|\\qquad x_{\\max\\eta} = \\sqrt{\\frac{P_i}{P_{cu,\\text{fl}}}} \\qquad\\Big|\\qquad n_s = \\frac{120 f_e}{P}, \\quad s = \\frac{n_s - n_m}{n_s}, \\quad f_r = s f_e$$", "trap": "Two sneaky unit errors in `Lec 12`: (1) **'3 pole-pairs'** means $P = \\mathbf{6\\text{ poles}}$, NOT $P=3$! (2) **'120 alternations/min or cycles/min'** means $f_r = 120/60 = \\mathbf{2\\text{ Hz}}$, so $s = 2/50 = 4\\%$!"}, {"title": "13. Semiconductor Diodes, Zener Regulators & Rectifiers", "topicId": "ec_t13", "tag": "Lecture 13 • Basic Electronics", "intuition": "A PN diode is a one-way valve needing a small $0.7\\text{ V}$ pressure push (Silicon) to open forward, blocking reverse flow until Zener breakdown holds a rock-steady voltage! Four diodes wired into a Bridge flip negative AC humps upright while halving the reverse-voltage rating compared to a center-tapped transformer.", "table": {"headers": ["Rectifier Topology", "Diodes", "Real Peak Output (Si)", "Ideal Avg V_dc", "Peak Inverse (PIV)", "Output Ripple"], "rows": [["Half-Wave (HWR)", "1", "V_m - 0.7 V", "V_m / pi (0.318 V_m)", "V_m", "1 f_in"], ["Center-Tap FWR", "2", "V_m - 0.7 V (each half)", "2 V_m / pi (0.637 V_m)", "2 V_m", "2 f_in"], ["Bridge FWR", "4", "V_m - 1.4 V (2 in series)", "2 V_m / pi (0.637 V_m)", "V_m", "2 f_in"]]}, "bullets": ["<b>Diode Knee Voltages ($V_\\gamma$):</b> Ideal $= 0\\text{ V}$, <b>Schottky $= 0.25\\text{ V}$</b>, <b>Germanium $= 0.3\\text{ V}$</b>, <b>Silicon $= 0.7\\text{ V}$</b>, <b>GaAs $= 1.2\\text{ V}$</b>.", "<b>Half-Wave vs Full-Wave RMS &amp; Efficiency:</b> HWR $V_{\\text{rms}} = V_m/2$, max $\\eta = 40.6\\%$, Ripple Factor $\\gamma = \\sqrt{(V_{\\text{rms}}/V_{\\text{dc}})^2 - 1} = 1.21$; FWR $V_{\\text{rms}} = V_m/\\sqrt{2}$, max $\\eta = 81.2\\%$, Ripple Factor $\\gamma = 0.482$.", "<b>Zener Voltage Regulator (`Lec 13`):</b> Reverse-biased in breakdown region with limiting series $R_s$: $I_s = \\frac{V_{\\text{in}} - V_Z}{R_s} = I_Z + I_L$; verify $P_Z = V_Z I_Z \\le P_{Z,\\max}$!"], "walkthrough": {"source": "Lecture 13 Rectifier & Zener Checklist", "problem": "(a) Compare $24\\text{ V}_{\\text{rms}}$ Bridge FWR (Si diodes) vs Center-Tap FWR ($24\\text{ V}_{\\text{rms}}$ per half) for $V_{o,\\text{pk}}$, $V_{\\text{dc}}$, and PIV. (b) Find Zener current $I_Z$ when $V_{\\text{in}}=18\\text{ V},\\ R_s=200\\,\\Omega,\\ V_Z=10\\text{ V},\\ R_L=1\\text{ k}\\Omega$.", "steps": ["<b>Part (a) Bridge FWR:</b> $V_m = 24\\sqrt{2} = 33.94\\text{ V}$. Because TWO diodes conduct in series each half-cycle, $V_{o,\\text{pk}} = 33.94 - 2(0.7) = \\mathbf{32.54\\text{ V}}$, $V_{\\text{dc}} \\approx \\frac{2(32.54)}{\\pi} = \\mathbf{20.72\\text{ V}}$, and $\\text{PIV} = V_m = \\mathbf{33.94\\text{ V}}$.", "<b>Center-Tap FWR:</b> Only ONE diode drops per half-cycle $\\implies V_{o,\\text{pk}} = 33.94 - 0.7 = \\mathbf{33.24\\text{ V}}$, $V_{\\text{dc}} = \\mathbf{21.16\\text{ V}}$, BUT the idle diode faces $\\text{PIV} = 2V_m = \\mathbf{67.88\\text{ V}}$!", "<b>Part (b) Zener:</b> Load gets $V_Z = 10\\text{ V} \\implies I_L = \\frac{10}{1000} = 10\\text{ mA}$. Series $I_s = \\frac{18-10}{200} = 40\\text{ mA} \\implies I_Z = 40 - 10 = \\mathbf{30\\text{ mA}}$ ($P_Z = 10\\times 0.03 = 300\\text{ mW}$)."], "answer": "(a) Bridge PIV $= 33.94\\text{ V}$ vs Center-Tap PIV $= 67.88\\text{ V}$; (b) $I_Z = 30\\text{ mA}$ ($0.3\\text{ W}$)."}, "formula": "$$V_{\\gamma}:\\ \\text{Si}=0.7\\text{ V},\\ \\text{Ge}=0.3\\text{ V},\\ \\text{Schottky}=0.25\\text{ V} \\qquad\\Big|\\qquad V_{\\text{dc, Bridge}} = \\frac{2(V_m - 1.4)}{\\pi}$$", "trap": "For a Bridge FWR, ALWAYS subtract **$2\\times 0.7 = 1.4\\text{ V}$** from $V_m$ (two Si diodes conduct simultaneously!), and remember Center-Tap FWR has **$\\text{PIV} = 2 V_m$** while Bridge FWR has **$\\text{PIV} = V_m$**!"}], "practice": [{"id": "ec_q1", "src": "Quiz / Lab", "level": "Quiz 1 '23 Q1 & Ch-1 Q4", "q": "(a) $600\\text{ W}$ TV runs $4\\text{ h}$ at Rs. $10/\\text{kWh}$ + $0.8\\text{ Ah}, 6\\text{ V}$ battery lasting $10\\text{ h}$: find cost, current, power, Wh. (b) $i(t) = 3 e^{-2t}\\text{ mA}$ with $v(t) = 5\\frac{di}{dt}\\text{ mV}$ (`Ch-1 Q4`): find charge ($0..2\\text{ s}$) &amp; energy absorbed in $3\\text{ s}$.", "hint": "$q = \\int i\\,dt$, $W = \\int v i\\,dt$.", "sol": "(a) $2.4\\text{ kWh} \\implies$ Rs. $24$; $I=80\\text{ mA}$, $P=0.48\\text{ W}$, $E=4.8\\text{ Wh}$.\n(b) $q = \\int_0^2 3e^{-2t}\\text{ mA}\\,dt = 1.5(1-e^{-4})\\text{ mC} = \\mathbf{1.473\\text{ mC}}$. Taking $v = 5\\frac{d(3e^{-2t})}{dt}\\text{ mV} = -30e^{-2t}\\text{ mV}$, $p(t) = v i = -90e^{-4t}\\,\\mu\\text{W} \\implies W(3) = \\int_0^3 p\\,dt = -22.5(1-e^{-12})\\,\\mu\\text{J}$ (Sadiku 1.15 variant with $6e^{-2t}\\text{ mA}$ &amp; $5\\frac{di}{dt}\\text{ V}$ yields $2.945\\text{ mC}$ and $-180\\,\\mu\\text{J}$)."}, {"id": "ec_q2", "src": "Midsem / Endsem", "level": "ELE103T Quiz 1 Q1", "q": "Three $120\\text{ V}$ bulbs rated $30\\text{ W}, 40\\text{ W}, 50\\text{ W}$ are connected across $120\\text{ V}$ in parallel and in series. Find powers &amp; brightest bulb in each.", "hint": "$R = V_{\\text{rated}}^2 / P_{\\text{rated}}$.", "sol": "$R_{30}=480\\,\\Omega$, $R_{40}=360\\,\\Omega$, $R_{50}=288\\,\\Omega$.\nParallel: each gets $120\\text{ V} \\implies 30\\text{ W}, 40\\text{ W}, 50\\text{ W}$ (**$50\\text{ W}$ brightest**).\nSeries: $I=120/1128 = 0.1064\\text{ A} \\implies P_{30}=5.43\\text{ W}, P_{40}=4.07\\text{ W}, P_{50}=3.26\\text{ W}$ (**$30\\text{ W}$ brightest**!)."}, {"id": "ec_q3", "src": "Quiz / Lab", "level": "Quiz 1 '23 Q2 & ECE-M Q5", "q": "Compute $R_{\\text{eq}}$ &amp; $I_o$ for `Quiz 1 Q2` ($24\\text{ V}$ into top $\\Delta(20,60,40)$, bottom $10\\,\\Omega$ left, $50+20\\,\\Omega$ right) and `ECE-Midsem Q5` ($60\\text{ V}$ into $2.5\\times$ scaled bridge).", "hint": "Convert top $\\Delta(20,60,40)$ to $Y$: $10\\,\\Omega$, $20/3\\,\\Omega$, $20\\,\\Omega$.", "sol": "$\\Delta \\to Y$ top gives $R_{\\text{top}}=10\\,\\Omega$, left leg $20/3$, right leg $20$. Bottom parallel $= (50/3)\\parallel 90 = 14.0625\\,\\Omega \\implies R_{\\text{eq}} = 24.0625\\,\\Omega,\\ I_o = 0.9974\\text{ A}$.\nScaled `ECE-Midsem Q5`: $R_{\\text{eq}} = 60.1563\\,\\Omega,\\ I_o = 60/60.1563 = 0.9974\\text{ A}$."}, {"id": "ec_q4", "src": "Midsem / Endsem", "level": "ECE-Midsem Q8b & Q8 (Rab)", "q": "Find $R_{ab}$: terminal $a \\to 24\\,\\Omega \\to C$, and between $C$ and $b$ sit three parallel paths: $27\\,\\Omega$, $13.5\\,\\Omega$, and $[ (30\\parallel 7.5 + 1.5)\\parallel 30 + 3 ]\\,\\Omega$.", "hint": "Collapse right-most ladder backward: $30\\parallel 7.5 = 6\\,\\Omega$.", "sol": "$30\\parallel 7.5 = 6\\,\\Omega \\implies +1.5 = 7.5\\,\\Omega \\implies 7.5\\parallel 30 = 6\\,\\Omega \\implies +3 = 9\\,\\Omega$.\nThen $27 \\parallel 13.5 \\parallel 9 = \\frac{1}{1/27 + 2/27 + 3/27} = 4.5\\,\\Omega$.\n$R_{ab} = 24 + 4.5 = 28.5\\,\\Omega$."}, {"id": "ec_q5", "src": "Quiz / Lab", "level": "ELE103T 19C66 Q4 & Q6", "q": "(a) `Fig 1`: $100\\text{ V} \\to 16\\,\\Omega \\to A(35\\parallel\\dots)$ ($A$-$B: 15$, $A$-$C: 30$, $B$-$C: 10$, $B$-gnd $12$, $C$-gnd $20$). Find $V_A$. (b) Write inspection $[G][V]=[I]$ for `Fig 3` ($20\\text{ mA}$ at $1$, $5\\text{ mA}$ $3\\to 2$, $10\\text{ mA}$ at $3$).", "hint": "Convert $\\Delta(15,30,10)$ or write $3\\times 3$ nodal at $A,B,C$.", "sol": "(a) $3\\times 3$ nodal or $\\Delta\\to Y$ reduction yields $V_A = 42.18\\text{ V}$.\n(b) At $1,2,3$ in k$\\Omega$: $G_{11}=1.75\\text{ mS}, G_{22}=1\\text{ mS}, G_{33}=1.25\\text{ mS}$; off-diags $-0.25, -1, -0.25\\text{ mS}$; $I=[20, 5, 5]\\text{ mA} \\implies v_1=36.43\\text{ V}, v_2=23.57\\text{ V}, v_3=37.86\\text{ V},\\ P_{1\\text{k}}=2.04\\text{ mW}$."}, {"id": "ec_q6", "src": "Quiz / Lab", "level": "Quiz 1 '23 Q3 & Ch-3 Supernode", "q": "(a) Solve `Quiz 1 Q3` supermesh ($i_1-i_2=4$, $8\\text{ V}$ left, $2,4,8\\,\\Omega$, $1\\,\\Omega$ in series with $4\\text{ A}$). (b) Solve `ECE-Midsem Q2` supernode ($12\\text{ V}$ $A$-$C$, $6\\text{ V}$ $B$-$C$, $4\\text{ k}$ at $A$, $6\\text{ k}$ at $C$, $6\\text{ mA}$ at $B$) for $V_o = v_C$.", "hint": "In (a), drop $1\\,\\Omega$ in Supermesh KVL; in (b), wrap ONE bubble around all 3 nodes $A,B,C$!", "sol": "(a) $i_1-i_2=4,\\ -2i_1-4i_2+8i_3=0,\\ 2i_1+12i_2-6i_3=8 \\implies i_1=4.632\\text{ A}, i_2=0.632\\text{ A}, i_3=1.474\\text{ A}$.\n(b) $\\frac{v_C+12}{4\\text{k}} + \\frac{v_C}{6\\text{k}} = 6\\text{ mA} \\implies V_o = 7.2\\text{ V}$."}, {"id": "ec_q7", "src": "Quiz / Lab", "level": "Quiz 1 '23 Q4 & ECE-M Q7", "q": "(a) Find $i_o$ in `Quiz 1 Q4` ($60\\text{ V}, 4\\text{ \\& }10\\,\\Omega$, $8,2\\,\\Omega$, dep $3i_o$). (b) Find $V_o$ &amp; $P_{5\\Omega}$ in `ECE-Midsem Q7` ($40\\text{ V}$+$1\\,\\Omega$ left, $5\\text{ A}\\rightarrow \\parallel 2\\,\\Omega$ to $V_o$, $5\\,\\Omega$ to gnd, $8\\,\\Omega$+$(-20\\text{ V})$ right).", "hint": "Substitute $i_o = (60-v_T)/4$ in (a); apply Nodal at $v_L$ and $V_o$ in (b).", "sol": "(a) $v_T=53.08\\text{ V}, v_M=62.88\\text{ V} \\implies i_o = 1.731\\text{ A}$.\n(b) $\\frac{v_L-40}{1}+\\frac{v_L-V_o}{2}+5=0$ and $\\frac{V_o-v_L}{2}-5+\\frac{V_o}{5}+\\frac{V_o+20}{8}=0 \\implies V_o = 21.52\\text{ V},\\ P_{5\\Omega} = 92.61\\text{ W}$."}, {"id": "ec_q8", "src": "Midsem / Endsem", "level": "ELE103T 19C66 Q7 Fig 4", "q": "Node $v_L$ has $8\\,\\Omega$ (with $I_o\\downarrow$), $4\\text{ A}\\rightarrow$ to $v_M$, $1\\,\\Omega$ to $v_R$. Node $v_M$ has $2\\,\\Omega$ to gnd &amp; dependent VCVS $2I_o$ ($-$ left/$+$ right) to $v_R$ ($4\\,\\Omega$ to gnd). Find $I_o$.", "hint": "Form Supernode $(v_M, v_R)$ with $v_R = v_M + 2I_o = v_M + v_L/4$!", "sol": "KCL $v_L$: $\\frac{v_L}{8} + (v_L - v_M - \\frac{v_L}{4}) + 4 = 0 \\implies 7v_L - 8v_M = -32$.\nSupernode: $-4 + \\frac{v_M}{2} + \\frac{v_R}{4} + (v_R - v_L) = 0 \\implies -11v_L + 28v_M = 64$.\n$v_L = -3.556\\text{ V} \\implies I_o = -3.556/8 = -0.4444\\text{ A}$."}, {"id": "ec_q9", "src": "Quiz / Lab", "level": "Quiz 1 '23 Q5-6 & ECE-M Q3", "q": "(a) `ECE-Midsem Q3` Superposition: $10\\text{ A}\\uparrow$ left feeds $(2\\,\\Omega \\parallel 2\\,\\Omega)$ down to $V_o$ node ($1\\,\\Omega$ to gnd), right $14\\,\\Omega + 18\\text{ V}$ ($+$ top). Find $V_o$. (b) Obtain $v_o = -6.6\\text{ V}$ in `Quiz 1 Q6` via Source Transformation.", "hint": "In (a), $(2\\parallel 2)+1 = 2\\,\\Omega$ center leg receives current divider $14/(2+14)$ from $10\\text{ A}$ and $18/(14+2)$ from $18\\text{ V}$!", "sol": "(a) $10\\text{ A}$ pass: $10\\times\\frac{14}{16} = 8.75\\text{ V}$. $18\\text{ V}$ pass: $\\frac{18}{16}\\times 1 = 1.125\\text{ V} \\implies V_o = 9.875\\text{ V}$.\n(b) Converting $3\\text{ A}\\parallel 4\\,\\Omega, 2\\text{ A}\\parallel 9\\,\\Omega, 6\\text{ A}\\parallel 5\\,\\Omega$ forms one $20\\,\\Omega$ loop pushing $66\\text{ V}$ CW $\\implies I=3.3\\text{ A}$ hitting $-$ of $v_o \\implies v_o = -6.6\\text{ V}$."}, {"id": "ec_q10", "src": "Midsem / Endsem", "level": "ECE-Midsem Q4 & Ch-4 Max Power", "q": "(a) Find optimal $R$ and $P_{\\max}$ in `ECE-Midsem Q4` ($10\\text{ V}-3\\,\\Omega-v_x$; $(12\\,\\Omega+10\\text{ V})$ &amp; $R$ from $v_x$ to $v_y$; $5\\,\\Omega \\parallel 16\\text{ A}\\downarrow$ at $v_y$). (b) Solve diamond bridge `Ch-4 Q2` ($40\\text{ V}, 80, 10, 20, 90\\,\\Omega$).", "hint": "In both bridges, short V-sources &amp; open I-sources for $R_{Th}$!", "sol": "(a) $R_{Th} = (3+5)\\parallel 12 = 4.8\\,\\Omega$; $v_x=-5\\text{ V}, v_y=-55\\text{ V} \\implies V_{Th}=50\\text{ V} \\implies P_{\\max} = \\frac{2500}{19.2} = 130.21\\text{ W}$.\n(b) $R_{Th} = (80\\parallel 20) + (10\\parallel 90) = 16+9 = 25\\,\\Omega$; $|V_{Th}| = 36-8 = 28\\text{ V} \\implies P_{\\max} = 7.84\\text{ W}$."}, {"id": "ec_q11", "src": "Midsem / Endsem", "level": "ELE103T 2018 Q3 & Ch-4 Q1,Q3", "q": "(a) `ELE103T Q3`: $6\\text{ A}\\uparrow \\parallel 16\\,\\Omega$ feeds $6\\text{ V}$ ($+$ left) to $4\\,\\Omega$ (right) &amp; $20\\,\\Omega$ (bot). Find $I_{4\\Omega}$ by Thevenin. (b) State what changes when computing $R_{Th}$ with a dependent source ($2v_x$) vs independent-only.", "hint": "Transform $6\\text{ A}\\parallel 16\\,\\Omega \\to 96\\text{ V}, 16\\,\\Omega$ in (a); apply $1\\text{ V}$ test probe in (b).", "sol": "(a) Remove $4\\,\\Omega$: $V_{Th} = 96 - 6 = 90\\text{ V}$, $R_{Th} = 16+20 = 36\\,\\Omega \\implies I_{4\\Omega} = 90/(36+4) = 2.25\\text{ A}$.\n(b) Turn off ONLY independent sources (keep $2v_x$ active!) and inject $V_{\\text{test}}=1\\text{ V}$ (or find $V_{oc}/I_{sc}$)."}, {"id": "ec_q12", "src": "Quiz / Lab", "level": "ECE-Midsem Q1 & Q8a & Ch-6", "q": "(a) `ECE-Midsem Q1`: Find DC steady voltages $V_1$ ($C_1\\parallel 40$) &amp; $V_2$ ($C_2$ after $20\\,\\Omega$ from $10\\text{ \\& }30$ junction fed by $50\\text{ V}$). (b) `Q8a`: $50\\text{ mH} \\parallel 2.5\\text{ k}\\Omega$ has $i_L = 50 e^{-100t}\\text{ mA}$: find $v_L, v_R, W_L(0)$.", "hint": "$C_2$ is open so $I_{20\\Omega}=0 \\implies V_2 = V_X$; $v_L = v_R$ in parallel!", "sol": "(a) $I = 50/(10+30+40) = 0.625\\text{ A} \\implies V_1 = 0.625(40) = 25\\text{ V},\\ V_2 = 0.625(70) = 43.75\\text{ V}$.\n(b) $v_L = v_R = L\\frac{di}{dt} = 0.05(-5e^{-100t}) = -0.25 e^{-100t}\\text{ V}$; $W_L(0) = \\frac{1}{2}(0.05)(0.05)^2 = 62.5\\,\\mu\\text{J}$."}, {"id": "ec_q13", "src": "Quiz / Lab", "level": "Ch-6 Caps & Inductors", "q": "(a) $5\\text{ mH}$ inductor has $i(t)$ rising $0\\to 10\\text{ A}$ ($0..2\\text{ ms}$), flat ($2..4\\text{ ms}$), falling $10\\to 0\\text{ A}$ ($4..6\\text{ ms}$): find $v_L(1,3,5\\text{ ms})$. (b) $5\\text{ H}$ inductor gets $v(t)=30t^2$ ($i(0)=0$): find $W_L(5\\text{ s})$ (`ELE103T Q2`).", "hint": "$v = L\\,di/dt$; integrate $\\frac{1}{5}\\int 30 t^2 dt$ for $i(t)$.", "sol": "(a) Slopes $+5000, 0, -5000\\text{ A/s} \\implies v_L = +25\\text{ V}, 0\\text{ V}, -25\\text{ V}$.\n(b) $i(t) = 2t^3 \\implies i(5) = 250\\text{ A} \\implies W_L(5) = 0.5(5)(250^2) = 156.25\\text{ kJ}$."}, {"id": "ec_q14", "src": "Midsem / Endsem", "level": "Lec 6a-b & Ch-7 First Order", "q": "(a) Switch closed long ($12\\text{ V}\\to 2\\,\\Omega \\to [\\text{sw}]\\to 4\\,\\Omega\\parallel 3\\text{ F}$) OPENS at $t=0$: find $v_o(t)$ for $t>0$. (b) Switch flips from $A$ ($40\\text{ V}-5\\text{k}\\Omega-10\\,\\mu\\text{F}$) to $B$ ($2\\text{k}\\Omega$) at $t=0$: find $v_C(t)$ and time to decay to $1/3$.", "hint": "Use $x(t)=x(\\infty)+[x(0^+)-x(\\infty)]e^{-t/\\tau}$.", "sol": "(a) $v_o(0^-)=12\\frac{4}{6}=8\\text{ V},\\ v_o(\\infty)=0,\\ \\tau=12\\text{ s} \\implies v_o(t)=8e^{-t/12}\\text{ V}$.\n(b) $v_C(0^+)=40\\text{ V},\\ \\tau=(2\\text{k})(10\\mu)=0.02\\text{ s} \\implies v_C(t)=40e^{-50t}\\text{ V}$; decays to $1/3$ at $t=\\frac{\\ln 3}{50} = 21.97\\text{ ms}$."}, {"id": "ec_q15", "src": "Midsem / Endsem", "level": "Lec 6b Step RL/RC", "q": "In an $RL$ circuit ($L=2\\text{ H}$), $i_L(0^-)=2\\text{ A}$. At $t=0$, source switches in giving $R_{Th}=4\\,\\Omega$ and $i_L(\\infty)=5\\text{ A}$. Find $i_L(t)$ and $v_L(t)$ for $t > 0$.", "hint": "$\\tau = L/R_{Th} = 0.5\\text{ s}$; differentiate $i_L$ for $v_L$.", "sol": "$\\tau = 2/4 = 0.5\\text{ s}$. $i_L(t) = 5 + (2-5)e^{-2t} = 5 - 3e^{-2t}\\text{ A}$ ($t \\ge 0$).\n$v_L(t) = L\\frac{di_L}{dt} = 12 e^{-2t}\\text{ V}$ ($t > 0$; jumps from $0$ to $12\\text{ V}$ at $t=0^+$!)."}, {"id": "ec_q16", "src": "Quiz / Lab", "level": "Lec 8 Phasor Basics", "q": "(a) Convert $-4\\sin(30t + 50^\\circ)$ to cosine phasor. (b) Which leads and by how much: $i_1 = 4\\cos(\\omega t + 10^\\circ)$ vs $i_2 = -5\\cos(\\omega t - 35^\\circ)$? (c) Find $i(t)$ through $50\\,\\mu\\text{F}$ under $v = 6\\cos(100t-30^\\circ)\\text{ V}$.", "hint": "$-\\sin x = \\cos(x + 90^\\circ)$; $-\\cos x = \\cos(x + 180^\\circ)$!", "sol": "(a) $4\\cos(30t+140^\\circ) \\leftrightarrow 4\\angle 140^\\circ$.\n(b) $i_2 = 5\\cos(\\omega t + 145^\\circ)$, so $i_2$ leads $i_1$ by $145^\\circ - 10^\\circ = 135^\\circ$.\n(c) $\\mathbf{I} = j(100)(50\\,\\mu\\text{F})(6\\angle -30^\\circ) = 0.03\\angle 60^\\circ\\text{ A} \\implies 30\\cos(100t+60^\\circ)\\text{ mA}$."}, {"id": "ec_q17", "src": "Assignment / Tutorial", "level": "A2-2 Q1 & Q2", "q": "(a) `A2-2 Q1` Nodal: find $\\mathbf{I}$ through $-j2\\,\\Omega$ ($20\\angle -90^\\circ\\text{ V}\\to 2\\,\\Omega \\to V_1$; $V_1\\leftrightarrow V_2$ via $5\\angle 0^\\circ\\text{ A}$ top + $j1\\,\\Omega$ mid; $2\\mathbf{I}\\uparrow$ &amp; $4\\,\\Omega$ at $V_2$). (b) `A2-2 Q2` Mesh: find $I_o, V_o$.", "hint": "Watch $j\\mathbf{V}_1$ cancel cleanly at $V_2$ in Q1!", "sol": "(a) $V_2(0.25-j1)=5 \\implies V_2=4.851\\angle 75.96^\\circ\\text{ V}$; then $(0.5-j0.5)V_1+jV_2 = -5-j10 \\implies \\mathbf{I}=V_1/(-j2) = 7.906\\angle 43.49^\\circ\\text{ A}$.\n(b) $I_2 = \\frac{8}{8+j2}(4\\angle -30^\\circ) = 3.881\\angle -44.04^\\circ\\text{ A},\\ V_o = 1.940\\angle 45.96^\\circ\\text{ V}$."}, {"id": "ec_q18", "src": "Assignment / Tutorial", "level": "A2-2 Q3 & Assignment 3 Q4", "q": "Find $i_o(t)$ in `Assignment 3 Q4`: $20\\cos(4t)\\text{ V} \\to 4\\,\\Omega \\to$ central $1\\text{ H}$ ($i_o\\downarrow$) $\\to 2\\,\\Omega \\to 16\\text{ V DC}$ ($+$ top).", "hint": "Two frequencies ($\\omega=0$ DC and $\\omega=4\\text{ rad/s}$ AC) $\\implies$ Superposition!", "sol": "1) DC ($20\\cos 4t$ short, $1\\text{ H}$ short): $i_{o,\\text{DC}} = 16/2 = 8\\text{ A}$.\n2) AC ($16\\text{ V}$ short, $Z_L=j4$): Nodal $(V-20)/4 + V/(j4) + V/2 = 0 \\implies V = 6+j2 \\implies I_{o,\\text{AC}} = V/(j4) = 1.581\\angle -71.57^\\circ\\text{ A}$.\n$i_o(t) = 8 + 1.581\\cos(4t - 71.57^\\circ)\\text{ A}$."}, {"id": "ec_q19", "src": "Assignment / Tutorial", "level": "Assignment 3 Q1 & Q2", "q": "(a) `A3 Q1`: $120\\angle -15^\\circ\\text{ V} \\to (40+j20\\,\\Omega) \\to V$; $6\\angle 30^\\circ\\text{ A}\\downarrow$, $-j30\\,\\Omega \\parallel 50\\,\\Omega$ at $V$: find $\\mathbf{V}$. (b) `A3 Q2`: $v_1=10\\cos 4t$, $v_2=20\\cos(4t-30^\\circ)$ around $(1\\Omega,1\\text{ H})$ meshes sharing $(1\\text{ F} + 1\\Omega)$: find $\\mathbf{I}_1, \\mathbf{I}_2$.", "hint": "At $\\omega=4$: $Z_{1\\text{H}}=j4$, $Z_{1\\text{F}}=-j0.25$.", "sol": "(a) Nodal: $V(0.036 - j0.01 + j0.0333) = \\frac{120\\angle -15^\\circ}{40+j20} - 6\\angle 30^\\circ \\implies V = 124.08\\angle -153.96^\\circ\\text{ V}$.\n(b) Mesh: $[2+j3.75,\\ -(1-j0.25);\\ -(1-j0.25),\\ 2+j3.75][I_1, I_2]^T = [10, -20\\angle -30^\\circ]^T \\implies I_1 = 2.741\\angle -41.07^\\circ\\text{ A},\\ I_2 = 4.114\\angle 92.00^\\circ\\text{ A}$."}, {"id": "ec_q20", "src": "Assignment / Tutorial", "level": "A2-2 Q4 & Q6", "q": "Find Norton $(\\mathbf{I}_N, \\mathbf{Z}_N)$ at $a$-$b$: (a) $50\\angle 30^\\circ\\text{ V} \\to j20\\,\\Omega \\to (-j10\\,\\Omega \\text{ to ref}) \\to 10\\,\\Omega \\to a$; (b) $4\\angle 0^\\circ\\text{ A} \\parallel 8\\,\\Omega \\to -j5\\,\\Omega \\to a$ with $j10\\,\\Omega \\parallel a$-$b$.", "hint": "Remember shorting $a$-$b$ for $\\mathbf{I}_N$ shorts out $j10\\,\\Omega$ in (b)!", "sol": "(a) $\\mathbf{Z}_N = 10 + (j20\\parallel -j10) = 10 - j20\\,\\Omega$; $\\mathbf{V}_{Th} = 50\\angle 30^\\circ\\frac{-j10}{j10} = -50\\angle 30^\\circ \\implies \\mathbf{I}_N = 2.236\\angle -86.57^\\circ\\text{ A}$.\n(b) $\\mathbf{Z}_N = (8-j5)\\parallel j10 = 10\\angle 25.99^\\circ\\,\\Omega$; $\\mathbf{I}_N = \\frac{4\\times 8}{8-j5} = 3.392\\angle 32.01^\\circ\\text{ A}$."}, {"id": "ec_q21", "src": "Quiz / Lab", "level": "Lec 10 & A2-2 Q10-12", "q": "(a) `A2-2 Q10`: $165\\angle 0^\\circ\\text{ V}_{\\text{rms}} \\to 10\\,\\Omega \\to [j4\\,\\Omega \\parallel (8-j6\\,\\Omega)]$: find overall pf &amp; $P$. (b) `A2-2 Q12`: $120\\angle 10^\\circ\\text{ V}_{\\text{rms}}$ feeds $60\\angle -30^\\circ\\,\\Omega \\parallel 40\\angle 45^\\circ\\,\\Omega$: find $|S|, P, Q, \\text{pf}$.", "hint": "Compute $Z_{\\te
